<!DOCTYPE html>
<html lang="nl" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Behind the Front Door — Spelbord · Zig Grow</title>
<style>
  :root{--blue:#1F5AFF;--orange:#FF9000;--navy:#152330;--ink:#152330;--muted:#5B6472;--line:#E4E3DC;--bg:#FBF7EE;
    --card:#FFFFFF;--warn:#E4572E;--soft:#EAF0FF;--softwarm:#FFF1E0;--shadow:0 10px 30px rgba(21,35,48,.10);--shadow-sm:0 4px 14px rgba(21,35,48,.07);}
  @media (prefers-color-scheme:dark){:root{--ink:#EDF1F7;--muted:#9AA7BD;--line:#26324A;--bg:#0D1626;--card:#131E31;--soft:#16233D;--softwarm:#2A2010;--shadow:0 10px 30px rgba(0,0,0,.45);--shadow-sm:0 4px 14px rgba(0,0,0,.35);}}
  @font-face{font-family:'Safiro';src:url('assets/Safiro-SemiBold.otf') format('opentype');font-weight:600 900;font-display:swap}
  .brandline h1,.rpill,.announce,.yourturn,.gc .ct,#setupH,#scoresH,#standH,.result .rh{font-family:'Safiro','Arial',sans-serif}
  *{box-sizing:border-box}html,body{margin:0}
  body{font-family:Arial,Helvetica,"Segoe UI",sans-serif;color:var(--ink);min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased;
    background:linear-gradient(rgba(13,21,36,.34),rgba(11,19,34,.55)) fixed, url('assets/bg-board.jpg') center center/cover fixed, #0d1524}
  .wrap{max-width:1200px;margin:0 auto;padding:0 18px 70px}
  button{font-family:inherit}.logo{height:30px;width:auto;display:block}
  header.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line)}
  .top-in{max-width:1200px;margin:0 auto;padding:11px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brandline{display:flex;align-items:center;gap:13px;min-width:0}.brandline h1{font-size:17px;margin:0;font-weight:800;letter-spacing:-.2px;white-space:nowrap}.brandline .sub{color:var(--muted);font-size:12px;white-space:nowrap}
  .spacer{flex:1 1 auto}
  .join-chip{display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px}.join-chip b{font-family:Consolas,monospace;letter-spacing:2px;color:var(--blue)}
  .netchip{font-size:12px;font-weight:800;padding:6px 10px;border-radius:9px;white-space:nowrap}.netchip.live{background:#e5f7ee;color:#137a44}.netchip.off{background:#fff1e0;color:#b3391b}
  .btn{border:0;border-radius:11px;padding:9px 15px;font-size:14px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.06);transition:transform .05s,filter .15s}
  .btn:hover{filter:brightness(1.06)}.btn:active{transform:translateY(1px)}
  .btn.ghost{background:transparent;color:var(--blue);border:1.5px solid var(--blue);box-shadow:none}
  .btn.soft{background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none}.btn.warn{background:var(--orange)}
  .btn.sm{padding:6px 11px;font-size:12.5px;border-radius:9px}.btn.big{padding:13px 22px;font-size:16px;border-radius:13px}.btn:disabled{opacity:.45;cursor:default;filter:none}
  .roundbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0 6px}
  .roundbar .rpill{background:var(--navy);color:#fff;border-radius:999px;padding:7px 15px;font-weight:800;font-size:14px}
  .roundbar .rpill .n{color:var(--orange);margin-inline-end:6px}
  .hint{color:var(--muted);font-size:13.5px;margin:2px 2px 16px}
  #roundHint{color:#c6d1e6}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px}
  .panel h2{margin:0 0 12px;font-size:14px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted)}
  .coins{font-weight:800;font-size:12.5px;color:#7a4100;border:1px solid #e7b768;border-radius:20px;padding:2px 9px;white-space:nowrap;background:linear-gradient(180deg,#ffe392,#f3b73f);box-shadow:inset 0 1px 0 rgba(255,255,255,.65)}
  .mrow{display:flex;gap:5px;align-items:center;font-size:11px;margin:3px 0}
  .mrow .ml{flex:0 0 96px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar{position:relative;flex:1;height:9px;border-radius:6px;border:1px solid #d7cfbd;background:repeating-linear-gradient(90deg,#ece5d6 0,#ece5d6 calc(5% - 1px),#d1c9b6 calc(5% - 1px),#d1c9b6 5%);overflow:hidden}
  @media (prefers-color-scheme:dark){.bar{border-color:#2c3852;background:repeating-linear-gradient(90deg,#1b2740 0,#1b2740 calc(5% - 1px),#2c3852 calc(5% - 1px),#2c3852 5%)}}
  .bar>span{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--blue),#4d7bff);transition:width .4s cubic-bezier(.4,1.3,.5,1)}
  .bar.red>span{background:linear-gradient(90deg,var(--warn),#ff7a54)}
  .mv{flex:0 0 20px;text-align:right;font-weight:800;font-size:11px}
  .miniflag{font-size:9.5px;font-weight:800;color:#fff;background:var(--warn);border-radius:5px;padding:1px 5px}
  .minichance{margin-top:7px;border-radius:9px;padding:6px 8px;font-size:11.5px;border:1px solid}
  .minichance.good{background:#e9f9f0;border-color:#8fddb4;color:#137a44}.minichance.bad{background:#fdeee9;border-color:#f2b3a1;color:#b3391b}
  @media (prefers-color-scheme:dark){.minichance.good{background:#12301f;border-color:#1f5a3a}.minichance.bad{background:#331912;border-color:#5a2a1c}}
  .stage{min-height:380px;display:flex;flex-direction:column;justify-content:center}
  .announce{text-align:center;padding:16px 14px;border-radius:16px;color:#fff;font-weight:900;font-size:22px;letter-spacing:.3px;margin-bottom:12px;box-shadow:var(--shadow);animation:announce .75s cubic-bezier(.2,.9,.3,1.2) both}
  .announce .sub{font-size:13px;font-weight:700;opacity:.92;margin-top:3px}
  @keyframes announce{0%{opacity:0;transform:scale(.6) translateY(18px)}45%{opacity:1;transform:scale(1.05)}72%{transform:scale(.98)}100%{transform:scale(1)}}
  .gc{border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:0 16px 34px rgba(0,0,0,.24),0 3px 0 rgba(0,0,0,.10);transform-origin:center;max-width:100%;margin:0 auto}
  .gc.deal{animation:deal .7s cubic-bezier(.2,.9,.3,1.1) both}
  @keyframes deal{0%{opacity:0;transform:translateY(30px) rotateY(70deg) scale(.92)}55%{opacity:1;transform:translateY(0) rotateY(-5deg) scale(1.01)}100%{transform:none}}
  .gc .illo{width:min(220px,70%);aspect-ratio:1/1;margin:14px auto 2px;border-radius:12px;background-size:cover;background-position:center;box-shadow:0 6px 16px rgba(0,0,0,.2);position:relative;overflow:hidden}
  .gc .illo .kind{position:absolute;left:0;bottom:0;padding:5px 12px;font-size:10px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:#fff;border-top-right-radius:10px}
  .gc.task .illo .kind{background:var(--blue)}.gc.shock .illo .kind{background:var(--warn)}
  .gc .body{padding:14px}.gc .ct{font-size:18px;font-weight:800;margin:0 0 7px;letter-spacing:-.2px}.gc .cx{font-size:14px;margin:0 0 9px}
  .gc .meta{font-size:12.5px;color:var(--muted);margin:8px 0 0}.gc .meta b{color:var(--ink)}
  .tag{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:2px 7px;margin:3px 4px 0 0}
  .tag.pay{background:var(--softwarm);color:#8a4b00}.tag.gain{background:#e5f7ee;color:#137a44}.tag.up{background:#e5f0ff;color:#0a44c9}.tag.down{background:#fdece9;color:#b3391b}
  .pickbtns{display:flex;flex-direction:column;gap:8px;margin-top:10px}
  .pickbtns .btn{text-align:start;padding:11px 14px;font-size:14px;line-height:1.35}
  .pickbtns .oesub{display:block;font-weight:400;opacity:.85;font-size:12px;margin-top:2px}
  .banner{background:var(--soft);border:1px solid var(--line);border-inline-start:5px solid var(--orange);border-radius:12px;padding:11px 13px;font-size:13.5px;margin-top:10px}.banner b{color:var(--ink)}
  .result{border-radius:14px;padding:13px 15px;margin-top:10px;border:1px solid;animation:deal .5s ease both}
  .result.good{background:#e9f9f0;border-color:#8fddb4}.result.bad{background:#fdeee9;border-color:#f2b3a1}.result.neu{background:var(--soft);border-color:var(--line)}
  .result .rh{font-weight:800;font-size:14px;margin-bottom:4px}
  .result .delta{font-weight:900;font-size:14px;margin-top:5px}
  @media (prefers-color-scheme:dark){.result.good{background:#12301f;border-color:#1f5a3a}.result.bad{background:#331912;border-color:#5a2a1c}}
  .ctrls{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px;justify-content:center}
  .waitline{color:var(--muted);font-size:14px;text-align:center;padding:14px}
  .deckmini{width:64px;height:88px;border-radius:11px;background:radial-gradient(60px 60px at 30% 20%,rgba(255,144,0,.25),transparent 60%),linear-gradient(150deg,#1b3fb0,var(--blue) 40%,var(--navy));box-shadow:var(--shadow);border:2px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;color:var(--orange);font-size:34px;font-weight:900}
  select,input[type=text],input[type=number]{font-family:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
  label.fld{display:block;font-size:12.5px;color:var(--muted);font-weight:700;margin:0 0 4px}
  .setup-row{display:grid;grid-template-columns:1.4fr .6fr auto;gap:10px;align-items:end;margin-bottom:10px}
  .cover{aspect-ratio:2.4/1;width:100%;max-width:640px;margin:0 auto 14px;border-radius:16px;background:#fbfaf6 center/cover no-repeat;box-shadow:var(--shadow),0 0 0 1px rgba(255,255,255,.5) inset}
  .legend{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
  .legend .lg{display:flex;align-items:center;gap:6px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:6px 11px;font-size:12.5px;font-weight:700;white-space:nowrap}
  .steplist{list-style:none;margin:8px 0 2px;padding:0}
  .steplist li{font-size:13.5px;margin:6px 0;display:flex;gap:8px;align-items:flex-start}
  .tips{list-style:none;margin:0 0 18px;padding:0;text-align:start}
  .tips li{font-size:13px;color:var(--muted);margin:6px 0;display:flex;gap:7px;align-items:flex-start}
  .ringwrap{position:relative}
  .ringgrid{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);gap:5px;width:100%}
  .tile{position:relative;aspect-ratio:1/1;border-radius:9px;border:1px solid var(--line);background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.04)}
  .tile .ti{line-height:1}
  .tile .tt{font-size:8.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-top:2px}
  .tile.start{background:linear-gradient(135deg,var(--navy),#20374d);color:#fff;font-weight:900;border-color:var(--navy)}
  .tile.start .tt{color:#c6d1e6}
  .tile.shock{background:linear-gradient(160deg,#fde2dc,#fbcabd);border-color:#e79683}
  @media (prefers-color-scheme:dark){.tile.shock{background:linear-gradient(160deg,#3a1712,#2c1310);border-color:#5a2a1c}}
  .tile.chance{background:linear-gradient(160deg,#fff8ec,#fff1e0);border-color:#f2c98a}
  @media (prefers-color-scheme:dark){.tile.chance{background:linear-gradient(160deg,#3a2a12,#2c2010);border-color:#5a4420}}
  .tile.task{background:#EAF0FF;border-color:#c7d7fb}
  @media (prefers-color-scheme:dark){.tile.task{background:#16233D;border-color:#26324A}}
  .tile.here{outline:3px solid var(--orange);outline-offset:-2px}
  .ringcenter{position:absolute;left:12.5%;top:12.5%;width:75%;height:75%;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px;overflow:auto;z-index:2;display:flex;flex-direction:column;justify-content:center}
  .pawnlayer{position:absolute;inset:0;pointer-events:none;z-index:6;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);gap:5px}
  .pawncell{display:flex;align-items:center;justify-content:center;gap:3px;flex-wrap:wrap;padding:2px;overflow:visible}
  .pw2{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.4);color:#fff;font-weight:900;font-size:11px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .pw2.hop{animation:pawnhop .4s cubic-bezier(.34,1.4,.4,1)}
  @keyframes pawnhop{0%{transform:translate(var(--fx,0),var(--fy,0)) scale(.8);opacity:.55}55%{transform:translate(calc(var(--fx,0) * .12),calc(var(--fy,0) * .12 - 9px)) scale(1.2)}100%{transform:translate(0,0) scale(1);opacity:1}}
  .dice{width:88px;height:88px;border-radius:20px;background:var(--card);border:3px solid var(--line);box-shadow:0 10px 22px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;font-size:48px;margin:0 auto 8px}
  .dice.rolling{animation:diceroll .7s cubic-bezier(.34,1.4,.4,1)}
  @keyframes diceroll{0%{transform:rotate(0) scale(1)}12%{transform:rotate(-28deg) scale(1.18)}26%{transform:rotate(24deg) scale(1.24)}40%{transform:rotate(-20deg) scale(1.16)}55%{transform:rotate(14deg) scale(1.1)}70%{transform:rotate(-9deg) scale(1.05)}85%{transform:rotate(4deg) scale(1.02)}100%{transform:rotate(0) scale(1)}}
  @media (max-width:860px){.tile{font-size:11px}.tile .tt{display:none}.pw2{width:16px;height:16px;font-size:8px}.dice{width:62px;height:62px;font-size:32px}}
  .playgrid{display:grid;grid-template-columns:1fr minmax(230px,290px);gap:18px;align-items:start}
  @media (max-width:980px){.playgrid{grid-template-columns:1fr}}
  .stand2{display:flex;flex-direction:column;gap:7px;max-height:78vh;overflow:auto}
  .srow2{border:1px solid var(--line);border-radius:11px;padding:8px 10px;background:var(--card);box-shadow:var(--shadow-sm)}
  .srow2.up{outline:2px solid var(--orange);outline-offset:-1px}
  .srow2 .sr-top{display:flex;align-items:center;gap:7px}
  .srow2 .pos{font-weight:900;color:var(--muted);font-size:13px;width:16px;text-align:center;flex:0 0 auto}
  .srow2 .dot2{width:11px;height:11px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 1px 2px rgba(0,0,0,.25);flex:0 0 auto}
  .srow2 .nm{font-weight:800;font-size:12.5px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .srow2 .sc{font-weight:900;font-size:15px;flex:0 0 auto}
  .srow2 .sr-bot{display:flex;justify-content:space-between;align-items:center;margin-top:5px;font-size:10.5px;color:var(--muted);flex-wrap:wrap;gap:4px}
  .srow2 .mets{display:flex;gap:6px;flex-wrap:wrap}
  .srow2 .mets .low{color:var(--warn);font-weight:800}
  .srow2 .cn{font-weight:800;color:#7a4100;white-space:nowrap}
  .durrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
  @media (max-width:520px){.durrow{grid-template-columns:1fr}}
  .rank{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:13px;margin-bottom:10px;background:var(--card);box-shadow:var(--shadow-sm)}
  .rank .pos{font-size:22px;font-weight:900;color:var(--blue);width:34px;text-align:center}.rank.first{border-color:var(--orange);background:var(--softwarm)}
  .rank .rn{font-weight:800;font-size:16px}.rank .rs{margin-inline-start:auto;font-size:22px;font-weight:900}.rank .rd{font-size:12px;color:var(--muted)}
  .debrief{margin-top:28px;padding-top:18px;border-top:2px solid var(--line)}
  .dbteam{margin:12px 0;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:var(--card)}
  .dbh{font-weight:900;font-size:15px;padding:9px 12px;background:var(--softwarm)}
  .dbrow{padding:8px 12px;border-top:1px solid var(--line)}
  .dbttl{font-weight:700;font-size:13.5px}.dbttl .dbr{display:inline-block;font-size:11px;font-weight:800;color:#fff;background:var(--blue);border-radius:6px;padding:1px 6px;margin-inline-end:5px}
  .dbopt{font-size:13px;margin-top:2px}.dbeff{color:var(--muted);font-size:12px}
  .dbsp{font-size:12px;color:var(--muted);margin-top:3px;font-style:italic}
  .reflect ul{color:var(--ink)}.reflect h4{font-size:14px}
  footer{color:#93a3c0;font-size:12.5px;text-align:center;margin-top:34px;padding-top:16px;border-top:1px solid rgba(255,255,255,.14)}
  .hide{display:none!important}
  .player-shell{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:20px}
  .join-card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:30px;max-width:430px;width:100%;text-align:center;margin-top:5vh}
  .join-card.wide{max-width:1180px;text-align:start;margin-top:14px}
  .join-card.wide #pLogo,.join-card.wide .jc-cover{max-width:360px;margin-left:auto;margin-right:auto}
  .join-card .logo{height:34px;margin:0 auto 8px}.join-card .jc-cover{aspect-ratio:2.4/1;border-radius:14px;background:#fbfaf6 center/cover no-repeat;margin:6px 0 18px}
  .join-card h1{font-size:22px;margin:0 0 4px}.join-card p.s{color:var(--muted);font-size:14px;margin:0 0 18px}
  .join-card .fldwrap{text-align:start;margin-bottom:14px}.join-card input,.join-card select{width:100%}
  .pdash-head{text-align:center}
  .pdash-head h1{font-size:22px;margin:0 0 6px}
  .pdash-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:start;margin-top:14px}
  @media (max-width:760px){.pdash-grid{grid-template-columns:1fr}}
  .pdash-main{min-width:0}
  .pdash-side{background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:14px;max-height:70vh;overflow:auto}
  .pdash-side h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
  .playerOpt{width:100%;cursor:pointer}
  .playerOpt:disabled{opacity:.55;cursor:default}
  .pnet{font-size:13px;font-weight:700;border-radius:10px;padding:10px 12px;margin:0 0 16px;text-align:start;line-height:1.4}.pnet.live{background:#e5f7ee;color:#137a44}.pnet.off{background:#fff1e0;color:#b3391b}
  .yourturn{text-align:center;padding:16px;border-radius:16px;color:#fff;font-weight:900;font-size:22px;margin-bottom:14px;box-shadow:var(--shadow);animation:announce .7s cubic-bezier(.2,.9,.3,1.2) both}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--orange);margin:0 3px;animation:pulse 1.2s infinite}.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
  @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
  .cardface{border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:0 16px 34px rgba(0,0,0,.2);padding:16px 18px;animation:deal .6s cubic-bezier(.2,.9,.3,1.1) both;max-width:520px;margin:0 auto}

  .cardface h3{margin:0 0 8px;font-size:19px;letter-spacing:-.2px;text-align:center}
  .cardface p{font-size:14px;margin:0 0 8px}

  .opts{display:flex;flex-direction:column;gap:8px;margin-top:6px}
  .optbtn{text-align:start;padding:11px 14px;line-height:1.35;width:100%}
</style>
</head>
<body>

<div id="facilitator">
  <header class="top"><div class="top-in">
    <div class="brandline" id="brand"></div><div class="spacer"></div>
    <div class="join-chip"><span id="roomLbl">Kamer</span>&nbsp;<b id="roomCode">----</b></div>
    <span id="netStatus" class="netchip off"></span>
    <button class="btn ghost sm" id="sectorBtn">🌐 Sector</button>
    <button class="btn ghost sm" id="helpToggle">❔ Uitleg</button>
    <button class="btn ghost sm" id="soundToggle" title="Geluid">🔊</button>
    <button class="btn ghost sm" id="fxToggle" title="Effecten">👁</button>
    <button class="btn ghost sm" id="langToggle">EN</button>

/* ============ helpers ============ */
const $=id=>document.getElementById(id);
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function rnd(n){return Math.floor(Math.random()*n);}
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}
function uid(){return Math.random().toString(36).slice(2,9);}
function roomCode(){let s="";const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";for(let i=0;i<4;i++)s+=A[rnd(A.length)];return s;}
function pick(arr){return arr[rnd(arr.length)];}
function taskIds(){return state.lang==="nl"?TASK_IDS_NL.slice():TASK_IDS_EN.slice();}
function chanceIds(){return state.lang==="nl"?CHANCE_IDS_NL.slice():CHANCE_IDS_EN.slice();}
function contentFor(){return CONTENT[state.lang];}

function computeTurnsPerTeam(){
  const numTeams=Math.max(1,state.teams.length);
  if(state.durationMode==="custom") return clamp(state.customTurns||8,TURNS_MIN,TURNS_MAX);
  const targetMin=DURATION_PRESETS[state.durationMode]||DURATION_PRESETS.medium;
  return clamp(Math.round(targetMin/AVG_MIN_PER_TURN/numTeams),TURNS_MIN,TURNS_MAX);
}
function estimatedMinutes(turnsPerTeam){return Math.round(turnsPerTeam*Math.max(1,state.teams.length)*AVG_MIN_PER_TURN);}

/* ============ state ============ */
let state=null;
function freshTeam(i){
  return {id:i+1,name:(state&&state.lang==="en"?"Team ":"Team ")+(i+1),color:TEAM_COLORS[i%TEAM_COLORS.length],
    coins:10,met:{sat:0,fin:0,comp:0,dur:0},boardPos:0,turnsTaken:0,history:[],
    seenTask:[],seenChance:[],seenShock:false,laps:0};
}
function freshState(){
  const s={
    lang:"nl",room:roomCode(),appStage:"setup",
    teams:[0,1].map(i=>freshTeam(i)),
    durationMode:"medium",customTurns:8,turnsPerTeam:8,
    activeTeamIdx:0,
    turn:{phase:"idle",dice:null,walkTo:null,cardType:null,card:null,pendingCard:null,chosenIdx:null,lapGain:0,token:null},
    usedSectorIds:[],lastSectorBanner:null,
    soundOn:true,fxOn:true,
    players:{},
    createdAt:Date.now()
  };
  return s;
}
function saveLocal(){try{localStorage.setItem("btfd_v2_state",JSON.stringify(state));}catch(e){}}
function loadLocal(){try{const r=localStorage.getItem("btfd_v2_state");if(r)return JSON.parse(r);}catch(e){}return null;}

function activeTeam(){return state.teams[state.activeTeamIdx];}
function tileTypeAt(pos){return TILE_TYPES[pos%RING_LEN];}

/* ============ turn engine ============
   Each turn keeps ONE token (state.turn.token), set once at the start of the
   turn (nextTurn/startGame) and unchanged through idle->rolling->walking->
   landed->card->resolved. Player-submitted actions (roll/drawCard/choice/
   ackChance/nextTurn) must match this token AND the active team AND the
   expected phase before being applied - this keeps a stale/late action from
   a previous turn from ever firing, while letting either the active team's
   own device OR the facilitator's screen (fallback) drive every step. */
function startGame(){
  state.turnsPerTeam=computeTurnsPerTeam();
  state.teams.forEach(tm=>{tm.coins=10;tm.met={sat:0,fin:0,comp:0,dur:0};tm.boardPos=0;tm.turnsTaken=0;tm.history=[];tm.seenTask=[];tm.seenChance=[];tm.seenShock=false;tm.laps=0;});
  state.activeTeamIdx=0;
  _lastPawnPos={};
  state.turn={phase:"idle",dice:null,walkTo:null,cardType:null,card:null,pendingCard:null,chosenIdx:null,lapGain:0,token:uid()};
  state.appStage="play";
  NET.clearAction();
  render();saveLocal();NET.publish();
}

function rollDice(){
  if(state.turn.phase!=="idle")return;
  const team=activeTeam();
  const dice=1+rnd(6);
  const from=team.boardPos;
  const to=from+dice;
  state.turn.phase="rolling";
  state.turn.dice=dice;
  state.turn.walkTo=to;
  NET.clearAction();
  render();saveLocal();NET.publish();
  setTimeout(()=>{state.turn.phase="walking";stepWalk(from,to);},650);
}

function stepWalk(from,to){
  const team=activeTeam();
  if(team.boardPos>=to){
    landingAction();
    return;
  }
  const before=team.boardPos;
  team.boardPos++;
  if(Math.floor(team.boardPos/RING_LEN)>Math.floor(before/RING_LEN)){
    team.coins+=5;team.laps++;state.turn.lapGain=(state.turn.lapGain||0)+5;
  }
  render();saveLocal();NET.publish();
  setTimeout(()=>stepWalk(from,to),380);
}

/* Landing determines (and pre-selects) the card, but does NOT reveal it yet -
   the active team draws it themselves via drawCard() for the reveal moment. */
function landingAction(){
  const team=activeTeam();
  const pos=team.boardPos%RING_LEN;
  let type=tileTypeAt(pos);
  if(type==="shock"&&team.seenShock)type="task";
  state.turn.cardType=type;
  state.turn.card=null;
  state.turn.pendingCard=null;
  if(type==="start"){
    state.turn.phase="resolved";
    render();saveLocal();NET.publish();
    return;
  }
  if(type==="chance")state.turn.pendingCard=drawChanceFor(team);
  else if(type==="shock")state.turn.pendingCard=contentFor().shock.S;
  else state.turn.pendingCard=drawTaskFor(team);
  state.turn.phase="landed";
  render();saveLocal();NET.publish();
}

function drawCard(){
  if(state.turn.phase!=="landed")return;
  const team=activeTeam();
  const type=state.turn.cardType;
  const card=state.turn.pendingCard;
  if(!card)return;
  state.turn.card=card;
  state.turn.pendingCard=null;
  if(type==="shock")team.seenShock=true;
  if(type==="chance"){
    applyCardEffect(team,card.fx,card.coins);
    team.history.push({turn:team.turnsTaken+1,type:"chance",id:card.id,title:card.t,coins:card.coins});
  }
  state.turn.phase="card";
  NET.clearAction();
  render();saveLocal();NET.publish();
}

function drawTaskFor(team){
  const all=taskIds();
  let avail=all.filter(id=>!team.seenTask.includes(id));
  if(avail.length===0){team.seenTask=[];avail=all.slice();}
  const id=pick(avail);
  team.seenTask.push(id);
  return contentFor().task[id];
}
function drawChanceFor(team){
  const all=chanceIds();
  let avail=all.filter(id=>!team.seenChance.includes(id));
  if(avail.length===0){team.seenChance=[];avail=all.slice();}
  const id=pick(avail);
  team.seenChance.push(id);
  return contentFor().chance[id];
}
function applyCardEffect(team,fx,coins){
  team.coins=Math.max(0,team.coins+(coins||0));
  if(fx)Object.keys(fx).forEach(k=>{team.met[k]=(team.met[k]||0)+fx[k];});
}

function resolveChoice(optIdx){
  if(state.turn.phase!=="card")return;
  const team=activeTeam();
  const card=state.turn.card;
  if(!card||!card.o)return;
  const opt=card.o[optIdx];
  if(!opt)return;
  applyCardEffect(team,opt.fx,opt.coins);
  state.turn.chosenIdx=optIdx;
  team.history.push({turn:team.turnsTaken+1,type:state.turn.cardType,id:card.id,title:card.t,option:opt.l,coins:opt.coins});
  state.turn.phase="resolved";
  NET.clearAction();
  render();saveLocal();NET.publish();
}

function ackAutoCard(){
  if(state.turn.phase!=="card")return;
  state.turn.phase="resolved";
  NET.clearAction();
  render();saveLocal();NET.publish();
}

function nextTurn(){
  if(state.turn.phase!=="resolved")return;
  const team=activeTeam();
  team.turnsTaken++;
  NET.clearAction();
  state.turn={phase:"idle",dice:null,walkTo:null,cardType:null,card:null,pendingCard:null,chosenIdx:null,lapGain:0,token:uid()};
  const allDone=state.teams.every(t=>t.turnsTaken>=state.turnsPerTeam);
  if(allDone){
    state.appStage="scores";
    render();saveLocal();NET.publish();
    return;
  }
  let next=(state.activeTeamIdx+1)%state.teams.length;
  let guard=0;
  while(state.teams[next].turnsTaken>=state.turnsPerTeam&&guard<state.teams.length){next=(next+1)%state.teams.length;guard++;}
  state.activeTeamIdx=next;
  render();saveLocal();NET.publish();
}

function triggerSectorEvent(){
  const avail=SECTOR_IDS.filter(id=>!state.usedSectorIds.includes(id));
  const pool=avail.length?avail:SECTOR_IDS.slice();
  if(!avail.length)state.usedSectorIds=[];
  const id=pick(pool);
  state.usedSectorIds.push(id);
  const ev=contentFor().sector[id];
  state.teams.forEach(t=>applyCardEffect(t,ev.fx,ev.coins));
  state.lastSectorBanner={t:ev.t,x:ev.x,at:Date.now()};
  render();saveLocal();NET.publish();
  setTimeout(()=>{if(state.lastSectorBanner&&state.lastSectorBanner.at===state.lastSectorBanner.at){/*keep until dismissed*/}},1);
}
/* ============ board layout ============ */
function ringLayout(){
  const out=[];
  for(let c=1;c<=8;c++) out.push({row:1,col:c});
  for(let r=2;r<=8;r++) out.push({row:r,col:8});
  for(let c=7;c>=1;c--) out.push({row:8,col:c});
  for(let r=7;r>=2;r--) out.push({row:r,col:1});
  return out;
}
const RING_LAYOUT=ringLayout();

/* ============ render ============ */
function render(){
  if(!state)return;
  document.documentElement.lang=state.lang;
  $("brand").textContent=T[state.lang].brand;
  $("roomLbl").textContent=T[state.lang].room;
  $("roomCode").textContent=state.room;
  $("copyJoin").textContent=T[state.lang].joinLink;
  $("resetGame").textContent=T[state.lang].newGame;
  $("helpToggle").textContent=T[state.lang].help;
  $("sectorBtn").textContent=T[state.lang].sector;
  $("sectorBtn").title=T[state.lang].sectorBtnTip;
  $("footNL").textContent=T[state.lang].footNL;
  $("langToggle").textContent=state.lang==="nl"?"EN":"NL";
  $("netStatus").className="netchip "+(NET.connected?"live":"off");
  $("netStatus").textContent=NET.connected?T[state.lang].netLive:T[state.lang].netOff;

  ["view-setup","view-play","view-scores"].forEach(v=>$(v.replace("view-","")===v?v:v));
  $("view-setup").classList.toggle("hide",state.appStage!=="setup");
  $("view-play").classList.toggle("hide",state.appStage!=="play");
  $("view-scores").classList.toggle("hide",state.appStage!=="scores");

  if(state.appStage==="setup")renderSetup();
  if(state.appStage==="play"){renderBoardPath();renderPawns();renderStage();renderCompactStand();renderRoundBar();}
  if(state.appStage==="scores")renderScores();

  if(state.lastSectorBanner){
    $("sectorBanner").classList.remove("hide");
    $("sectorBanner").innerHTML=T[state.lang].sectorBanner(esc(state.lastSectorBanner.t),esc(state.lastSectorBanner.x))+
      '<div style="margin-top:8px"><button class="btn ghost sm" id="dismissSector">OK</button></div>';
    const db=$("dismissSector");if(db)db.onclick=()=>{state.lastSectorBanner=null;render();saveLocal();NET.publish();};
  }else{
    $("sectorBanner").classList.add("hide");
  }
}

function renderRoundBar(){
  const total=state.teams.length*state.turnsPerTeam;
  const done=state.teams.reduce((a,t)=>a+t.turnsTaken,0);
  $("roundHint").textContent=T[state.lang].roundHint(done,total);
  const pct=total?Math.round(100*done/total):0;
  $("roundBar").innerHTML=`<div style="height:8px;background:var(--soft);border-radius:6px;overflow:hidden"><div style="height:100%;width:${pct}%;background:var(--blue);transition:width .4s"></div></div>`;
}

function renderBoardPath(){
  const wrap=$("boardPath");
  let html="";
  for(let i=0;i<RING_LEN;i++){
    const pos=RING_LAYOUT[i];
    const type=TILE_TYPES[i];
    const here=state.teams.some(t=>t.boardPos%RING_LEN===i);
    html+=`<div class="tile ${type}${here?" here":""}" style="grid-row:${pos.row};grid-column:${pos.col}" data-idx="${i}">
      <div class="ti">${SP_ICON[type]}</div><div class="tt">${i===0?"START":type.toUpperCase()}</div>
    </div>`;
  }
  wrap.innerHTML=html;
}

let _lastPawnPos={};
function renderPawns(){
  const layer=$("pawnLayer");
  const grouped={};
  state.teams.forEach(team=>{
    const i=team.boardPos%RING_LEN;
    (grouped[i]=grouped[i]||[]).push(team);
  });
  let html="";
  Object.keys(grouped).forEach(idxStr=>{
    const idx=parseInt(idxStr,10);
    const pos=RING_LAYOUT[idx];
    const teamsHere=grouped[idx];
    const pawnsHtml=teamsHere.map(team=>{
      const prevRaw=_lastPawnPos[team.id];
      const moved=prevRaw!==undefined&&prevRaw!==team.boardPos;
      let styleVars="";
      if(moved){
        const prevIdx=((prevRaw%RING_LEN)+RING_LEN)%RING_LEN;
        const prevPos=RING_LAYOUT[prevIdx];
        const dx=(prevPos.col-pos.col)*26,dy=(prevPos.row-pos.row)*26;
        styleVars=`--fx:${dx}px;--fy:${dy}px;`;
      }
      return `<div class="pw2${moved?" hop":""}" style="background:${team.color};${styleVars}" title="${esc(team.name)}">${team.id}</div>`;
    }).join("");
    html+=`<div class="pawncell" style="grid-row:${pos.row};grid-column:${pos.col}">${pawnsHtml}</div>`;
  });
  layer.innerHTML=html;
  state.teams.forEach(team=>{_lastPawnPos[team.id]=team.boardPos;});
}

function renderStage(){
  const el=$("stage");
  const L=T[state.lang];
  const team=activeTeam();
  const ph=state.turn.phase;
  if(state.appStage!=="play"){el.innerHTML="";return;}
  let html="";
  if(ph==="idle"){
    html=`<div class="yourturn" style="background:${team.color}">${esc(L.yourTurnBanner(team.name))}</div>
      <div style="text-align:center"><p class="hint">${esc(L.waitRoll(team.name))}</p>
      <p class="hint" style="margin-bottom:4px">${L.rollFallback}</p>
      <button class="btn soft" id="rollBtn">${L.rollBtn}</button></div>`;
  }else if(ph==="rolling"){
    html=`<div style="text-align:center"><div class="dice rolling">🎲</div><div class="hint">${esc(team.name)}…</div></div>`;
  }else if(ph==="walking"){
    html=`<div style="text-align:center"><div class="dice">${state.turn.dice}</div><div class="hint">${L.walking}</div></div>`;
  }else if(ph==="landed"){
    html=`<div style="text-align:center"><div class="ti" style="font-size:40px">${SP_ICON[state.turn.cardType]||""}</div>
      <p class="hint">${esc(L.waitDrawCard(team.name))}</p>
      <p class="hint" style="margin-bottom:4px">${L.drawCardFallback}</p>
      <button class="btn soft" id="drawCardBtn">${L.drawCardBtn}</button></div>`;
  }else if(ph==="card"){
    const type=state.turn.cardType,card=state.turn.card;
    if(type==="chance"){
      const bad=card.good===false;
      html=`<div class="cardface"><div class="badge" style="background:${bad?'#fde2dc':'#e5f7ee'};color:${bad?'#a4321f':'#137a44'}">${bad?L.chanceAutoBad:L.chanceAutoGood}</div>
        <h3>${esc(card.t)}</h3><p>${esc(card.x)}</p>
        <p class="hint">${card.coins>0?"+":""}${card.coins} ${L.coinsLbl.toLowerCase()}</p>
        <p class="hint" style="margin-bottom:4px">${L.ackChanceFallback}</p>
        <button class="btn soft" id="ackCardBtn">${L.confirmChoice}</button></div>`;
    }else{
      const cat=CAT[card.id];
      html=`<div class="cardface">${cat?`<div class="illo" style="background-image:url('assets/${cat}.jpg')"></div>`:""}<div class="badge">${type==="shock"?L.drawShock:L.drawTask}</div>
        <h3>${esc(card.t)}</h3><p>${esc(card.x)}</p>
        <p class="hint" style="margin-bottom:6px">${L.chooseOpt}</p>
        <div class="opts">`+
        card.o.map((o,idx)=>`<button class="btn soft optbtn" data-idx="${idx}"><b>${esc(o.l)}</b><br><span class="hint">${esc(o.e)}</span></button>`).join("")+
        `</div></div>`;
    }
  }else if(ph==="resolved"){
    const type=state.turn.cardType;
    let msg="";
    if(type==="start"){msg=team.turnsTaken===0&&team.boardPos===0?L.collectedStart:L.passedStart;}
    else if(state.turn.lapGain){msg=L.passedStart;}
    const card=state.turn.card;
    let detail="";
    if(card&&state.turn.chosenIdx!=null){const o=card.o[state.turn.chosenIdx];detail=`<p class="hint"><b>${esc(o.l)}</b> — ${o.coins>0?"+":""}${o.coins} ${L.coinsLbl.toLowerCase()}</p>`;}
    html=`<div style="text-align:center">${msg?`<p class="hint">${msg}</p>`:""}${detail}
      <p class="hint" style="margin-bottom:4px">${L.nextTurnFallback}</p>
      <button class="btn soft" id="nextTurnBtn">${L.continueBtn}</button></div>`;
  }
  el.innerHTML=html;
  const rb=$("rollBtn");if(rb)rb.onclick=()=>rollDice();
  const dcb=$("drawCardBtn");if(dcb)dcb.onclick=()=>drawCard();
  const ack=$("ackCardBtn");if(ack)ack.onclick=()=>ackAutoCard();
  const nb=$("nextTurnBtn");if(nb)nb.onclick=()=>nextTurn();
  el.querySelectorAll(".optbtn").forEach(b=>b.onclick=()=>resolveChoice(parseInt(b.dataset.idx,10)));
}

function renderCompactStand(){
  const L=T[state.lang];
  const wrap=$("standCompact");
  const sorted=state.teams.slice().sort((a,b)=>b.coins-a.coins);
  wrap.innerHTML=sorted.map(t=>{
    const metsHtml=Object.keys(MET[state.lang]).map(k=>`<span${t.met[k]<0?' class="low"':''}>${MET[state.lang][k].split(" ")[0]}${t.met[k]>0?"+":""}${t.met[k]}</span>`).join(" ");
    return `<div class="srow2${t.id===activeTeam().id&&state.appStage==="play"?" up":""}">
      <div class="sr-top"><span class="pos">${sorted.indexOf(t)+1}</span><span class="dot2" style="background:${t.color}"></span><span class="nm">${esc(t.name)}</span><span class="sc">${t.coins}</span></div>
      <div class="sr-bot"><span class="mets">${metsHtml}</span><span class="cn">${t.turnsTaken}/${state.turnsPerTeam}</span></div>
    </div>`;
  }).join("");
}

function renderSetup(){
  const L=T[state.lang];
  $("setupH").textContent=L.setupH;$("setupP").textContent=L.setupP;$("addTeam").textContent=L.addTeam;
  $("durLbl").textContent=L.durLbl;$("custLbl").textContent=L.custLbl;$("startGame").textContent=L.startGame;
  const opts=$("durationSelect").options;
  opts[0].textContent=L.durShort;opts[1].textContent=L.durMedium;opts[2].textContent=L.durLong;opts[3].textContent=L.durCustom;
  $("durationSelect").value=state.durationMode;
  $("customTurnsWrap").classList.toggle("hide",state.durationMode!=="custom");
  $("customTurns").value=state.customTurns;
  $("setupRows").innerHTML=state.teams.map((t,i)=>`
    <div class="teamrow" style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
      <span class="dot2" style="width:14px;height:14px;border-radius:50%;background:${t.color};flex:0 0 auto"></span>
      <input type="text" value="${esc(t.name)}" data-i="${i}" class="teamNameInput" style="flex:1">
      ${state.teams.length>2?`<button class="btn ghost sm removeTeamBtn" data-i="${i}">✕</button>`:""}
    </div>`).join("");
  document.querySelectorAll(".teamNameInput").forEach(inp=>inp.oninput=()=>{state.teams[parseInt(inp.dataset.i,10)].name=inp.value;saveLocal();});
  document.querySelectorAll(".removeTeamBtn").forEach(b=>b.onclick=()=>{state.teams.splice(parseInt(b.dataset.i,10),1);renderSetup();updateEstimate();});
  updateEstimate();
}
function updateEstimate(){
  const turns=computeTurnsPerTeam();
  const mins=estimatedMinutes(turns);
  $("durationEstimate").innerHTML=T[state.lang].estimate(turns,mins,state.teams.length);
}

function renderScores(){
  const L=T[state.lang];
  $("scoresH").textContent=L.scoresH;$("scoresP").textContent=L.scoresP;$("againBtn").textContent=L.againBtn;
  const sorted=state.teams.slice().sort((a,b)=>b.coins-a.coins);
  let html=sorted.map((t,i)=>`<div class="rank${i===0?" first":""}"><span class="pos">${i+1}</span>
    <div><div class="rn">${esc(t.name)}</div><div class="rd">${Object.keys(MET[state.lang]).map(k=>`${MET[state.lang][k].split(" ")[0]} ${t.met[k]>0?"+":""}${t.met[k]}`).join(" · ")}</div></div>
    <span class="rs">${t.coins}</span></div>`).join("");
  html+=`<div class="debrief">`+state.teams.map(t=>`
    <div class="dbteam"><div class="dbh">${esc(t.name)}</div>`+
    t.history.map(h=>`<div class="dbrow"><div class="dbttl"><span class="dbr">${h.turn}</span>${esc(h.title)}</div>${h.option?`<div class="dbopt">${esc(h.option)}</div>`:""}<div class="dbeff">${h.coins>0?"+":""}${h.coins} ${L.coinsLbl.toLowerCase()}</div></div>`).join("")
    +`</div>`).join("")+`</div>`;
  $("scoreWrap").innerHTML=html;
}

/* ============ NET (Firebase sync) ============ */
const NET={
  connected:false,db:null,ref:null,actionRef:null,_actionCb:null,_pubTimer:null,
  init(){
    try{
      if(!window.firebase||!window.FIREBASE_CONFIG){this.connected=false;return;}
      if(!firebase.apps||!firebase.apps.length)firebase.initializeApp(window.FIREBASE_CONFIG);
      this.db=firebase.database();
      this.connected=true;
      this.bindRoom();
    }catch(e){this.connected=false;}
  },
  bindRoom(){
    if(!this.db||!state)return;
    this.ref=this.db.ref("rooms/"+state.room+"/state");
  },
  bindActions(){
    if(!this.db||!state)return;
    if(this.actionRef)this.actionRef.off();
    this.actionRef=this.db.ref("rooms/"+state.room+"/action");
    if(this._actionCb)this.actionRef.on("value",this._actionCb);
  },
  onAction(cb){
    this._actionCb=snap=>{const v=snap.val();if(v)cb(v);};
    this.bindActions();
  },
  clearAction(){
    if(this.actionRef)this.actionRef.remove().catch(()=>{});
  },
  publish(){
    if(!this.db)return;
    clearTimeout(this._pubTimer);
    this._pubTimer=setTimeout(()=>{
      if(!this.ref)this.bindRoom();
      if(this.ref)this.ref.set(state).catch(()=>{});
    },120);
  },
  listenState(room,cb){
    if(!this.db||!room)return;
    const r=this.db.ref("rooms/"+room+"/state");
    r.on("value",snap=>{const v=snap.val();if(v)cb(v);});
  },
  fetchTeamsOnce(room){
    if(!this.db||!room)return Promise.resolve(null);
    return this.db.ref("rooms/"+room+"/state").once("value").then(snap=>snap.val()).catch(()=>null);
  },
  joinAsPlayer(room,name,team){
    if(!this.db)return Promise.resolve();
    const id=uid();
    return this.db.ref("rooms/"+room+"/joins/"+id).set({name,team,at:Date.now()}).then(()=>id).catch(()=>id);
  },
  submitAction(room,payload){
    if(!this.db||!room)return Promise.resolve();
    return this.db.ref("rooms/"+room+"/action").set(Object.assign({at:Date.now()},payload)).catch(()=>{});
  }
};

/* ============ event wiring (facilitator) ============ */
function wireFacilitator(){
  $("addTeam").onclick=()=>{if(state.teams.length>=6)return;state.teams.push(freshTeam(state.teams.length));renderSetup();saveLocal();};
  $("durationSelect").onchange=e=>{state.durationMode=e.target.value;renderSetup();saveLocal();};
  $("customTurns").oninput=e=>{state.customTurns=clamp(parseInt(e.target.value,10)||8,TURNS_MIN,TURNS_MAX);updateEstimate();saveLocal();};
  $("startGame").onclick=()=>startGame();
  $("langToggle").onclick=()=>{state.lang=state.lang==="nl"?"en":"nl";renderLegendAndHelp();render();saveLocal();NET.publish();};
  $("soundToggle").onclick=()=>{state.soundOn=!state.soundOn;$("soundToggle").textContent=state.soundOn?"🔊":"🔇";saveLocal();};
  $("fxToggle").onclick=()=>{state.fxOn=!state.fxOn;$("fxToggle").textContent=state.fxOn?"👁":"🚫";saveLocal();};
  $("helpToggle").onclick=()=>{$("helpPanel").classList.toggle("hide");};
  $("sectorBtn").onclick=()=>triggerSectorEvent();
  $("copyJoin").onclick=()=>{
    const url=location.origin+location.pathname+"?room="+state.room+"&player=1";
    if(navigator.clipboard)navigator.clipboard.writeText(url).catch(()=>{});
    $("copyJoin").textContent="✓ "+T[state.lang].joinLink;
    setTimeout(()=>{$("copyJoin").textContent=T[state.lang].joinLink;},1400);
  };
  $("resetGame").onclick=()=>{
    if(!confirm(state.lang==="nl"?"Nieuw spel starten? Voortgang gaat verloren.":"Start a new game? Progress will be lost."))return;
    state=freshState();NET.bindRoom();NET.bindActions();renderLegendAndHelp();render();saveLocal();NET.publish();
  };
  $("againBtn").onclick=()=>$("resetGame").onclick();
}

/* Applies a player-submitted turn action (roll / drawCard / choice / ackChance /
   nextTurn) received via Firebase to the live game. Every action must match the
   CURRENT turn's token and the active team, and land in the exact phase it
   belongs to - this lets the active team's own device drive the turn (rolling,
   drawing, choosing, advancing) while the facilitator's screen still works as
   a fallback for any of these steps. Anything that doesn't match is discarded. */
function handleIncomingAction(action){
  if(!state||!action||state.appStage!=="play")return;
  const team=activeTeam();
  const sameTeam=String(team.id)===String(action.team);
  const sameToken=state.turn.token&&state.turn.token===action.token;
  if(!sameTeam||!sameToken){NET.clearAction();return;}
  if(action.type==="roll"&&state.turn.phase==="idle"){
    rollDice();
  }else if(action.type==="drawCard"&&state.turn.phase==="landed"){
    drawCard();
  }else if(action.type==="choice"&&state.turn.phase==="card"&&state.turn.cardType!=="chance"&&
      state.turn.card&&state.turn.card.o&&action.optIdx!=null&&state.turn.card.o[action.optIdx]){
    resolveChoice(action.optIdx);
  }else if(action.type==="ackChance"&&state.turn.phase==="card"&&state.turn.cardType==="chance"){
    ackAutoCard();
  }else if(action.type==="nextTurn"&&state.turn.phase==="resolved"){
    nextTurn();
  }else{
    NET.clearAction();
  }
}

/* ============ player view ============ */
function initPlayerView(){
  const params=new URLSearchParams(location.search);
  const roomFromUrl=params.get("room");
  if(roomFromUrl)$("pRoom").value=roomFromUrl;
  const logoTpl=$("logoTpl");
  $("pLogo").appendChild(logoTpl.content.cloneNode(true));
  $("jfH").textContent=T.nl.jfH;$("jfSub").textContent=T.nl.jfSub;$("jfRoomL").textContent=T.nl.jfRoomL;
  $("jfNameL").textContent=T.nl.jfNameL;$("jfTeamL").textContent=T.nl.jfTeamL;$("joinBtn").textContent=T.nl.joinBtn;
  $("joinTips").innerHTML=`<li>${T.nl.jfSub}</li>`;
  let joinedRoom=null,playerLang="nl",knownTeams=null,lastSubmittedKey=null;
  function markSent(turn,actionType){lastSubmittedKey=turn.token+":"+actionType;}
  function wasSent(turn,actionType){return lastSubmittedKey===turn.token+":"+actionType;}
  NET.init();

  function populateTeamOptions(teams){
    const sel=$("pTeam");
    const prevVal=sel.value;
    const list=(teams&&teams.length)?teams:[{id:1,name:"Team 1"},{id:2,name:"Team 2"}];
    sel.innerHTML=list.map(t=>`<option value="${esc(t.id)}">${esc(t.name)}</option>`).join("");
    if(prevVal&&list.some(t=>String(t.id)===String(prevVal)))sel.value=prevVal;
  }
  function refreshTeamsForRoom(){
    const room=($("pRoom").value||"").trim().toUpperCase();
    if(!room||!NET.db)return;
    NET.fetchTeamsOnce(room).then(snap=>{
      if(snap&&snap.teams&&snap.teams.length){knownTeams=snap.teams;populateTeamOptions(snap.teams);}
    });
  }
  $("pRoom").addEventListener("blur",refreshTeamsForRoom);
  $("pRoom").addEventListener("change",refreshTeamsForRoom);
  if(roomFromUrl){
    // give the Firebase SDK a moment to finish initializing before the first lookup
    setTimeout(refreshTeamsForRoom,300);
  }

  $("joinBtn").onclick=()=>{
    const room=($("pRoom").value||"").trim().toUpperCase();
    const name=($("pName").value||"").trim();
    const team=$("pTeam").value;
    if(!room||!name)return;
    joinedRoom=room;
    NET.joinAsPlayer(room,name,team);
    $("joinForm").style.display="none";
    $("joinWaiting").style.display="block";
    $("joinCard").classList.add("wide");
    const teamName=(knownTeams&&knownTeams.find(t=>String(t.id)===String(team))||{}).name||("Team "+team);
    $("joinWho").textContent=name+" · "+teamName;
    $("joinRoomEcho").textContent=room;
    $("jwH").textContent=T.nl.jwH;$("jwWait").textContent=T.nl.jwWait;$("jwRoomL").textContent=T.nl.jwRoomL;
    subscribeAsPlayer(room,team);
  };
  function subscribeAsPlayer(room,team){
    if(!NET.db){$("jwBanner").textContent=T.nl.netOff;$("jwBanner").classList.remove("hide");return;}
    $("pNet").textContent=T.nl.netLive;$("pNet").className="pnet live";
    NET.listenState(room,snap=>{
      playerLang=snap.lang||"nl";
      renderPlayerDashboard(snap,team);
    });
  }
  function renderPlayerDashboard(snap,team){
    const L=T[playerLang]||T.nl;
    const me=snap.teams.find(t=>String(t.id)===String(team));
    const active=snap.teams[snap.activeTeamIdx];
    const mine=active&&String(active.id)===String(team);
    const turn=snap.turn||{phase:"idle"};
    let head=`<h1 style="font-size:20px">${esc(L.brand)}</h1>`;
    if(me)head+=`<p class="s">${esc(me.name)} · ${me.coins} ${L.coinsLbl.toLowerCase()} · ${me.turnsTaken}/${snap.turnsPerTeam}</p>`;
    if(snap.appStage==="setup"){
      head+=`<p class="s">${esc(L.jwWait)}</p>`;
    }

    let main="";
    if(snap.appStage==="play"&&active){
      main+=`<div class="yourturn" style="background:${active.color};font-size:16px">${mine?"🎯 ":""}${esc(L.yourTurnBanner(active.name))}</div>`;
      if(turn.phase==="idle"){
        if(mine){
          const sent=wasSent(turn,"roll");
          main+=`<div style="text-align:center"><button class="btn warn big" id="playerRollBtn" ${sent?"disabled":""}>${sent?L.choiceSent:L.rollBtn}</button></div>`;
        }
      }else if(turn.phase==="rolling"){
        main+=`<div style="text-align:center"><div class="dice rolling">🎲</div></div>`;
      }else if(turn.phase==="walking"){
        main+=`<div style="text-align:center"><div class="dice">${turn.dice||"🎲"}</div><p class="hint">${L.walking}</p></div>`;
      }else if(turn.phase==="landed"){
        if(mine){
          const sent=wasSent(turn,"drawCard");
          main+=`<div style="text-align:center"><div class="ti" style="font-size:40px">${SP_ICON[turn.cardType]||""}</div><button class="btn warn big" id="playerDrawBtn" ${sent?"disabled":""}>${sent?L.choiceSent:L.drawCardBtn}</button></div>`;
        }else{
          main+=`<div style="text-align:center"><div class="ti" style="font-size:40px">${SP_ICON[turn.cardType]||""}</div><p class="hint">${L.waitForYourTeam}</p></div>`;
        }
      }else if(turn.phase==="card"&&turn.card){
        const cat=CAT[turn.card.id];
        main+=`<div class="cardface" style="margin-top:10px">${cat?`<div class="illo" style="background-image:url('assets/${cat}.jpg')"></div>`:""}<div class="badge">${turn.cardType==="shock"?L.drawShock:(turn.cardType==="chance"?L.drawChance:L.drawTask)}</div><h3>${esc(turn.card.t)}</h3><p>${esc(turn.card.x)}</p>`;
        if(turn.cardType==="chance"){
          main+=`<p class="hint">${turn.card.coins>0?"+":""}${turn.card.coins} ${L.coinsLbl.toLowerCase()}</p>`;
          if(mine){
            const sent=wasSent(turn,"ackChance");
            main+=`<button class="btn warn" id="playerAckBtn" ${sent?"disabled":""}>${sent?L.choiceSent:L.confirmChoice}</button>`;
          }
        }else if(turn.card.o){
          if(mine){
            const sent=wasSent(turn,"choice");
            main+=`<p class="hint" style="margin-bottom:6px">${sent?L.choiceSent:L.chooseOpt}</p><div class="opts">`+
              turn.card.o.map((o,idx)=>`<button class="btn soft optbtn playerOpt" data-idx="${idx}"${sent?" disabled":""}>${esc(o.l)}<br><span class="hint">${esc(o.e)}</span></button>`).join("")+
              `</div>`;
          }else{
            main+=`<p class="hint" style="margin-bottom:6px">${L.waitForYourTeam}</p><div class="opts">`+turn.card.o.map(o=>`<div class="btn soft optbtn" style="opacity:.7">${esc(o.l)}<br><span class="hint">${esc(o.e)}</span></div>`).join("")+`</div>`;
          }
        }
        main+=`</div>`;
      }else if(turn.phase==="resolved"){
        let detail="";
        if(turn.card&&turn.card.o&&turn.chosenIdx!=null){
          const o=turn.card.o[turn.chosenIdx];
          detail=`<div class="cardface" style="margin-top:10px"><p class="hint"><b>${esc(o.l)}</b> — ${o.coins>0?"+":""}${o.coins} ${L.coinsLbl.toLowerCase()}</p></div>`;
        }else if(turn.cardType==="start"||turn.lapGain){
          detail=`<p class="hint" style="text-align:center;margin-top:10px">${L.passedStart}</p>`;
        }
        main+=detail;
        if(mine){
          const sent=wasSent(turn,"nextTurn");
          main+=`<div style="text-align:center;margin-top:8px"><button class="btn soft" id="playerNextBtn" ${sent?"disabled":""}>${sent?L.choiceSent:L.continueBtn}</button></div>`;
        }
      }
    }
    if(snap.appStage==="scores"){
      const sorted=snap.teams.slice().sort((a,b)=>b.coins-a.coins);
      main+="<div>"+sorted.map((t,i)=>`<div class="rank${i===0?" first":""}"><span class="pos">${i+1}</span><div class="rn" style="flex:1">${esc(t.name)}</div><span class="rs">${t.coins}</span></div>`).join("")+"</div>";
    }

    let side="";
    if(snap.appStage==="play"){
      const sorted=snap.teams.slice().sort((a,b)=>b.coins-a.coins);
      side=`<h3>${L.standH}</h3><div class="stand2">`+sorted.map(t=>{
        const metsHtml=Object.keys(MET[playerLang]).map(k=>`<span${t.met[k]<0?' class="low"':''}>${MET[playerLang][k].split(" ")[0]}${t.met[k]>0?"+":""}${t.met[k]}</span>`).join(" ");
        return `<div class="srow2${active&&t.id===active.id?" up":""}">
          <div class="sr-top"><span class="dot2" style="background:${t.color}"></span><span class="nm">${esc(t.name)}</span><span class="sc">${t.coins}</span></div>
          <div class="sr-bot"><span class="mets">${metsHtml}</span><span class="cn">${t.turnsTaken}/${snap.turnsPerTeam}</span></div>
        </div>`;
      }).join("")+`</div>`;
    }

    $("joinWaiting").innerHTML=`<div class="pdash-head">${head}</div><div class="pdash-grid"><div class="pdash-main">${main}</div>${side?`<div class="pdash-side">${side}</div>`:""}</div>`;

    if(!mine)return;
    const rollBtn=$("playerRollBtn");
    if(rollBtn)rollBtn.onclick=()=>{markSent(turn,"roll");NET.submitAction(joinedRoom,{type:"roll",team,token:turn.token});renderPlayerDashboard(snap,team);};
    const drawBtn=$("playerDrawBtn");
    if(drawBtn)drawBtn.onclick=()=>{markSent(turn,"drawCard");NET.submitAction(joinedRoom,{type:"drawCard",team,token:turn.token});renderPlayerDashboard(snap,team);};
    const ackBtn=$("playerAckBtn");
    if(ackBtn)ackBtn.onclick=()=>{markSent(turn,"ackChance");NET.submitAction(joinedRoom,{type:"ackChance",team,token:turn.token});renderPlayerDashboard(snap,team);};
    const nextBtn=$("playerNextBtn");
    if(nextBtn)nextBtn.onclick=()=>{markSent(turn,"nextTurn");NET.submitAction(joinedRoom,{type:"nextTurn",team,token:turn.token});renderPlayerDashboard(snap,team);};
    if(turn.phase==="card"&&turn.cardType!=="chance"&&turn.card&&turn.card.o){
      $("joinWaiting").querySelectorAll(".playerOpt").forEach(btn=>{
        btn.onclick=()=>{
          const idx=parseInt(btn.dataset.idx,10);
          markSent(turn,"choice");
          NET.submitAction(joinedRoom,{type:"choice",team,token:turn.token,optIdx:idx});
          renderPlayerDashboard(snap,team);
        };
      });
    }
    function findFirst(sel){
      const list=$("joinWaiting").querySelectorAll(sel);
      return list&&list.length?list[0]:null;
    }
  }
}

/* ============ boot ============ */
function boot(){
  const params=new URLSearchParams(location.search);
  const isPlayer=params.get("player")==="1";
  if(isPlayer){
    $("facilitator").classList.add("hide");
    $("player").classList.remove("hide");
    initPlayerView();
    return;
  }
  const saved=loadLocal();
  state=(saved&&saved.teams&&saved.turnsPerTeam)?saved:freshState();
  NET.init();
  NET.bindRoom();
  NET.onAction(handleIncomingAction);
  wireFacilitator();
  renderLegendAndHelp();
  render();
  saveLocal();
  NET.publish();
}
document.addEventListener("DOMContentLoaded",boot);
</script>
