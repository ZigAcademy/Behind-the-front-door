<!DOCTYPE html>
<html lang="nl" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Behind the Front Door — Digitaal spelbord · Zig Grow</title>
<style>
  :root{
    --blue:#1F5AFF; --orange:#FF9000; --navy:#152330; --white:#FFFFFF;
    --ink:#152330; --muted:#5B6472; --line:#E4E3DC; --bg:#FBF7EE;
    --card:#FFFFFF; --warn:#E4572E; --soft:#EAF0FF; --softwarm:#FFF1E0; --cream:#FBF3E4;
    --shadow:0 10px 30px rgba(21,35,48,.10); --shadow-sm:0 4px 14px rgba(21,35,48,.07);
  }
  @media (prefers-color-scheme: dark){
    :root{ --ink:#EDF1F7; --muted:#9AA7BD; --line:#26324A; --bg:#0D1626;
      --card:#131E31; --soft:#16233D; --softwarm:#2A2010; --cream:#182338; --shadow:0 10px 30px rgba(0,0,0,.45); --shadow-sm:0 4px 14px rgba(0,0,0,.35);}
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:Arial,Helvetica,"Segoe UI",sans-serif;color:var(--ink);min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased;
    background:
      radial-gradient(900px 520px at 12% -12%, #FFF4DF 0%, transparent 55%),
      radial-gradient(1100px 700px at 100% 0%, #F4E8CF 0%, transparent 52%),
      radial-gradient(1500px 950px at 50% 125%, #E4D3AE 0%, transparent 55%),
      linear-gradient(162deg,#F4EAD7,#EADCC0);
    background-attachment:fixed}
  @media (prefers-color-scheme:dark){body{background:radial-gradient(1200px 700px at 50% -10%, #17253f 0%, transparent 55%),linear-gradient(162deg,#101b31,#0b1322);background-attachment:fixed}}
  .wrap{max-width:1200px;margin:0 auto;padding:0 18px 70px}
  a{color:var(--blue)}
  button{font-family:inherit}
  .logo{height:30px;width:auto;display:block}
  header.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--card) 88%, transparent);
    backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line)}
  .top-in{max-width:1200px;margin:0 auto;padding:11px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .brandline{display:flex;align-items:center;gap:13px;min-width:0}
  .brandline h1{font-size:17px;margin:0;font-weight:800;letter-spacing:-.2px;white-space:nowrap}
  .brandline .sub{color:var(--muted);font-size:12px;white-space:nowrap}
  .spacer{flex:1 1 auto}
  .join-chip{display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px}
  .join-chip b{font-family:Consolas,monospace;letter-spacing:2px;color:var(--blue)}
  .netchip{font-size:12px;font-weight:800;padding:6px 10px;border-radius:9px;white-space:nowrap}
  .netchip.live{background:#e5f7ee;color:#137a44}.netchip.off{background:#fff1e0;color:#b3391b}
  .pnet{font-size:13px;font-weight:700;border-radius:10px;padding:10px 12px;margin:0 0 16px;text-align:start;line-height:1.4}
  .pnet.live{background:#e5f7ee;color:#137a44}.pnet.off{background:#fff1e0;color:#b3391b}
  .btn{border:0;border-radius:11px;padding:9px 15px;font-size:14px;font-weight:700;cursor:pointer;
    background:var(--blue);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.06);transition:transform .05s, filter .15s}
  .btn:hover{filter:brightness(1.06)} .btn:active{transform:translateY(1px)}
  .btn.ghost{background:transparent;color:var(--blue);border:1.5px solid var(--blue);box-shadow:none}
  .btn.soft{background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none}
  .btn.warn{background:var(--orange)}
  .btn.sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
  .btn.big{padding:13px 22px;font-size:16px;border-radius:13px}
  .btn:disabled{opacity:.45;cursor:default;filter:none}
  .langbtn{font-weight:800;letter-spacing:.5px}
  .phases{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 6px}
  .phase{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:var(--shadow-sm)}
  .phase.active{background:var(--navy);color:#fff;border-color:var(--navy)}
  .phase .n{color:var(--orange);margin-inline-end:5px}
  .hint{color:var(--muted);font-size:13.5px;margin:4px 2px 16px}
  .grid{display:grid;grid-template-columns:1.12fr .88fr;gap:20px;align-items:start}
  @media (max-width:940px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px}
  .panel h2{margin:0 0 12px;font-size:14px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted)}
  .teams{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:1200px){.teams{grid-template-columns:1fr}}
  @media (max-width:940px){.teams{grid-template-columns:1fr 1fr}}
  @media (max-width:620px){.teams{grid-template-columns:1fr}}
  .team{border:1px solid var(--line);border-radius:15px;padding:14px;background:var(--card);position:relative;box-shadow:var(--shadow-sm)}
  .team.flag{border-color:var(--warn);box-shadow:0 0 0 2px rgba(228,87,46,.14)}
  .team .thead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
  .team .tname{font-weight:800;font-size:16px;border:0;background:transparent;color:var(--ink);width:60%;padding:2px 0}
  .team .tname:focus{outline:2px solid var(--blue);border-radius:6px}
  .coins{font-weight:800;font-size:14px;color:#7a4100;border:1px solid #e7b768;border-radius:20px;padding:3px 11px;white-space:nowrap;
    background:linear-gradient(180deg,#ffe392,#f3b73f);box-shadow:0 1px 2px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.65)}
  .meter{margin:9px 0}
  .meter .mlab{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px}
  .meter .mlab .v{font-weight:800}
  .bar{position:relative;height:13px;border-radius:8px;overflow:visible;border:1px solid #d7cfbd;
    background:repeating-linear-gradient(90deg,#ece5d6 0,#ece5d6 calc(5% - 1.4px),#d1c9b6 calc(5% - 1.4px),#d1c9b6 5%)}
  @media (prefers-color-scheme:dark){.bar{border-color:#2c3852;background:repeating-linear-gradient(90deg,#1c2740 0,#1c2740 calc(5% - 1.4px),#2c3852 calc(5% - 1.4px),#2c3852 5%)}}
  .bar > span{display:block;height:100%;border-radius:7px 0 0 7px;background:linear-gradient(90deg,var(--blue),#4d7bff);position:relative;transition:width .45s cubic-bezier(.4,1.3,.5,1)}
  .bar > span::after{content:"";position:absolute;right:-8px;top:50%;width:16px;height:16px;border-radius:50%;transform:translateY(-50%);z-index:2;
    background:radial-gradient(circle at 34% 30%,#fff,#4d7bff 58%,var(--blue));box-shadow:0 2px 5px rgba(21,35,48,.4),inset 0 0 0 2px rgba(255,255,255,.55)}
  .bar.red > span{background:linear-gradient(90deg,var(--warn),#ff7a54)}
  .bar.red > span::after{background:radial-gradient(circle at 34% 30%,#fff,#ff7a54 58%,var(--warn))}
  .step{display:flex;gap:5px;margin-top:4px}
  .step button{width:26px;height:24px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:800;cursor:pointer;font-size:13px;line-height:1}
  .step button:hover{border-color:var(--blue);color:var(--blue)}
  .team .score{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);display:flex;justify-content:space-between;align-items:center;font-size:13px}
  .team .score b{font-size:17px}
  .flagtag{font-size:11px;font-weight:800;color:#fff;background:var(--warn);border-radius:6px;padding:2px 7px}
  .optrow{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .optrow .btn.sm{flex:1 1 auto}
  .chosen{font-size:12px;color:var(--muted);margin-top:9px}
  .chosen b{color:var(--ink)}
  .cstep{display:flex;gap:5px;margin:2px 0 6px}
  .cardview{min-height:430px;display:flex;flex-direction:column}
  .cvhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .cvhead .count{font-size:13px;color:var(--muted);font-weight:700}
  .stage{flex:1;display:flex;flex-direction:column;justify-content:center;perspective:1400px}
  .deck{position:relative;height:250px;display:flex;align-items:center;justify-content:center}
  .deckstack{position:relative;width:200px;height:250px}
  .cardback{position:absolute;inset:0;border-radius:16px;background:
      radial-gradient(120px 120px at 30% 20%, rgba(255,144,0,.25), transparent 60%),
      linear-gradient(150deg,#1b3fb0,var(--blue) 40%,var(--navy));
    box-shadow:var(--shadow);border:2px solid rgba(255,255,255,.15);overflow:hidden}
  .cardback::before{content:"↗";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:96px;font-weight:900;color:var(--orange);opacity:.9;transform:translateY(-4px)}
  .cardback::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.04) 0 10px,transparent 10px 20px)}
  .deckstack .cardback:nth-child(1){transform:translate(10px,10px) rotate(4deg)}
  .deckstack .cardback:nth-child(2){transform:translate(5px,5px) rotate(2deg)}
  .deckstack .cardback:nth-child(3){transform:none}
  .deck.shuffling .deckstack{animation:shuffle .5s ease}
  @keyframes shuffle{0%{transform:none}25%{transform:translateX(-8px) rotate(-3deg)}50%{transform:translateX(8px) rotate(3deg)}75%{transform:translateX(-4px) rotate(-1deg)}100%{transform:none}}
  .drawwrap{text-align:center;margin-top:14px}
  .drawwrap .lead{font-size:14px;color:var(--muted);margin-bottom:10px}
  .gc{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card);box-shadow:0 18px 38px rgba(21,35,48,.18),0 3px 0 rgba(21,35,48,.05);transform-origin:center}
  .gc .illo{height:196px;background-size:cover;background-repeat:no-repeat;background-position:center;position:relative}
  .gc .illo .kind{position:absolute;left:0;bottom:0;margin:0;padding:6px 14px;font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:#fff;border-top-right-radius:12px}
  .gc.scenario .illo .kind, .gc.journey .illo .kind{background:var(--blue)}
  .gc.reveal .illo .kind{background:var(--navy)} .gc.crisis .illo .kind{background:var(--warn)} .gc.shock .illo .kind{background:var(--orange)}
  .gc .body{padding:15px 16px}
  .gc .ct{font-size:19px;font-weight:800;margin:0 0 8px;letter-spacing:-.2px}
  .gc .cx{font-size:14.5px;margin:0 0 10px}
  .gc .meta{font-size:13px;color:var(--muted);margin:8px 0 0}
  .gc .meta b{color:var(--ink)}
  .opt{border:1px solid var(--line);border-radius:11px;padding:9px 12px;margin-top:8px}
  .opt .ol{font-weight:800;font-size:13.5px;margin-bottom:2px}
  .opt .oe{font-size:12.5px;color:var(--muted)}
  .tag{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:2px 7px;margin:3px 4px 0 0}
  .tag.pay{background:var(--softwarm);color:#8a4b00}.tag.gain{background:#e5f7ee;color:#137a44}
  .tag.up{background:#e5f0ff;color:#0a44c9}.tag.down{background:#fdece9;color:#b3391b}
  .banner{background:var(--soft);border:1px solid var(--line);border-inline-start:5px solid var(--orange);border-radius:11px;padding:11px 13px;font-size:13.5px;margin-top:12px}
  .banner b{color:var(--ink)}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  select,input[type=text],input[type=number]{font-family:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
  label.fld{display:block;font-size:12.5px;color:var(--muted);font-weight:700;margin:0 0 4px}
  .setup-row{display:grid;grid-template-columns:1.4fr .6fr auto;gap:10px;align-items:end;margin-bottom:10px}
  .cover{height:230px;border-radius:14px;background-size:contain;background-repeat:no-repeat;background-position:center;background-color:#FBF3E4;margin-bottom:14px;box-shadow:var(--shadow-sm)}
  .rank{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:13px;margin-bottom:10px;background:var(--card);box-shadow:var(--shadow-sm)}
  .rank .pos{font-size:22px;font-weight:900;color:var(--blue);width:34px;text-align:center}
  .rank.first{border-color:var(--orange);background:var(--softwarm)}
  .rank .rn{font-weight:800;font-size:16px}
  .rank .rs{margin-inline-start:auto;font-size:22px;font-weight:900}
  .rank .rd{font-size:12px;color:var(--muted)}
  .raceboard{margin-bottom:20px}
  .lane{display:flex;align-items:center;gap:10px;margin:8px 0}
  .lane .rankn{flex:0 0 26px;text-align:center;font-weight:900;font-size:15px;color:var(--muted)}
  .lane .lname{flex:0 0 96px;font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lane .track{position:relative;flex:1;height:26px;border-radius:14px;border:1px solid #dcd3bf;background:repeating-linear-gradient(90deg,#efe8d8 0 7px,#e6ddc8 7px 14px)}
  @media (prefers-color-scheme:dark){.lane .track{border-color:#2c3852;background:repeating-linear-gradient(90deg,#1b2740 0 7px,#223052 7px 14px)}}
  .lane .track .finish{position:absolute;right:5px;top:50%;transform:translateY(-50%);font-size:15px;opacity:.75}
  .lane .pawn{position:absolute;top:50%;transform:translate(-50%,-50%);width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 5px rgba(21,35,48,.4);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:12px;z-index:2;transition:left .55s cubic-bezier(.4,1.2,.5,1)}
  .lane .lscore{flex:0 0 32px;text-align:right;font-weight:800;font-size:14px}
  .chancebtn{width:100%;margin-top:10px}
  .chancecard{margin-top:10px;border-radius:12px;padding:11px 13px;border:1px solid;position:relative;overflow:hidden}
  .chancecard.good{background:#e9f9f0;border-color:#8fddb4}.chancecard.bad{background:#fdeee9;border-color:#f2b3a1}
  @media (prefers-color-scheme:dark){.chancecard.good{background:#12301f;border-color:#1f5a3a}.chancecard.bad{background:#331912;border-color:#5a2a1c}}
  .chancecard .ctt{font-weight:800;font-size:13.5px;margin-bottom:2px}
  .chancecard .cxx{font-size:12.5px;color:var(--muted)}
  .chancecard .cff{font-size:12px;font-weight:800;margin-top:5px}
  .chancecard.good .cff{color:#137a44}.chancecard.bad .cff{color:#b3391b}
  .chancecard .emoji{position:absolute;right:10px;top:8px;font-size:22px;opacity:.5}
  footer{color:var(--muted);font-size:12.5px;text-align:center;margin-top:34px;padding-top:16px;border-top:1px solid var(--line)}
  .hide{display:none!important}
  @keyframes deal{0%{opacity:0;transform:translateY(38px) rotateY(85deg) scale(.9)}55%{opacity:1;transform:translateY(0) rotateY(-6deg) scale(1.015)}100%{transform:none}}
  .deal{animation:deal .72s cubic-bezier(.2,.9,.3,1.1) both;position:relative}
  .deal::after{content:"";position:absolute;inset:0;border-radius:16px;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-120%);animation:shine .9s ease .12s 1}
  @keyframes shine{to{transform:translateX(120%)}}
  @media (prefers-reduced-motion:reduce){.deal,.deal::after,.deck.shuffling .deckstack{animation:none}}
  .player-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .join-card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:30px;max-width:430px;width:100%;text-align:center}
  .join-card .logo{height:34px;margin:0 auto 8px}
  .join-card .jc-cover{height:150px;border-radius:14px;background-size:contain;background-repeat:no-repeat;background-position:center;background-color:#FBF3E4;margin:6px 0 18px}
  .join-card h1{font-size:22px;margin:0 0 4px}.join-card p.s{color:var(--muted);font-size:14px;margin:0 0 18px}
  .join-card .fldwrap{text-align:start;margin-bottom:14px}.join-card input,.join-card select{width:100%}
  .waiting{display:none}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--orange);margin:0 3px;animation:pulse 1.2s infinite}
  .dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
  @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
</style>
</head>
<body>

<div id="facilitator">
  <header class="top">
    <div class="top-in">
      <div class="brandline" id="brand"></div>
      <div class="spacer"></div>
      <div class="join-chip"><span id="roomLbl">Kamer</span>&nbsp;<b id="roomCode">----</b></div>
      <span id="netStatus" class="netchip off"></span>
      <button class="btn ghost sm" id="soundToggle" title="Geluid aan/uit">🔊</button>
      <button class="btn ghost sm" id="fxToggle" title="Effecten tonen/verbergen">👁</button>
      <button class="btn ghost sm langbtn" id="langToggle">EN</button>
      <button class="btn ghost sm" id="copyJoin">Join-link kopiëren</button>
      <button class="btn soft sm" id="resetGame">Nieuw spel</button>
    </div>
  </header>
  <div class="wrap">
    <div class="phases" id="phaseNav"></div>
    <div class="hint" id="phaseHint"></div>

    <section id="view-setup" class="panel hide">
      <div class="cover" style="background-image:url('assets/buurt.jpg')"></div>
      <h2 id="setupH">Teams instellen</h2>
      <p class="hint" id="setupP" style="margin-top:0"></p>
      <div id="setupRows"></div>
      <div class="toolbar" style="margin-top:6px">
        <button class="btn soft sm" id="addTeam">+ Team toevoegen</button>
        <button class="btn warn" id="startGame">Spel starten →</button>
      </div>
    </section>

    <section id="view-play" class="hide">
      <div class="panel raceboard"><h2 id="raceTitle">Stand</h2><div id="raceBoard"></div></div>
      <div class="grid">
        <div><div class="panel">
          <h2 id="teamsTitle">Teams</h2>
          <div class="toolbar" id="incomeBar"></div>
          <div class="teams" id="teamsWrap"></div>
        </div></div>
        <div><div class="panel cardview">
          <div class="cvhead"><span class="count" id="cardCount"></span></div>
          <div class="stage" id="cardHost"></div>
          <div class="banner" id="phaseTip"></div>
        </div></div>
      </div>
    </section>

    <section id="view-scores" class="panel hide">
      <h2 id="scoresH">Eindstand</h2>
      <p class="hint" id="scoresP" style="margin-top:0"></p>
      <div id="scoreWrap"></div>
    </section>

    <footer id="footNL"></footer>
  </div>
</div>

<div id="player" class="player-shell hide">
  <div class="join-card">
    <div id="pLogo"></div>
    <div class="jc-cover" style="background-image:url('assets/buurt.jpg')"></div>
    <div id="pNet" class="pnet"></div>
    <div id="joinForm">
      <h1 id="jfH">Doe mee</h1>
      <p class="s" id="jfSub"></p>
      <div class="fldwrap"><label class="fld" id="jfRoomL" for="pRoom">Kamercode</label><input type="text" id="pRoom" maxlength="6" placeholder="AB3K" autocomplete="off"></div>
      <div class="fldwrap"><label class="fld" id="jfNameL" for="pName">Jouw naam</label><input type="text" id="pName" autocomplete="off"></div>
      <div class="fldwrap"><label class="fld" id="jfTeamL" for="pTeam">Team</label>
        <select id="pTeam"><option value="1">Team 1</option><option value="2">Team 2</option><option value="3">Team 3</option><option value="4">Team 4</option></select></div>
      <button class="btn warn big" id="joinBtn" style="width:100%">Meedoen →</button>
    </div>
    <div class="waiting" id="joinWaiting">
      <h1 id="jwH">Je bent binnen! 🎉</h1>
      <p class="s"><b id="joinWho"></b> — <span id="jwRoomL">kamer</span> <b id="joinRoomEcho"></b></p>
      <p style="font-size:14px" id="jwWait"></p>
      <div class="banner" id="jwBanner" style="text-align:start"></div>
    </div>
  </div>
</div>

<template id="logoTpl">

let SOUND=true,_actx=null;
function sfx(kind){if(!SOUND)return;try{_actx=_actx||new (window.AudioContext||window.webkitAudioContext)();const c=_actx,t=c.currentTime;
  if(kind==="draw"){const o=c.createOscillator(),g=c.createGain();o.type="triangle";o.frequency.setValueAtTime(200,t);o.frequency.exponentialRampToValueAtTime(680,t+.18);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.11,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+.3);o.connect(g).connect(c.destination);o.start(t);o.stop(t+.32);}
  else if(kind==="click"){const o=c.createOscillator(),g=c.createGain();o.type="square";o.frequency.setValueAtTime(520,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.07,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+.12);o.connect(g).connect(c.destination);o.start(t);o.stop(t+.13);}
  else if(kind==="coin"){[880,1320].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain(),tt=t+i*.07;o.type="sine";o.frequency.setValueAtTime(f,tt);g.gain.setValueAtTime(.0001,tt);g.gain.exponentialRampToValueAtTime(.09,tt+.01);g.gain.exponentialRampToValueAtTime(.0001,tt+.2);o.connect(g).connect(c.destination);o.start(tt);o.stop(tt+.22);});}
}catch(e){}}

/* ---------------- Deck ---------------- */
function pickCrisis(){const avail=CRIS_NL.map(c=>c.id).filter(id=>!state.usedCrises.includes(id));const pool=avail.length?avail:CRIS_NL.map(c=>c.id);const id=pool[Math.floor(Math.random()*pool.length)];state.usedCrises.push(id);return id;}
function ensureDeck(phase){
  if(state.decks[phase])return;
  if(phase==="fase1")state.decks.fase1=shuffle(SCEN_NL.map(s=>({t:"scenario",id:s.id})));
  else if(phase==="fase2"){const base=state.decks.fase1||SCEN_NL.map(s=>({t:"scenario",id:s.id}));state.decks.fase2=base.map(e=>({t:"reveal",id:e.id}));}
  else if(phase==="shock")state.decks.shock=[{t:"shock",id:"S"}];
  else if(QUARTERS[phase]){const jr=shuffle(QUARTERS[phase].map(id=>({t:"journey",id})));jr.push({t:"crisis",id:pickCrisis()});state.decks[phase]=jr;}
  if(state.drawn[phase]==null)state.drawn[phase]=0;
}
function currentDeck(){ensureDeck(state.phase);return state.decks[state.phase]||[];}
function drawnCount(){return state.drawn[state.phase]||0;}
function buildCard(entry,phase){
  if(!entry)return null;
  const kind=entry.t, d=curContent()[kind==="reveal"?"scenario":kind][entry.id];
  const key=phase+"-"+entry.id, cat="assets/"+(CAT[entry.id]||"buurt")+".jpg";
  if(kind==="scenario")return {key,kind,cat,data:d};
  if(kind==="reveal")return {key,kind:"reveal",cat,data:d};
  return {key,kind,cat,data:d,options:d.o};
}
function activeCard(){const deck=currentDeck(),n=drawnCount();if(n<=0||!deck.length)return null;return buildCard(deck[Math.min(n,deck.length)-1],state.phase);}
function doDraw(){ensureDeck(state.phase);const deck=state.decks[state.phase]||[];const n=state.drawn[state.phase]||0;if(n>=deck.length)return false;state.drawn[state.phase]=n+1;render();return true;}
function drawChance(phase,teamId){
  if(!QUARTERS[phase])return false;
  state.chance[phase]=state.chance[phase]||{};
  if(state.chance[phase][teamId]!=null)return false;
  const t=teamById(teamId);if(!t)return false;
  const id=CHANCE_IDS[Math.floor(Math.random()*CHANCE_IDS.length)];const card=CHANCE_NL.find(c=>c.id===id);
  t.coins=Math.max(0,t.coins+card.coins);Object.keys(card.fx||{}).forEach(k=>{t[k]=clamp(t[k]+card.fx[k],0,20);});
  state.chance[phase][teamId]=id;sfx(card.good?"coin":"click");render();return true;
}
function chanceCardFor(teamId){const id=(state.chance[state.phase]||{})[teamId];if(id==null)return null;return curContent().chance[id];}
function chanceFxText(card){const Mn=met();const a=[];if(card.coins<0)a.push("🪙 −"+Math.abs(card.coins));if(card.coins>0)a.push("🪙 +"+card.coins);Object.keys(card.fx||{}).forEach(k=>a.push(Mn[k]+" "+(card.fx[k]>0?"+":"")+card.fx[k]));return a.join(" · ");}

function renderSetup(){const host=$("#setupRows");host.innerHTML="";state.setup.forEach((s,i)=>{const row=document.createElement("div");row.className="setup-row";row.innerHTML='<div><label class="fld">'+TT("tname")+'</label><input type="text" data-setup="name" data-i="'+i+'" value="'+esc(s.name)+'" style="width:100%"></div><div><label class="fld">'+TT("qbonus")+'</label><input type="number" min="0" max="4" data-setup="bonus" data-i="'+i+'" value="'+s.bonus+'" style="width:100%"></div><div><button class="btn soft sm" data-delteam="'+i+'" '+(state.setup.length<=1?"disabled":"")+'>'+TT("remove")+'</button></div>';host.appendChild(row);});}
function renderRace(){
  const host=$("#raceBoard");if(!host)return;
  const ranked=state.teams.map(t=>({t,s:score(t).total})).sort((a,b)=>b.s-a.s);
  if(!ranked.length){host.innerHTML='<div class="hint" style="margin:0">—</div>';return;}
  const scores=ranked.map(r=>r.s);const lo=Math.min(20,...scores),hi=Math.max(80,...scores);
  host.innerHTML=ranked.map((r,i)=>{
    const col=TEAM_COLORS[(r.t.id-1)%TEAM_COLORS.length];
    const pos=hi>lo?clamp((r.s-lo)/(hi-lo)*100,4,94):50;
    return '<div class="lane"><div class="rankn">'+(i===0?"🏆":(i+1))+'</div><div class="lname" style="color:'+col+'">'+esc(r.t.name)+'</div>'+
      '<div class="track"><span class="finish">🏁</span><span class="pawn" style="left:'+pos+'%;background:'+col+'">'+r.t.id+'</span></div>'+
      '<div class="lscore">'+r.s+'</div></div>';
  }).join("");
}
function chanceBlock(t){
  if(!QUARTERS[state.phase])return "";

  return '<button class="btn warn sm chancebtn" data-chance="'+t.id+'">🎲 '+TT("drawChance")+'</button>';
}
function renderTeams(){
  $("#teamsTitle").textContent=phaseLabel(state.phase);
  renderIncomeBar();
  const wrap=$("#teamsWrap");wrap.innerHTML="";const card=activeCard(),Mn=met();

function applyChoice(teamId,optIdx){const card=activeCard();if(!card||!card.options)return;const key=card.key;state.choices[key]=state.choices[key]||{};if(state.choices[key][teamId]!=null)return;const t=teamById(teamId);const snap={sat:t.sat,fin:t.fin,comp:t.comp,dur:t.dur,coins:t.coins};const o=card.options[optIdx];t.coins+=o.coins;Object.keys(o.fx||{}).forEach(k=>{t[k]=clamp(t[k]+o.fx[k],0,20);});if(t.coins<0)t.coins=0;state.choices[key][teamId]={opt:optIdx,snap};sfx("click");render();}
function undoChoice(teamId){const card=activeCard();if(!card)return;const key=card.key,rec=(state.choices[key]||{})[teamId];if(!rec)return;const t=teamById(teamId);Object.assign(t,rec.snap);delete state.choices[key][teamId];if(typeof NET!=="undefined"&&NET.clearInput)NET.clearInput(key,teamId);render();}
function applyIncome(amount){const q=state.phase;if(state.batches["inc-"+q+"-5"]||state.batches["inc-"+q+"-3"])return;state.teams.forEach(t=>{t.coins+=amount;});state.batches["inc-"+q+"-"+amount]=true;sfx("coin");render();}
function applyAllCost(amount,bk){if(state.batches[bk])return;state.teams.forEach(t=>{t.coins=Math.max(0,t.coins-amount);});state.batches[bk]=true;render();}
function startGame(){state.teams=state.setup.map((s,i)=>({id:i+1,name:s.name||("Team "+(i+1)),sat:10,fin:10,comp:10,dur:10,coins:12+(parseInt(s.bonus)||0)}));state.phase="fase1";state.decks={};state.drawn={};state.usedCrises=[];state.choices={};state.batches={};state.chance={};render();}
function hostDraw(){sfx("draw");const dk=document.getElementById("deckEl");if(dk){dk.classList.add("shuffling");setTimeout(doDraw,430);}else doDraw();}
function toggleLang(){state.lang=(L()==="nl"?"en":"nl");render();}

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-phase],[data-choose],[data-undo],[data-m],[data-coin],[data-income],[data-allcost],[data-delteam],[data-draw],[data-chance],#addTeam,#startGame,#resetGame,#copyJoin,#langToggle,#soundToggle,#fxToggle");
  if(!el)return;
  if(el.id==="soundToggle"){SOUND=!SOUND;if(state)state.sound=SOUND;save();$("#soundToggle").textContent=SOUND?"🔊":"🔇";if(SOUND)sfx("click");return;}
  if(el.id==="fxToggle"){state.showEffects=!state.showEffects;render();return;}
  if(el.dataset.chance!=null){drawChance(state.phase,parseInt(el.dataset.chance));return;}
  if(el.id==="langToggle"){toggleLang();return;}
  if(el.dataset.phase){state.phase=el.dataset.phase;render();return;}
  if(el.dataset.draw){hostDraw();return;}
  if(el.dataset.choose!=null){applyChoice(parseInt(el.dataset.t),parseInt(el.dataset.choose));return;}
  if(el.dataset.undo!=null){undoChoice(parseInt(el.dataset.undo));return;}
  if(el.dataset.m){const t=teamById(parseInt(el.dataset.t));t[el.dataset.m]=clamp(t[el.dataset.m]+parseInt(el.dataset.d),0,20);render();return;}
  if(el.dataset.coin){const t=teamById(parseInt(el.dataset.coin));t.coins=Math.max(0,t.coins+parseInt(el.dataset.d));render();return;}
  if(el.dataset.income){applyIncome(parseInt(el.dataset.income));return;}
  if(el.dataset.allcost){applyAllCost(parseInt(el.dataset.allcost),el.dataset.batch);return;}
  if(el.dataset.delteam!=null){state.setup.splice(parseInt(el.dataset.delteam),1);renderSetup();return;}
  if(el.id==="addTeam"){if(state.setup.length<6){state.setup.push({name:"Team "+(state.setup.length+1),bonus:0});renderSetup();}return;}
  if(el.id==="startGame"){startGame();return;}
  if(el.id==="resetGame"){if(confirm(TT("confirm"))){const rm=state.room,lg=state.lang;state=freshState();state.room=rm;state.lang=lg;render();}return;}

});

function localizeJoin(l){
  $("#jfH").textContent=pt(l,"joinH");$("#jfSub").textContent=pt(l,"joinSub");
  $("#jfRoomL").textContent=pt(l,"roomcode");$("#jfNameL").textContent=pt(l,"yourname");$("#jfTeamL").textContent=pt(l,"teamw");
  $("#pName").placeholder=pt(l,"yourname");$("#joinBtn").textContent=pt(l,"joinbtn");
  $("#jwH").textContent=pt(l,"youin");$("#jwRoomL").textContent=pt(l,"jwRoom");$("#jwWait").innerHTML=pt(l,"waitstart")+'<span class="dot"></span><span class="dot"></span><span class="dot"></span>';$("#jwBanner").textContent=pt(l,"jwBanner");
  document.documentElement.lang=l;
}
function initPlayer(room,plang){
  document.getElementById("pLogo").innerHTML=logoSVG();
  $("#facilitator").classList.add("hide");$("#player").classList.remove("hide");
  if(room)$("#pRoom").value=room;
  localizeJoin(plang);
  const _live=fbReady();const _pn=$("#pNet");if(_pn){_pn.className="pnet "+(_live?"live":"off");_pn.textContent=pt(plang,_live?"pNetLive":"pNetOff");}
  document.addEventListener("click",e=>{
    const b=e.target.closest("[data-psend],[data-pdraw],[data-pchance]");if(!b||!PLAYER)return;
    if(b.dataset.pchance){sfx("draw");NET.sendChance(PLAYER.room,PLAYER.teamId);b.disabled=true;return;}
    if(b.dataset.pdraw){sfx("draw");NET.sendDraw(PLAYER.room);const dk=document.querySelector(".deck");if(dk)dk.classList.add("shuffling");b.disabled=true;return;}
    if(b.dataset.psend!=null&&PLAYER.lastKey){sfx("click");NET.sendInput(PLAYER.room,PLAYER.lastKey,PLAYER.teamId,parseInt(b.dataset.psend));$$(".optrow [data-psend]").forEach(x=>x.disabled=true);}
  });
  $("#joinBtn").addEventListener("click",()=>{
    const name=$("#pName").value.trim()||(plang==="en"?"Player":"Speler");const code=($("#pRoom").value.trim().toUpperCase())||"----";const teamId=parseInt($("#pTeam").value);const teamLabel=$("#pTeam").selectedOptions[0].textContent;
    PLAYER={pid:randCode()+randCode(),name,teamId,teamLabel,room:code,lastKey:null,lang:plang};
    if(NET.initPlayer(code,renderPlayer)){NET.presence(code,PLAYER.pid,{name:name,team:teamId});showPlayerBoard();}
    else {$("#joinWho").textContent=name+" · "+teamLabel;$("#joinRoomEcho").textContent=code;$("#joinForm").style.display="none";$("#joinWaiting").style.display="block";}
  });
}

/* ---------------- Boot ---------------- */
(function boot(){
  const params=new URLSearchParams(location.search);
  if(params.get("role")==="player"){const pl=params.get("lang")==="en"?"en":"nl";initPlayer((params.get("room")||"").toUpperCase(),pl);return;}
  state=load()||freshState();if(!state.room)state.room=randCode();if(!state.lang)state.lang="nl";SOUND=state.sound!==false;
  render();NET.initHost();
})();
</script>
