 {id:"C4",t:"Contractor bankrupt",x:"Halfway through renovating 60 homes the main contractor goes bankrupt. The scaffolding stands abandoned and the residents are left amid the dust.",o:[{l:"A · Pricier party, keep building",e:"Spare residents, costly.",coins:-3,fx:{sat:1,dur:1},mx:{sat:"Residents no longer have to live in a stalled building site.",dur:"The renovation, including sustainability upgrades, still gets finished."}},{l:"B · Pause, re-tender",e:"Cheaper, residents suffer.",coins:-1,fx:{sat:-2,dur:-1},mx:{sat:"Residents are stuck longer with a stalled site.",dur:"The homes' sustainability upgrade gets delayed."}},{l:"C · Finish it yourself",e:"Improvise, patchy.",coins:-2,fx:{sat:-1},mx:{sat:"An improvised finish gives residents a patchy result."}}],sp:"Sparing residents versus controlling costs. They're stuck amid the dust right now, but every option costs more than budgeted."},
 {id:"C5",t:"Media storm over allocation",x:"A national newspaper headlines that your allocation algorithm disadvantages certain groups. The alderman asks questions and tenant organisations demand answers.",o:[{l:"A · Independent research",e:"Restore trust.",coins:-1,fx:{comp:2},mx:{comp:"An independent investigation demonstrably shows whether the algorithm is fair."}},{l:"B · Share your own analysis",e:"Faster, less independent.",coins:0,fx:{comp:-1},mx:{comp:"An in-house analysis is less convincing than an independent one."}},{l:"C · Defend with a press release",e:"Take a stand, risky.",coins:0,fx:{sat:-2,comp:-1},mx:{sat:"Defensive messaging feels like denial rather than listening to tenants.",comp:"A press release doesn't actually demonstrate the algorithm is fair."}}],sp:"Restoring trust versus reacting fast. An independent study is the most convincing, but takes too long for today's news cycle."},
 {id:"C6",t:"Landlord levy 2.0",x:"The state unexpectedly announces a new levy on social rental homes. The gap in the budget is large — something will have to give.",o:[{l:"A · Cut in the organisation",e:"Internal pain, keep the course.",coins:-3,fx:{comp:1},mx:{comp:"The budget stays on track without touching the tenant."}},{l:"B · Slow down investments",e:"Sacrifice sustainability.",coins:-1,fx:{dur:-2},mx:{dur:"Sustainability projects get delayed or cut to absorb the levy."}},{l:"C · Raise rents",e:"Tenants chip in.",coins:0,fx:{sat:-2,fin:1},mx:{sat:"Tenants help pay for a levy they didn't cause.",fin:"Extra rent income covers the budget gap."}}],sp:"Who pays the unexpected bill: the organisation itself, the sustainability agenda, or the tenant? There's no painless option."}
,
 {id:"N1",t:"The hidden legionella",x:"A routine water sample in a complex with many older residents shows an elevated legionella reading. Evacuating is drastic; doing nothing is dangerous.",o:[{l:"A · Full remediation + temporary evacuation",e:"Thorough and safe, hard on residents.",coins:-5,fx:{sat:-1,comp:2},mx:{sat:"A forced evacuation is drastic, even though it's for safety.",comp:"Full remediation tackles the danger demonstrably and thoroughly."}},{l:"B · Flush and chlorinate, residents stay",e:"Faster, some risk remains.",coins:-2,fx:{comp:-1},mx:{comp:"Residents stay inside while the risk isn't fully gone yet."}},{l:"C · Warning letter, let them flush it themselves",e:"Cheap, dangerously irresponsible.",coins:0,fx:{comp:-3,sat:-1},mx:{comp:"Leaving a life-threatening risk to residents themselves is irresponsible.",sat:"Residents don't feel protected from a real health risk."}}],sp:"Safety versus the impact on vulnerable residents. Legionella is life-threatening, but an evacuation is hardest on exactly the people least able to bear it."},
 {id:"N2",t:"Priority for the family carer",x:"A daughter wants priority for a home next to her mother, who has dementia, to provide care. The urgent waiting list is already full of medical emergencies.",o:[{l:"A · Grant carer priority",e:"Humane, sets a precedent for the list.",coins:-1,fx:{sat:2,comp:-1},mx:{sat:"The daughter can now support her mother daily.",comp:"Granting priority outside the regular urgency scheme departs from policy."}},{l:"B · Refer to the regular urgency scheme",e:"Consistent, feels cold.",coins:0,fx:{sat:-2,comp:1},mx:{sat:"The daughter gets no priority and simply has to wait.",comp:"Everyone is treated under the same scheme."}},{l:"C · Broker an informal deal with the neighbour",e:"Creative, bends the rules.",coins:-1,fx:{sat:1,comp:-2},mx:{sat:"A practical solution without an official waiting period.",comp:"Brokering outside the official rules isn't transparent or auditable."}}],sp:"Humanity versus consistency. Giving priority feels right for this daughter, but undermines the system for everyone patiently waiting their turn."},
 {id:"N3",t:"The neighbour feud escalates",x:"Two neighbours have been at odds for months over noise; police have visited three times already. One threatens to leave.",o:[{l:"A · Bring in professional mediation",e:"Costlier, real chance of lasting calm.",coins:-2,fx:{sat:1,comp:1},mx:{sat:"A neutral mediator gives both neighbours an equal hearing.",comp:"A formal mediation process is a careful, demonstrable approach."}},{l:"B · Formal warning to the offender",e:"Takes a side, risk of perceived bias.",coins:-1,fx:{sat:-1,comp:1},mx:{sat:"A side is taken, which can feel unfair to one neighbour.",comp:"At least formal action is taken against the nuisance."}},{l:"C · Don't intervene, let them sort it out",e:"Free, risk of escalation.",coins:0,fx:{sat:-2,comp:-1},mx:{sat:"Both neighbours feel abandoned.",comp:"Repeated police visits with no action from the landlord isn't careful handling."}}],sp:"Impartiality versus a quick result. A warning takes a side and can feel unfair; mediation is fairer but costs time and money."},
 {id:"N4",t:"The gas-free experiment",x:"A pilot neighbourhood of 40 homes could be the region's first to go fully gas-free, with a unique subsidy. The technology is new; residents fear high heating bills.",o:[{l:"A · Go all-in on the pilot",e:"Front-runner, risk lands on residents.",coins:-4,fx:{dur:3,sat:-1},mx:{dur:"Forty homes go fully gas-free as a front-runner.",sat:"Residents carry the risk of new, unproven technology."}},{l:"B · Small-scale experiment, 10 homes",e:"Cautious learning.",coins:-2,fx:{dur:1},mx:{dur:"A limited number of homes test the gas-free technology already."}},{l:"C · Wait for proven technology elsewhere",e:"Safe, a missed chance.",coins:0,fx:{dur:-1,sat:1},mx:{dur:"The sustainability opportunity of the moment is missed.",sat:"Residents run no risk with unproven technology."}}],sp:"Being a front-runner versus placing the risk on residents. New technology can work out brilliantly, or land high bills on people who never chose to be test subjects."},
 {id:"N5",t:"The AI allocation tool",x:"A vendor offers an AI tool that would make housing allocation faster and 'more objective'. It isn't fully transparent, but it saves a lot of admin time.",o:[{l:"A · Roll it out fully",e:"Fast, explainability uncertain.",coins:1,fx:{comp:-1,fin:1},mx:{comp:"An opaque AI tool is hard to explain to a rejected applicant.",fin:"The tool saves a lot of time, and so money, right away."}},{l:"B · Pilot with a human second check",e:"Careful, costs time.",coins:-2,fx:{comp:1},mx:{comp:"A human check on every AI decision keeps allocations explainable."}},{l:"C · Skip it, keep it all manual",e:"Safe, slower and pricier.",coins:0,fx:{comp:1,fin:-1},mx:{comp:"Manual allocation stays fully explainable and auditable.",fin:"Manual work costs more time, and so money, than a tool."}}],sp:"Efficiency versus explainability. An AI tool saves time, but who explains why a computer turned someone down for a home?"},
 {id:"N6",t:"Interest-rate swap underwater",x:"An interest-rate swap signed years ago is now deeply 'underwater' as rates fell. Buying it out now is costly; leaving it running drags on cash flow for years.",o:[{l:"A · Buy it out now, one big hit",e:"Costly now, calm later.",coins:-4,fx:{fin:2},mx:{fin:"The years-long financial burden disappears in one go."}},{l:"B · Let it run, pay in annually",e:"Delays the pain.",coins:-1,fx:{fin:-1},mx:{fin:"The interest-rate swap keeps costing money every year."}},{l:"C · Restructure with the bank",e:"Compromise, extra conditions.",coins:-2,fx:{fin:1,comp:-1},mx:{fin:"Restructuring eases the pressure on cash flow.",comp:"The bank's new conditions limit future flexibility."}}],sp:"Pain now versus pushing the bill forward. Buying out hurts all at once, but letting it run drags on cash flow for years."},
 {id:"N7",t:"The asbestos roofs",x:"Two hundred sheds and garages have weathered asbestos-containing roofing. There's no legal duty to remediate anymore, but the risks are rising.",o:[{l:"A · Remediate nationwide, all at once",e:"Safe, a big investment.",coins:-4,fx:{comp:2,dur:1},mx:{comp:"All roofs are remediated at once, safely and demonstrably.",dur:"Weathered asbestos disappears structurally from the portfolio."}},{l:"B · Only visibly damaged roofs",e:"Pragmatic, residual risk remains.",coins:-2,fx:{comp:0}},{l:"C · Do nothing, no legal duty",e:"Free, risk is deferred.",coins:0,fx:{comp:-2,sat:-1},mx:{comp:"Leaving a growing risk in place isn't careful management.",sat:"Residents carry a risk that isn't being addressed."}}],sp:"No legal duty versus a moral risk. Doing nothing is allowed, but the risk keeps rising, and someone will eventually have to explain it."},
 {id:"N8",t:"The sub-letter",x:"An inspection shows a tenant has been sub-letting their social home to tourists via a platform for a year, at a much higher price.",o:[{l:"A · Terminate the lease immediately",e:"Strict and clear, a hard measure.",coins:-1,fx:{comp:2,sat:-1},mx:{comp:"Unauthorised sub-letting is tackled firmly and clearly.",sat:"Termination is a harsh measure that leaves little room for explanation."}},{l:"B · Warn them, give a chance to fix it",e:"Lenient, sets a precedent.",coins:0,fx:{comp:-1,sat:1},mx:{comp:"A violation carries no immediate consequence.",sat:"The tenant gets a chance to put it right."}},{l:"C · Impose a fine, let the lease continue",e:"Quick cash, a weak signal.",coins:1,fx:{comp:-1},mx:{comp:"A fine is a weak signal against profitable sub-letting."}}],sp:"A strict signal versus leniency. Terminating deters others, but a fine collects money right away without putting the tenant on the street."},
 {id:"N9",t:"The grieving family",x:"A tenant passes away; the live-in, just-adult son has lived there his whole life but has no income of his own. The family wants him to stay.",o:[{l:"A · Transfer the lease to the son",e:"Humane, departs from policy.",coins:-1,fx:{sat:2,comp:-1},mx:{sat:"The son can stay in the only home he's ever known.",comp:"Transferring the lease without his own income departs from allocation policy."}},{l:"B · A temporary 6-month transition",e:"A compromise, some breathing room.",coins:-1,fx:{sat:1},mx:{sat:"The family gets breathing room in a difficult time."}},{l:"C · End the lease per the rules",e:"Consistent, hard on the son.",coins:0,fx:{sat:-2,comp:1},mx:{sat:"The son loses his home right after the bereavement, too.",comp:"Allocation policy is applied consistently."}}],sp:"Humanity amid grief versus consistent policy. Letting this son, who has lived there his whole life, stay feels only natural, but the policy exists for a reason."},
 {id:"N10",t:"The overgrown green roof",x:"Twenty complexes got green roofs for biodiversity five years ago, but without a maintenance contract they're now overgrown, and some leak.",o:[{l:"A · Sign a full maintenance contract",e:"Structural, costs annually.",coins:-3,fx:{dur:1,fin:-1},mx:{dur:"The green roofs keep contributing structurally to biodiversity.",fin:"A yearly maintenance contract costs money on an ongoing basis."}},{l:"B · Only fix the leaking roofs",e:"Treats the symptom.",coins:-1,fx:{dur:-1},mx:{dur:"The overgrowth and underlying problem remain."}},{l:"C · Remove the green roofs",e:"Simple, but a step backward.",coins:-2,fx:{dur:-2,fin:1},mx:{dur:"The five-year-old investment in biodiversity is lost.",fin:"No more maintenance costs for the green roofs."}}],sp:"Honouring the sustainability goal versus unforeseen structural costs. The green roofs were a nice idea, but nobody budgeted for the upkeep."},
 {id:"N11",t:"The chatbot with bad advice",x:"Your new customer-service chatbot has been misinforming tenants about payment plans for weeks, leading to unjust reminder notices.",o:[{l:"A · Turn it off, fix everything by hand",e:"Thorough, labour-intensive.",coins:-2,fx:{sat:1,comp:1},mx:{sat:"Every affected tenant gets the issue personally corrected.",comp:"Unjust reminder notices are fully and demonstrably fixed."}},{l:"B · Adjust it, only fix active complaints",e:"Faster, less complete.",coins:-1,fx:{sat:-1},mx:{sat:"Tenants who don't complain are left with an incorrect file."}},{l:"C · Quietly fix it, no publicity",e:"Risky if it comes out.",coins:0,fx:{comp:-2,sat:-1},mx:{comp:"Not disclosing a known error to affected tenants isn't transparent.",sat:"If it comes out, it feels like a cover-up to tenants."}}],sp:"Thorough repair versus quietly limiting the damage. Turning it off and fixing everything by hand is fair to tenants, but costs a lot of capacity."},
 {id:"N12",t:"The empty ground floor",x:"Twenty commercial units in a large complex's ground floor have been empty for two years. An investor offers a low but guaranteed rent for twenty years.",o:[{l:"A · Sign now, low but certain rent",e:"Certainty, low return.",coins:3,fx:{fin:-1},mx:{fin:"The low rent yields less over time than a better tenant would."}},{l:"B · Wait for a better tenant",e:"Chance of better, longer vacancy loss.",coins:-2,fx:{fin:1},mx:{fin:"A better tenant could yield more rent over time."}},{l:"C · Convert to social facilities",e:"Social gain, no rent.",coins:-3,fx:{sat:2,fin:-1},mx:{sat:"Residents get a facility they actually benefit from.",fin:"Social facilities generate no rent income."}}],sp:"Financial return versus social value. A low rent is guaranteed money, but a social facility delivers something you can't put a euro sign on."},
 {id:"N13",t:"The kitchen fire",x:"A kitchen fire from a faulty dryer causes major damage to a stairwell of eight homes. Insurance doesn't cover everything; residents are in hotels for now.",o:[{l:"A · Advance the full cost, claim it back later",e:"Spares residents, uncertain recovery.",coins:-3,fx:{sat:2},mx:{sat:"Residents don't have to wait for insurance to be home again."}},{l:"B · Wait for the insurance payout",e:"Financially safe, a long hotel stay.",coins:-1,fx:{sat:-2},mx:{sat:"Residents are stuck in a hotel unnecessarily long."}},{l:"C · Accelerated emergency repair, short stay",e:"Fast, costs more overall.",coins:-2,fx:{sat:1,fin:-1},mx:{sat:"Residents are home sooner than via the insurance route.",fin:"Accelerated repair costs more than the regular approach."}}],sp:"Getting residents home fast versus financial uncertainty. Advancing the cost helps now, but nobody's sure yet what the insurer will ultimately cover."},
 {id:"N14",t:"The discrimination complaint",x:"A local newspaper's mystery-shopper investigation suggests applicants with a non-Dutch surname are rejected more often. The study isn't airtight, but the suggestion is out there.",o:[{l:"A · External follow-up study + training",e:"Thorough, costs time and money.",coins:-2,fx:{comp:2},mx:{comp:"Independent research and training demonstrably show the will to rule it out."}},{l:"B · Your own internal check only",e:"Faster, less credible.",coins:0,fx:{comp:0}},{l:"C · Publicly dispute the methodology",e:"Defensive, risky.",coins:0,fx:{comp:-2,sat:-1},mx:{comp:"Disputing the study without your own research isn't convincing.",sat:"Reacting defensively to a serious suggestion feels inappropriate to tenants."}}],sp:"Credible self-investigation versus defending yourself. The study isn't airtight, but a public rebuttal can look defensive, even if you're right."},
 {id:"N15",t:"The hoarder",x:"A necessary inspection shows a tenant has completely packed the home with belongings. Fire risk is real, but the tenant clearly needs help, not punishment.",o:[{l:"A · Care plan + phased clean-up",e:"Careful, a slow process.",coins:-2,fx:{sat:1,comp:1},mx:{sat:"The tenant gets help instead of just a sanction.",comp:"The fire risk still gets addressed step by step."}},{l:"B · Evict due to fire risk",e:"Fast and safe, a hard measure.",coins:-1,fx:{comp:1,sat:-2},mx:{comp:"The immediate fire risk is removed right away.",sat:"Eviction feels like a punishment for someone who actually needs help."}},{l:"C · Warn them, let them clean up themselves",e:"Cheap, risk remains.",coins:0,fx:{comp:-1},mx:{comp:"A real fire risk isn't actively removed."}}],sp:"Safety now versus care and time. Fire risk calls for quick action, but this tenant clearly needs help, not punishment."},
 {id:"N16",t:"The wind farm next door",x:"An energy cooperative asks if you'll invest in a wind farm near one of your neighbourhoods. Residents are split: lower energy bills versus a spoiled view.",o:[{l:"A · Invest fully",e:"Big impact, high risk.",coins:-4,fx:{dur:2},mx:{dur:"Large-scale investment delivers a substantial share of clean energy."}},{l:"B · Join only as an off-taker",e:"Smaller upside, safer.",coins:-1,fx:{dur:1},mx:{dur:"Buying wind energy contributes only modestly to sustainability."}},{l:"C · Don't participate",e:"Residents pleased, a missed chance.",coins:0,fx:{dur:-1,sat:1},mx:{dur:"A chance to contribute to clean energy passes by.",sat:"Residents who opposed the wind farm are satisfied."}}],sp:"Sustainability ambition versus resident support. Lower energy bills sound good, but not everyone wants a changed view in return."},
 {id:"N17",t:"The forgotten system",x:"An outdated, long-'temporary' external customer-service system turns out to have been unsecured and reachable from the internet for months. Nobody knows how much data was seen.",o:[{l:"A · Take it offline immediately, full investigation",e:"Thorough, disrupts service.",coins:-3,fx:{comp:2},mx:{comp:"An unsecured system, open for months, is thoroughly and demonstrably shut down."}},{l:"B · Patch it quickly, no further investigation",e:"Practical, uncertainty remains.",coins:-1,fx:{comp:-1},mx:{comp:"Without investigation, it stays unclear how much data was seen."}},{l:"C · Keep it running until the replacement is ready",e:"Complacent, big risk.",coins:0,fx:{comp:-3,sat:-1},mx:{comp:"Letting a known security gap persist is a serious failure.",sat:"Tenant data stays needlessly exposed for longer."}}],sp:"Thoroughness versus keeping the service running. The system has been exposed for months; taking it offline is safe, but disrupts customer service immediately."},
 {id:"N18",t:"The ground-lease clause",x:"For a hundred homes, the ground-lease fee is being sharply revised this year, retroactive five years. The municipality won't share the cost.",o:[{l:"A · File an objection and litigate",e:"Could pay off, costs time and certainty.",coins:-2,fx:{comp:1},mx:{comp:"A legal objection carefully tests whether the revision is even valid."}},{l:"B · Pay and pass it on in the rent",e:"Quickly resolved, tenants angry.",coins:1,fx:{sat:-2},mx:{sat:"Tenants directly bear a fee increase they didn't cause."}},{l:"C · Pay from your own reserves",e:"Spares tenants, a big hit.",coins:-4,fx:{sat:1},mx:{sat:"Tenants notice nothing of the higher ground-lease fee."}}],sp:"Winning the legal argument versus placing the bill. Litigating costs time and certainty; meanwhile someone still has to actually pay the fee."},
 {id:"N19",t:"The unreachable elevator",x:"The only lift in a twelve-storey senior complex is broken and parts take six weeks to arrive. Residents above the fourth floor are practically stuck.",o:[{l:"A · Emergency import of parts",e:"Fixed fast, expensive.",coins:-4,fx:{sat:2},mx:{sat:"Residents above the fourth floor are mobile again quickly."}},{l:"B · Arrange a temporary help service",e:"A reasonable bridge.",coins:-2,fx:{sat:1},mx:{sat:"Residents get a reasonable bridge until the lift works again."}},{l:"C · Wait for the regular delivery",e:"Cheap, hard on residents.",coins:0,fx:{sat:-3},mx:{sat:"Residents above the fourth floor are stuck for weeks."}}],sp:"Fast and expensive versus cheap and hard on residents. Seniors on the upper floors are literally stuck as long as the lift is down."},
 {id:"N20",t:"Income loss after divorce",x:"A tenant has just divorced and can no longer afford the family home on their own income, but wants to stay for the children's sake.",o:[{l:"A · Grant a temporary rent reduction",e:"Support now, sets a precedent.",coins:-2,fx:{sat:2},mx:{sat:"The family can stay in the home they know."}},{l:"B · Actively broker a move to a smaller home",e:"A structural fix, needs guidance.",coins:-1,fx:{comp:1},mx:{comp:"The home becomes a fit again for the new income level."}},{l:"C · Apply the regular rules",e:"Consistent, hard on the family.",coins:0,fx:{sat:-2,comp:1},mx:{sat:"The family has to move on top of an already hard time.",comp:"The rules are applied equally for everyone."}}],sp:"Support in a hard time versus setting a precedent. A discount helps this family now, but raises the question: who else gets one next?"},
 {id:"N21",t:"The whistleblower",x:"An employee reports internally that a manager is systematically mislabelling maintenance budget to hit targets. Investigating may damage team trust; ignoring it may escalate further.",o:[{l:"A · Start an independent investigation",e:"Clean, tension in the team.",coins:-2,fx:{comp:2,sat:-1},mx:{comp:"An independent investigation demonstrably shows what actually happened.",sat:"Investigating a manager creates tension within the team."}},{l:"B · An informal internal conversation",e:"Fast, less thorough.",coins:-1,fx:{comp:0}},{l:"C · Wave off the report",e:"Calm now, risk later.",coins:0,fx:{comp:-2},mx:{comp:"A concrete fraud report is ignored."}}],sp:"Integrity versus team trust. An investigation is the clean choice, but can itself put trust within the team under pressure."},
 {id:"N22",t:"The predictive algorithm",x:"The municipality asks you to share housing data for an algorithm meant to predict 'vulnerable neighbourhoods'. The goal is good, but the risk of stigmatising residents is real.",o:[{l:"A · Cooperate fully, share the data",e:"Helpful, a privacy risk.",coins:-1,fx:{comp:1,sat:-1},mx:{comp:"Cooperating with the municipality's request shows good collaboration.",sat:"Residents risk stigmatisation from their data being shared."}},{l:"B · Share only anonymised, aggregated data",e:"A balance of cooperation and privacy.",coins:-1,fx:{comp:1},mx:{comp:"Cooperating without traceable data protects residents' privacy."}},{l:"C · Don't cooperate",e:"Privacy first, municipality disappointed.",coins:0,fx:{comp:-1,sat:1},mx:{comp:"The municipality doesn't get the cooperation it asked for.",sat:"Residents run no risk of stigmatisation from their data."}}],sp:"Serving a good cause versus the risk of stigma. The municipality means well, but data on 'vulnerable neighbourhoods' can end up working against residents."}];

 {id:"S",t:"Constructieve gebreken",img:"shock-1",x:"Bij een periodieke inspectie blijken de galerijen van een jaren-60-flat constructief onveilig. Dertig woningen hebben per direct herstel nodig. Uitstel is geen optie zonder de veiligheid van bewoners op het spel te zetten.",o:[{l:"A · Direct herstellen",e:"Uit eigen middelen.",coins:-4,fx:{}},{l:"B · Geborgde lening (WSW)",e:"Kost nu 2 munten.",coins:-2,fx:{comp:1},mx:{comp:"Financiering via het WSW toont zorgvuldige, verantwoorde financiering."}},{l:"C · Gefaseerd",e:"Galerijen deels afsluiten.",coins:-2,fx:{sat:-2,comp:-2},mx:{sat:"Afgesloten galerijen zijn een langdurig ongemak voor bewoners.",comp:"Gefaseerd herstel bij een veiligheidsrisico is geen voortvarende aanpak."}}]},
 {id:"S2",t:"Wateroverlast in het trappenhuis",img:"shock-waterlekkage-trappenhuis",x:"Midden in de nacht barst een hoofdleiding in de kelder van een complex met veertig woningen. Het trappenhuis staat blank en het water blijft stijgen. Bewoners kunnen niet via de voordeur naar buiten.",o:[{l:"A · Noodploeg direct oproepen",e:"Snel gestopt, dure nachttarieven.",coins:-4,fx:{sat:1},mx:{sat:"Het probleem wordt dezelfde nacht nog opgelost."}},{l:"B · Hoofdkraan dicht, wachten tot ochtend",e:"Goedkoper, water blijft een nacht staan.",coins:-1,fx:{sat:-2},mx:{sat:"Bewoners zitten een hele nacht met een ondergelopen trappenhuis."}},{l:"C · Bewoners vragen zelf te hozen",e:"Gratis, kans op schimmel en vervolgschade.",coins:0,fx:{sat:-3,comp:-1},mx:{sat:"Bewoners worden aan hun lot overgelaten bij een acute lekkage.",comp:"Een waterschade zelf laten oplossen is geen adequaat beheer."}}]},
 {id:"S3",t:"Scheur in het balkon",img:"shock-balkon-scheur",x:"Een bewoner belt in paniek: er was 's nachts een luide knal en er loopt nu een brede scheur door de balkonvloer. Een inspecteur ter plaatse durft niet te garanderen dat het balkon het houdt.",o:[{l:"A · Balkon per direct afsluiten en meteen laten herstellen",e:"Veilig, snel ingepland herstel is duur.",coins:-3,fx:{comp:1},mx:{comp:"Een mogelijk onveilig balkon wordt direct en aantoonbaar veiliggesteld."}},{l:"B · Alleen afzetten, herstel inplannen bij de volgende ronde",e:"Voorzichtig, bewoner zit weken zonder balkon.",coins:-1,fx:{sat:-1},mx:{sat:"De bewoner zit wekenlang zonder bruikbaar balkon."}},{l:"C · Bewoner vragen zelf voorzichtig te zijn, later beoordelen",e:"Geen kosten nu, onverantwoord risico.",coins:0,fx:{comp:-2,sat:-1},mx:{comp:"Een mogelijk onveilige constructie laten hangen is een ernstig risico.",sat:"De bewoner krijgt geen zekerheid over de veiligheid van zijn eigen balkon."}}]}];

 {id:"S",t:"Structural defects",img:"shock-1",x:"A periodic inspection reveals the galleries of a 1960s block are structurally unsafe. Thirty homes need immediate repair. Delay is not an option without risking residents' safety.",o:[{l:"A · Repair now",e:"From own funds.",coins:-4,fx:{}},{l:"B · Guaranteed loan (WSW)",e:"Costs 2 coins now.",coins:-2,fx:{comp:1},mx:{comp:"Financing via the WSW shows careful, responsible funding."}},{l:"C · Phased",e:"Partly close galleries.",coins:-2,fx:{sat:-2,comp:-2},mx:{sat:"Closed-off galleries are a prolonged inconvenience for residents.",comp:"Phased repair of a safety risk isn't a decisive approach."}}]},
 {id:"S2",t:"Water damage in the stairwell",img:"shock-waterlekkage-trappenhuis",x:"In the middle of the night a main pipe bursts in the basement of a forty-home complex. The stairwell is flooded and the water keeps rising. Residents can't get out through the front door.",o:[{l:"A · Call an emergency crew immediately",e:"Stopped fast, expensive night rates.",coins:-4,fx:{sat:1},mx:{sat:"The problem is solved that same night."}},{l:"B · Shut off the main valve, wait until morning",e:"Cheaper, water sits overnight.",coins:-1,fx:{sat:-2},mx:{sat:"Residents deal with a flooded stairwell all night."}},{l:"C · Ask residents to bail it out themselves",e:"Free, risk of mould and further damage.",coins:0,fx:{sat:-3,comp:-1},mx:{sat:"Residents are left to fend for themselves during an acute leak.",comp:"Letting residents handle water damage themselves isn't adequate management."}}]},
 {id:"S3",t:"Crack in the balcony",img:"shock-balkon-scheur",x:"A resident calls in a panic: there was a loud bang overnight and now a wide crack runs across the balcony floor. An inspector on site won't guarantee the balcony will hold.",o:[{l:"A · Close it off immediately and repair right away",e:"Safe, fast-tracked repair is costly.",coins:-3,fx:{comp:1},mx:{comp:"A potentially unsafe balcony is made safe immediately and demonstrably."}},{l:"B · Just cordon it off, schedule repair next round",e:"Cautious, resident goes weeks without a balcony.",coins:-1,fx:{sat:-1},mx:{sat:"The resident goes weeks without a usable balcony."}},{l:"C · Ask the resident to be careful, assess later",e:"No cost now, an irresponsible risk.",coins:0,fx:{comp:-2,sat:-1},mx:{comp:"Leaving a potentially unsafe structure as-is is a serious risk.",sat:"The resident gets no certainty about their own balcony's safety."}}]}];

  shock:["vakje-shock","vakje-shock-blauw","vakje-shock-oranje"]

function tileCategories(){
  // 0=origineel/cream, 1=blauw, 2=oranje -- gekozen zodat geen twee opeenvolgende
  // vakjes (rond de hele ring, inclusief de sluiting tussen laatste en eerste) dezelfde
  // achtergrondkleur-categorie krijgen.
  const n=RING_LEN;
  const cats=[];
  for(let i=0;i<n;i++) cats.push(i%3);
  if(cats[n-1]===cats[0]){
    for(let c=0;c<3;c++){
      if(c!==cats[n-2] && c!==cats[0]){ cats[n-1]=c; break; }
    }
  }
  return cats;
}
const TILE_CATS=tileCategories();
function vakjeVariantFor(i,type){
  const arr=VAKJE_VARIANTS[type]||[];
  if(!arr.length) return type;
  return arr[TILE_CATS[i]%arr.length];
}

const FX={parts:[],raf:null,canvas:null,ctx:null,
  ensure(){
    if(this.canvas)return;
    this.canvas=$("fxCanvas");if(!this.canvas)return;
    this.ctx=this.canvas.getContext("2d");
    const resize=()=>{this.canvas.width=innerWidth;this.canvas.height=innerHeight;};
    resize();addEventListener("resize",resize);
  },
  burst(cx,cy,colors,n){
    if(!state||!state.fxOn)return;
    this.ensure();if(!this.ctx)return;
    n=n||70;
    for(let i=0;i<n;i++){
      const ang=Math.random()*Math.PI*2,spd=2+Math.random()*6;
      this.parts.push({x:cx,y:cy,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd-3,g:0.14+Math.random()*0.08,
        r:3+Math.random()*4,rot:Math.random()*Math.PI,vr:(Math.random()-.5)*0.3,
        color:colors[rnd(colors.length)],life:60+Math.floor(Math.random()*40)});
    }
    if(!this.raf)this.raf=requestAnimationFrame(()=>this.tick());
  },
  tick(){
    this.raf=null;
    if(!this.ctx){this.parts=[];return;}
    const c=this.ctx;
    c.clearRect(0,0,this.canvas.width,this.canvas.height);
    this.parts=this.parts.filter(p=>p.life>0);
    this.parts.forEach(p=>{
      p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life--;
      c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.globalAlpha=Math.max(0,Math.min(1,p.life/30));
      c.fillStyle=p.color;c.fillRect(-p.r,-p.r*.6,p.r*2,p.r*1.2);c.restore();
    });
    if(this.parts.length)this.raf=requestAnimationFrame(()=>this.tick());
    else{c.clearRect(0,0,this.canvas.width,this.canvas.height);}
  }
};
function celebrate(kind){
  if(!state||!state.fxOn)return;
  const cx=innerWidth/2,cy=innerHeight*0.28;
  if(kind==="leader")FX.burst(cx,cy,["#1F5AFF","#FF9000","#2FBF71"],80);
  else if(kind==="kd")FX.burst(cx,cy,["#8B5CF6","#5b3aa8","#c9b3f5"],55);
  else if(kind==="win")FX.burst(cx,cy,["#1F5AFF","#FF9000","#2FBF71","#8B5CF6","#E4572E"],140);
}

/* Handgetekend dobbelsteen-icoon (geen emoji): een simpele vector-weergave van
   een dobbelsteen met vijf ogen, gebruikt tijdens de "gooien"-animatie. */
const DICE_SVG='<svg viewBox="0 0 24 24" width="34" height="34" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="2.5" y="2.5" width="19" height="19" rx="5" stroke="currentColor" stroke-width="2"/><circle cx="8" cy="8" r="1.7" fill="currentColor"/><circle cx="16" cy="8" r="1.7" fill="currentColor"/><circle cx="12" cy="12" r="1.7" fill="currentColor"/><circle cx="8" cy="16" r="1.7" fill="currentColor"/><circle cx="16" cy="16" r="1.7" fill="currentColor"/></svg>';
/* Bouwt een rij grote, duidelijke "effect-chips" (munten + metrics) voor het
   resolved-scherm - toont expliciet wat een gekozen optie oplevert of kost,
   met naam + icoon + getal per metric. Als er per metric een specifieke reden
   (mx) is meegegeven, komt die als kleine toelichting onder de chip te staan,
   zodat direct duidelijk is WAAROM juist die metric zo verandert. */
function effectChipsHtml(lang,coins,fx,mx){
  const chips=[];
  if(coins!=null)chips.push(`<span class="effectchip coin"><span class="echead"><img src="assets/icoon-financieel.png">${coins>0?"+":""}${coins} ${T[lang].coinsLbl.toLowerCase()}</span></span>`);
  Object.keys(MET[lang]).forEach(k=>{
    if(!fx||!fx[k])return;
    const v=fx[k];
    const reason=mx&&mx[k];
    chips.push(`<span class="effectchip ${v>0?"pos":"neg"}"><span class="echead"><img src="assets/${MET_ICON[k]}.png">${MET[lang][k]} ${v>0?"+":""}${v}</span>${reason?`<span class="ereason">${esc(reason)}</span>`:""}</span>`);
  });
  return chips.length?`<div class="effectrow">${chips.join("")}</div>`:"";
}
function rnd(n){return Math.floor(Math.random()*n);}
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}
function uid(){return Math.random().toString(36).slice(2,9);}
function roomCode(){let s="";const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";for(let i=0;i<4;i++)s+=A[rnd(A.length)];return s;}
function pick(arr){return arr[rnd(arr.length)];}
function taskIds(){return state.lang==="nl"?TASK_IDS_NL.slice():TASK_IDS_EN.slice();}
function shockIds(){return state.lang==="nl"?SHOCK_IDS_NL.slice():SHOCK_IDS_EN.slice();}
function chanceIds(){return state.lang==="nl"?CHANCE_IDS_NL.slice():CHANCE_IDS_EN.slice();}
function kdIds(){return state.lang==="nl"?KD_IDS_NL.slice():KD_IDS_EN.slice();}
function contentFor(){return CONTENT[state.lang];}

function computeTurnsPerTeam(){
  const numTeams=Math.max(1,state.teams.length);
  if(state.durationMode==="custom") return clamp(state.customTurns||8,TURNS_MIN,TURNS_MAX);
  const targetMin=DURATION_PRESETS[state.durationMode]||DURATION_PRESETS.medium;
  return clamp(Math.round(targetMin/AVG_MIN_PER_TURN/numTeams),TURNS_MIN,TURNS_MAX);
}
function estimatedMinutes(turnsPerTeam){return Math.round(turnsPerTeam*Math.max(1,state.teams.length)*AVG_MIN_PER_TURN);}

/* ============ state ============ */
let state=null;
function freshTeam(i){
  return {id:i+1,name:(state&&state.lang==="en"?"Team ":"Team ")+(i+1),color:TEAM_COLORS[i%TEAM_COLORS.length],
    coins:10,met:{sat:0,fin:0,comp:0,dur:0},boardPos:0,turnsTaken:0,history:[],
    seenTask:[],seenChance:[],seenKD:[],seenShock:[],laps:0};
}
function freshState(){
  const s={
    lang:"nl",room:roomCode(),appStage:"intro",
    teams:[0,1].map(i=>freshTeam(i)),
    durationMode:"medium",customTurns:8,turnsPerTeam:8,turnTimerSec:0,
    activeTeamIdx:0,
    turn:{phase:"idle",dice:null,walkTo:null,cardType:null,card:null,pendingCard:null,chosenIdx:null,lapGain:0,token:null},
    usedSectorIds:[],lastSectorBanner:null,
    lastLeaderId:null,leadChangeBanner:null,
    soundOn:true,fxOn:true,
    players:{},
    createdAt:Date.now()
  };
  return s;
}
function saveLocal(){try{localStorage.setItem("btfd_v2_state",JSON.stringify(state));}catch(e){}}
function loadLocal(){try{const r=localStorage.getItem("btfd_v2_state");if(r)return JSON.parse(r);}catch(e){}return null;}

function activeTeam(){return state.teams[state.activeTeamIdx];}
function tileTypeAt(pos){return TILE_TYPES[pos%RING_LEN];}

/* ============ turn engine ============
   Each turn keeps ONE token (state.turn.token), set once at the start of the
   turn (nextTurn/startGame) and unchanged through idle->rolling->walking->
   landed->card->resolved. Player-submitted actions (roll/drawCard/choice/
   ackChance/nextTurn) must match this token AND the active team AND the
   expected phase before being applied - this keeps a stale/late action from
   a previous turn from ever firing, while letting either the active team's
   own device OR the facilitator's screen (fallback) drive every step. */
function startGame(){
  state.turnsPerTeam=computeTurnsPerTeam();
  state.teams.forEach(tm=>{tm.coins=10;tm.met={sat:0,fin:0,comp:0,dur:0};tm.boardPos=0;tm.turnsTaken=0;tm.history=[];tm.seenTask=[];tm.seenChance=[];tm.seenKD=[];tm.seenShock=[];tm.laps=0;});
  state.activeTeamIdx=0;
  _lastPawnPos={};
  state.turn={phase:"idle",dice:null,walkTo:null,cardType:null,card:null,pendingCard:null,chosenIdx:null,lapGain:0,token:uid(),guesses:{},guessResults:null};
  state.appStage="play";
  state.lastLeaderId=state.teams[0]?state.teams[0].id:null;
  state.leadChangeBanner=null;
  NET.clearAction();
  render();saveLocal();NET.publish();
}

/* Finds the team that would be affected by a "duel" chance card: the team
   currently in the lead among all OTHER teams (i.e. your biggest rival - the
   current overall leader if that's not you, or your closest competitor if it is). */
function resolveDuelTarget(drawingTeam){
  const others=state.teams.filter(t=>t.id!==drawingTeam.id);
  if(!others.length)return null;
  let target=others[0];
  others.forEach(t=>{if(t.coins>target.coins)target=t;});
  return target;
}

/* Detects when the #1 ranked team changes (by coins) and surfaces a transient
   celebratory banner - purely presentational, reinforces the competitive feel. */
function checkLeaderChange(){
  if(!state.teams.length)return;
  let leader=state.teams[0];
  state.teams.forEach(t=>{if(t.coins>leader.coins)leader=t;});
  if(state.lastLeaderId!=null&&state.lastLeaderId!==leader.id){
    state.leadChangeBanner={teamId:leader.id,teamName:leader.name,color:leader.color,at:Date.now()};
    celebrate("leader");
  }
  state.lastLeaderId=leader.id;
}

function rollDice(){
  if(state.turn.phase!=="idle")return;
  const team=activeTeam();
  const dice=1+rnd(6);
  const from=team.boardPos;
  const to=from+dice;
  state.turn.phase="rolling";
  state.turn.dice=dice;
  state.turn.walkTo=to;
  NET.clearAction();
  render();saveLocal();NET.publish();
  setTimeout(()=>{state.turn.phase="walking";stepWalk(from,to);},650);
}

function stepWalk(from,to){
  const team=activeTeam();
  if(team.boardPos>=to){
    landingAction();
    return;
  }
  const before=team.boardPos;
  team.boardPos++;
  if(Math.floor(team.boardPos/RING_LEN)>Math.floor(before/RING_LEN)){
    team.coins+=5;team.laps++;state.turn.lapGain=(state.turn.lapGain||0)+5;
  }
  render();saveLocal();NET.publish();
  setTimeout(()=>stepWalk(from,to),380);
}

/* Landing determines (and pre-selects) the card, but does NOT reveal it yet -
   the active team draws it themselves via drawCard() for the reveal moment. */
function landingAction(){
  const team=activeTeam();
  const pos=team.boardPos%RING_LEN;
  let type=tileTypeAt(pos);
  state.turn.cardType=type;
  state.turn.card=null;
  state.turn.pendingCard=null;
  state.turn.kdRival=null;
  if(type==="start"){
    state.turn.phase="resolved";
    render();saveLocal();NET.publish();
    return;
  }
  if(type==="chance")state.turn.pendingCard=drawChanceFor(team);
  else if(type==="shock")state.turn.pendingCard=drawShockFor(team);
  else if(type==="kennisduel"){
    state.turn.pendingCard=drawKDFor(team);
    const rival=resolveDuelTarget(team);
    if(rival)state.turn.kdRival={id:rival.id,name:rival.name,color:rival.color};
  }
  else state.turn.pendingCard=drawTaskFor(team);
  state.turn.phase="landed";
  render();saveLocal();NET.publish();
}

function drawCard(){
  if(state.turn.phase!=="landed")return;
  const team=activeTeam();
  const type=state.turn.cardType;
  const card=state.turn.pendingCard;
  if(!card)return;
  state.turn.card=card;
  state.turn.pendingCard=null;
  if(type==="chance"){
    applyCardEffect(team,card.fx,card.coins);
    team.history.push({turn:team.turnsTaken+1,type:"chance",id:card.id,title:card.t,coins:card.coins});
    state.turn.duelTarget=null;
    if(card.duel){
      const target=resolveDuelTarget(team);
      if(target){
        applyCardEffect(target,card.targetFx||{},card.targetCoins||0);
        target.history.push({turn:"DUEL",type:"duel-target",id:card.id,title:card.t,sourceTeam:team.name,coins:card.targetCoins||0});
        state.turn.duelTarget={id:target.id,name:target.name,color:target.color,coins:card.targetCoins||0};
      }
    }
  }
  state.turn.phase="card";
  NET.clearAction();
  render();saveLocal();NET.publish();
}

function drawTaskFor(team){
  const all=taskIds();
  let avail=all.filter(id=>!team.seenTask.includes(id));
  if(avail.length===0){team.seenTask=[];avail=all.slice();}
  const id=pick(avail);
  team.seenTask.push(id);
  return contentFor().task[id];
}
function drawShockFor(team){
  if(!team.seenShock)team.seenShock=[];
  const all=shockIds();
  let avail=all.filter(id=>!team.seenShock.includes(id));
  if(avail.length===0){team.seenShock=[];avail=all.slice();}
  const id=pick(avail);
  team.seenShock.push(id);
  return contentFor().shock[id];
}
function drawChanceFor(team){
  const all=chanceIds();
  let avail=all.filter(id=>!team.seenChance.includes(id));
  if(avail.length===0){team.seenChance=[];avail=all.slice();}
  const id=pick(avail);
  team.seenChance.push(id);
  return contentFor().chance[id];
}
function drawKDFor(team){
  if(!team.seenKD)team.seenKD=[];
  const all=kdIds();
  let avail=all.filter(id=>!team.seenKD.includes(id));
  if(avail.length===0){team.seenKD=[];avail=all.slice();}
  const id=pick(avail);
  team.seenKD.push(id);
  return contentFor().kd[id];
}
function applyCardEffect(team,fx,coins){
  team.coins=Math.max(0,team.coins+(coins||0));
  if(fx)Object.keys(fx).forEach(k=>{team.met[k]=(team.met[k]||0)+fx[k];});
  checkLeaderChange();
}

/* Wachtende teams mogen tijdens ph==="card" (bij task/shock-kaarten) gokken
   welke optie het actieve team zal kiezen - puur voor extra betrokkenheid.
   Eén gok per team per beurt; het resultaat (goed/fout + bonusmunt) wordt pas
   bepaald zodra de keuze definitief is in resolveChoice(). */
function submitGuess(teamId,optIdx){
  if(state.turn.phase!=="card"||state.turn.cardType==="chance"||state.turn.cardType==="kennisduel")return;
  if(!state.turn.card||!state.turn.card.o||!state.turn.card.o[optIdx])return;
  const active=activeTeam();
  if(String(active.id)===String(teamId))return;
  if(!state.turn.guesses)state.turn.guesses={};
  if(state.turn.guesses[teamId]!=null)return;
  state.turn.guesses[teamId]=optIdx;
  render();saveLocal();NET.publish();
}

function resolveChoice(optIdx){
  if(state.turn.phase!=="card")return;
  const team=activeTeam();
  const card=state.turn.card;
  if(!card||!card.o)return;
  const opt=card.o[optIdx];
  if(!opt)return;
  applyCardEffect(team,opt.fx,opt.coins);
  state.turn.chosenIdx=optIdx;
  state.turn.kdResult=null;
  if(opt.duelTarget&&state.turn.kdRival){
    const target=state.teams.find(t=>t.id===state.turn.kdRival.id);
    if(target){
      applyCardEffect(target,opt.targetFx||{},opt.targetCoins||0);
      target.history.push({turn:"KD",type:"kd-target",id:card.id,title:card.t,sourceTeam:team.name,coins:opt.targetCoins||0});
      state.turn.kdResult={id:target.id,name:target.name,color:target.color,coins:opt.targetCoins||0};
      celebrate("kd");
    }
  }
  team.history.push({turn:team.turnsTaken+1,type:state.turn.cardType,id:card.id,title:card.t,option:opt.l,coins:opt.coins,correct:opt.correct===true,explain:opt.e});
  state.turn.guessResults=[];
  if(state.turn.guesses){
    Object.keys(state.turn.guesses).forEach(tid=>{
      const guesser=state.teams.find(t=>String(t.id)===String(tid));
      if(!guesser||guesser.id===team.id)return;
      const correct=state.turn.guesses[tid]===optIdx;
      if(correct){
        guesser.coins+=1;
        guesser.history.push({turn:guesser.turnsTaken+1,type:"guess",id:card.id,title:card.t,coins:1,correct:true});
      }
      state.turn.guessResults.push({id:guesser.id,name:guesser.name,color:guesser.color,correct});
    });
  }
  state.turn.phase="resolved";
  NET.clearAction();
  render();saveLocal();NET.publish();
}

function ackAutoCard(){
  if(state.turn.phase!=="card")return;
  state.turn.phase="resolved";
  NET.clearAction();
  render();saveLocal();NET.publish();
}

function nextTurn(){
  if(state.turn.phase!=="resolved")return;
  const team=activeTeam();
  team.turnsTaken++;
  NET.clearAction();
  state.turn={phase:"idle",dice:null,walkTo:null,cardType:null,card:null,pendingCard:null,chosenIdx:null,lapGain:0,token:uid(),guesses:{},guessResults:null};
  const allDone=state.teams.every(t=>t.turnsTaken>=state.turnsPerTeam);
  if(allDone){
    state.appStage="scores";
    render();saveLocal();NET.publish();
    setTimeout(()=>celebrate("win"),200);
    return;
  }
  let next=(state.activeTeamIdx+1)%state.teams.length;
  let guard=0;
  while(state.teams[next].turnsTaken>=state.turnsPerTeam&&guard<state.teams.length){next=(next+1)%state.teams.length;guard++;}
  state.activeTeamIdx=next;
  render();saveLocal();NET.publish();
}

function triggerSectorEvent(){
  const avail=SECTOR_IDS.filter(id=>!state.usedSectorIds.includes(id));
  const pool=avail.length?avail:SECTOR_IDS.slice();
  if(!avail.length)state.usedSectorIds=[];
  const id=pick(pool);
  state.usedSectorIds.push(id);
  const ev=contentFor().sector[id];
  state.teams.forEach(t=>applyCardEffect(t,ev.fx,ev.coins));
  state.lastSectorBanner={t:ev.t,x:ev.x,at:Date.now()};
  render();saveLocal();NET.publish();
  setTimeout(()=>{if(state.lastSectorBanner&&state.lastSectorBanner.at===state.lastSectorBanner.at){/*keep until dismissed*/}},1);
}
/* ============ board layout ============ */
function ringLayout(){
  const out=[];
  for(let c=1;c<=8;c++) out.push({row:1,col:c});
  for(let r=2;r<=8;r++) out.push({row:r,col:8});
  for(let c=7;c>=1;c--) out.push({row:8,col:c});
  for(let r=7;r>=2;r--) out.push({row:r,col:1});
  return out;
}
const RING_LAYOUT=ringLayout();

/* ============ render ============ */
function render(){
  if(!state)return;
  document.documentElement.lang=state.lang;
  $("brand").textContent=T[state.lang].brand;
  $("roomLbl").textContent=T[state.lang].room;
  $("roomCode").textContent=state.room;
  $("copyJoin").textContent=T[state.lang].joinLink;
  $("resetGame").textContent=T[state.lang].newGame;
  $("helpToggle").textContent=T[state.lang].help;
  $("sectorBtn").textContent=T[state.lang].sector;
  $("sectorBtn").title=T[state.lang].sectorBtnTip;
  $("footNL").textContent=T[state.lang].footNL;
  $("langToggle").textContent=state.lang==="nl"?"EN":"NL";
  $("netStatus").className="netchip "+(NET.connected?"live":"off");
  $("netStatus").textContent=NET.connected?T[state.lang].netLive:T[state.lang].netOff;

  $("view-intro").classList.toggle("hide",state.appStage!=="intro");
  $("view-setup").classList.toggle("hide",state.appStage!=="setup");
  $("view-play").classList.toggle("hide",state.appStage!=="play");
  $("view-scores").classList.toggle("hide",state.appStage!=="scores");

  if(state.appStage==="intro")renderIntro();
  if(state.appStage==="setup")renderSetup();
  if(state.appStage==="play"){renderBoardPath();renderPawns();renderStage();renderCompactStand();renderRoundBar();}
  if(state.appStage==="scores")renderScores();

  if(state.lastSectorBanner){
    $("sectorBanner").classList.remove("hide");
    const sImg=sectorImgFor(state.lastSectorBanner.t);
    $("sectorBanner").innerHTML=`<div class="sectorimg" style="background-image:url('assets/${sImg}.jpg')"></div>`+T[state.lang].sectorBanner(esc(state.lastSectorBanner.t),esc(state.lastSectorBanner.x))+
      '<div style="margin-top:8px;clear:both"><button class="btn ghost sm" id="dismissSector">OK</button></div>';
    const db=$("dismissSector");if(db)db.onclick=()=>{state.lastSectorBanner=null;render();saveLocal();NET.publish();};
  }else{
    $("sectorBanner").classList.add("hide");
  }

  if(state.leadChangeBanner){
    $("leadBanner").classList.remove("hide");
    $("leadBanner").style.background=state.leadChangeBanner.color?`linear-gradient(135deg, ${state.leadChangeBanner.color}22, #fff6ec)`:"#fff6ec";
    $("leadBanner").innerHTML=`<b>${T[state.lang].newLeader(esc(state.leadChangeBanner.teamName))}</b>`+
      `<div style="margin-top:6px"><button class="btn ghost sm" id="dismissLead">${T[state.lang].dismiss}</button></div>`;
    const dl=$("dismissLead");if(dl)dl.onclick=()=>{state.leadChangeBanner=null;render();saveLocal();NET.publish();};
  }else{
    $("leadBanner").classList.add("hide");
  }
}

function renderRoundBar(){
  const total=state.teams.length*state.turnsPerTeam;
  const done=state.teams.reduce((a,t)=>a+t.turnsTaken,0);
  $("roundHint").textContent=T[state.lang].roundHint(done,total);
  const pct=total?Math.round(100*done/total):0;
  $("roundBar").innerHTML=`<div style="height:8px;background:var(--soft);border-radius:6px;overflow:hidden"><div style="height:100%;width:${pct}%;background:var(--blue);transition:width .4s"></div></div>`;
}

function renderBoardPath(){
  const wrap=$("boardPath");
  let html="";
  for(let i=0;i<RING_LEN;i++){
    const pos=RING_LAYOUT[i];
    const type=TILE_TYPES[i];
    const here=state.teams.some(t=>t.boardPos%RING_LEN===i);
    const vimg=vakjeVariantFor(i,type);
    html+=`<div class="tile ${type}${here?" here":""}" style="grid-row:${pos.row};grid-column:${pos.col};background-image:url('assets/${vimg}.jpg')" data-idx="${i}"></div>`;
  }
  wrap.innerHTML=html;
}

let _lastPawnPos={};
function measureTilePitch(){
  const t0=document.querySelector('[data-idx="0"]'),t1=document.querySelector('[data-idx="1"]'),
        t7=document.querySelector('[data-idx="7"]'),t8=document.querySelector('[data-idx="8"]');
  let colStep=98,rowStep=98;
  if(t0&&t1){const r0=t0.getBoundingClientRect(),r1=t1.getBoundingClientRect();if(r1.left>r0.left)colStep=r1.left-r0.left;}
  if(t7&&t8){const r7=t7.getBoundingClientRect(),r8=t8.getBoundingClientRect();if(r8.top>r7.top)rowStep=r8.top-r7.top;}
  return {colStep,rowStep};
}
function renderPawns(){
  const layer=$("pawnLayer");
  const grouped={};
  state.teams.forEach(team=>{
    const i=team.boardPos%RING_LEN;
    (grouped[i]=grouped[i]||[]).push(team);
  });
  const pitch=measureTilePitch();
  let html="";
  Object.keys(grouped).forEach(idxStr=>{
    const idx=parseInt(idxStr,10);
    const pos=RING_LAYOUT[idx];
    const teamsHere=grouped[idx];
    // Meerdere pionnen op hetzelfde vakje blijven op volle grootte en overlappen
    // elkaar gewoon (ipv te verkleinen), zodat ze binnen het vakje blijven.
    const pawnsHtml=teamsHere.map((team,pIdx)=>{
      const prevRaw=_lastPawnPos[team.id];
      const moved=prevRaw!==undefined&&prevRaw!==team.boardPos;
      let styleVars=pIdx>0?"margin-left:-26px;":"";
      if(moved){
        const prevIdx=((prevRaw%RING_LEN)+RING_LEN)%RING_LEN;
        const prevPos=RING_LAYOUT[prevIdx];
        const dx=(prevPos.col-pos.col)*pitch.colStep,dy=(prevPos.row-pos.row)*pitch.rowStep;
        styleVars+=`--fx:${dx}px;--fy:${dy}px;`;
      }
      return `<div class="pw2${moved?" hop":""}" style="background-image:url('assets/${pawnImgFor(team.color)}.png');${styleVars}" title="${esc(team.name)}"></div>`;
    }).join("");
    html+=`<div class="pawncell" style="grid-row:${pos.row};grid-column:${pos.col}">${pawnsHtml}</div>`;
  });
  layer.innerHTML=html;
  state.teams.forEach(team=>{_lastPawnPos[team.id]=team.boardPos;});
}

function renderStage(){
  const el=$("stage");
  const L=T[state.lang];
  const team=activeTeam();
  const ph=state.turn.phase;
  if(state.appStage!=="play"){el.innerHTML="";return;}
  let html="";
  if(ph==="idle"){
    html=`<div class="yourturn" style="background:${team.color}">${esc(L.yourTurnBanner(team.name))}</div>
      <div style="text-align:center"><p class="hint">${esc(L.waitRoll(team.name))}</p>
      <p class="hint" style="margin-bottom:4px">${L.rollFallback}</p>
      <button class="btn soft" id="rollBtn">${L.rollBtn}</button></div>`;
  }else if(ph==="rolling"){
    html=`<div style="text-align:center"><div class="dice rolling">${DICE_SVG}</div><div class="hint">${esc(team.name)}…</div></div>`;
  }else if(ph==="walking"){
    html=`<div style="text-align:center"><div class="dice">${state.turn.dice}</div><div class="hint">${L.walking}</div></div>`;
  }else if(ph==="landed"){
    html=`<div style="text-align:center">${spBadgeHtml(state.turn.cardType,L)}
      <p class="hint">${esc(L.waitDrawCard(team.name))}</p>

/* Optionele, zachte beurttimer - puur visueel, dwingt niets af. Draait alleen
   op het host/gedeelde scherm zolang ph==="card" bij een keuzekaart (task/
   shock/kennisduel) en state.turnTimerSec>0. Herstart alleen bij een echt
   nieuwe beurt/kaart (gekoppeld aan state.turn.token), niet bij elke re-render. */
let _ttToken=null,_ttInterval=null,_ttRemain=0;
function stopTurnTimer(){
  if(_ttInterval){clearInterval(_ttInterval);_ttInterval=null;}
  _ttToken=null;
}
function manageTurnTimer(){
  const box=$("turnTimerBox");
  if(!box){stopTurnTimer();return;}
  const tok=state.turn.token;
  if(_ttToken===tok&&_ttInterval)return; // al aan het lopen voor deze beurt
  stopTurnTimer();
  _ttToken=tok;
  _ttRemain=state.turnTimerSec||0;
  const L=T[state.lang];
  const paint=()=>{
    const b=$("turnTimerBox");
    if(!b)return;
    const txt=$("turnTimerTxt");
    if(_ttRemain<=0){
      b.classList.add("low");
      if(txt)txt.textContent=L.timesUp;
    }else{
      b.classList.toggle("low",_ttRemain<=10);
      if(txt)txt.textContent=`${_ttRemain}s`;
    }
  };
  paint();
  _ttInterval=setInterval(()=>{
    _ttRemain--;
    if(state.turn.token!==tok||state.turn.phase!=="card"){stopTurnTimer();return;}
    if(_ttRemain<0){clearInterval(_ttInterval);_ttInterval=null;paint();return;}
    paint();
  },1000);
}

/* ============ NET (Firebase sync) ============ */
const NET={
  connected:false,db:null,ref:null,actionRef:null,_actionCb:null,_pubTimer:null,
  init(){
    try{
      if(!window.firebase||!window.FIREBASE_CONFIG){this.connected=false;return;}
      if(!firebase.apps||!firebase.apps.length)firebase.initializeApp(window.FIREBASE_CONFIG);
      this.db=firebase.database();
      this.connected=true;
      this.bindRoom();
    }catch(e){this.connected=false;}
  },
  bindRoom(){
    if(!this.db||!state)return;
    this.ref=this.db.ref("rooms/"+state.room+"/state");
  },
  bindActions(){
    if(!this.db||!state)return;
    if(this.actionRef)this.actionRef.off();
    this.actionRef=this.db.ref("rooms/"+state.room+"/action");
    if(this._actionCb)this.actionRef.on("value",this._actionCb);
  },
  onAction(cb){
    this._actionCb=snap=>{const v=snap.val();if(v)cb(v);};
    this.bindActions();
  },
  clearAction(){
    if(this.actionRef)this.actionRef.remove().catch(()=>{});
  },
  publish(){
    if(!this.db)return;
    clearTimeout(this._pubTimer);
    this._pubTimer=setTimeout(()=>{
      if(!this.ref)this.bindRoom();
      if(this.ref)this.ref.set(state).catch(()=>{});
    },120);
  },
  listenState(room,cb){
    if(!this.db||!room)return;
    const r=this.db.ref("rooms/"+room+"/state");
    r.on("value",snap=>{const v=snap.val();if(v)cb(v);});
  },
  fetchTeamsOnce(room){
    if(!this.db||!room)return Promise.resolve(null);
    return this.db.ref("rooms/"+room+"/state").once("value").then(snap=>snap.val()).catch(()=>null);
  },
  joinAsPlayer(room,name,team){
    if(!this.db)return Promise.resolve();
    const id=uid();
    return this.db.ref("rooms/"+room+"/joins/"+id).set({name,team,at:Date.now()}).then(()=>id).catch(()=>id);
  },
  submitAction(room,payload){
    if(!this.db||!room)return Promise.resolve();
    return this.db.ref("rooms/"+room+"/action").set(Object.assign({at:Date.now()},payload)).catch(()=>{});
  }
};

/* Applies a player-submitted turn action (roll / drawCard / choice / ackChance /
   nextTurn) received via Firebase to the live game. Every action must match the
   CURRENT turn's token and the active team, and land in the exact phase it
   belongs to - this lets the active team's own device drive the turn (rolling,
   drawing, choosing, advancing) while the facilitator's screen still works as
   a fallback for any of these steps. Anything that doesn't match is discarded. */
function handleIncomingAction(action){
  if(!state||!action||state.appStage!=="play")return;
  const team=activeTeam();
  const sameToken=state.turn.token&&state.turn.token===action.token;
  if(action.type==="guess"){
    if(sameToken&&action.team!=null&&String(team.id)!==String(action.team))submitGuess(action.team,action.optIdx);
    NET.clearAction();
    return;
  }
  const sameTeam=String(team.id)===String(action.team);
  if(!sameTeam||!sameToken){NET.clearAction();return;}
  if(action.type==="roll"&&state.turn.phase==="idle"){
    rollDice();
  }else if(action.type==="drawCard"&&state.turn.phase==="landed"){
    drawCard();
  }else if(action.type==="choice"&&state.turn.phase==="card"&&state.turn.cardType!=="chance"&&
      state.turn.card&&state.turn.card.o&&action.optIdx!=null&&state.turn.card.o[action.optIdx]){
    resolveChoice(action.optIdx);
  }else if(action.type==="ackChance"&&state.turn.phase==="card"&&state.turn.cardType==="chance"){
    ackAutoCard();
  }else if(action.type==="nextTurn"&&state.turn.phase==="resolved"){
    nextTurn();
  }else{
    NET.clearAction();
  }
}

  $("joinTips").innerHTML=`<li>${T.nl.jfSub}</li>`;
  let joinedRoom=null,playerLang="nl",knownTeams=null,lastSubmittedKey=null;
  function markSent(turn,actionType){lastSubmittedKey=turn.token+":"+actionType;}
  function wasSent(turn,actionType){return lastSubmittedKey===turn.token+":"+actionType;}
  NET.init();

  function populateTeamOptions(teams){
    const sel=$("pTeam");
    const prevVal=sel.value;
    const list=(teams&&teams.length)?teams:[{id:1,name:"Team 1"},{id:2,name:"Team 2"}];
    sel.innerHTML=list.map(t=>`<option value="${esc(t.id)}">${esc(t.name)}</option>`).join("");

  function refreshTeamsForRoom(){
    const room=($("pRoom").value||"").trim().toUpperCase();

    NET.fetchTeamsOnce(room).then(snap=>{
      if(snap&&snap.teams&&snap.teams.length){knownTeams=snap.teams;populateTeamOptions(snap.teams);}
    });
  }
  $("pRoom").addEventListener("blur",refreshTeamsForRoom);
  $("pRoom").addEventListener("change",refreshTeamsForRoom);
  if(roomFromUrl){
    // give the Firebase SDK a moment to finish initializing before the first lookup
    setTimeout(refreshTeamsForRoom,300);
  }

  $("joinBtn").onclick=()=>{
    const room=($("pRoom").value||"").trim().toUpperCase();
    const name=($("pName").value||"").trim();
    const team=$("pTeam").value;
    if(!room||!name)return;
    joinedRoom=room;
    NET.joinAsPlayer(room,name,team);
    $("joinForm").style.display="none";
    $("joinWaiting").style.display="block";
    $("joinCard").classList.add("wide");
    const teamName=(knownTeams&&knownTeams.find(t=>String(t.id)===String(team))||{}).name||("Team "+team);
    $("joinWho").textContent=name+" · "+teamName;
    $("joinRoomEcho").textContent=room;
    $("jwH").textContent=T.nl.jwH;$("jwWait").textContent=T.nl.jwWait;$("jwRoomL").textContent=T.nl.jwRoomL;
    subscribeAsPlayer(room,team);
  };
  function subscribeAsPlayer(room,team){
    if(!NET.db){$("jwBanner").textContent=T.nl.netOff;$("jwBanner").classList.remove("hide");return;}
    $("pNet").textContent=T.nl.netLive;$("pNet").className="pnet live";
    NET.listenState(room,snap=>{
      playerLang=snap.lang||"nl";
      renderPlayerDashboard(snap,team);
    });
  }
  function renderPlayerDashboard(snap,team){
    $("joinCard").classList.toggle("playmode",snap.appStage==="play");
    const L=T[playerLang]||T.nl;
    const me=snap.teams.find(t=>String(t.id)===String(team));
    const active=snap.teams[snap.activeTeamIdx];
    const mine=active&&String(active.id)===String(team);
    const turn=snap.turn||{phase:"idle"};
    let head=`<h1 style="font-size:20px">${esc(L.brand)}</h1>`;
    if(me)head+=`<p class="s">${esc(me.name)} · ${me.coins} ${L.coinsLbl.toLowerCase()} · ${me.turnsTaken}/${snap.turnsPerTeam}</p>`;
    if(snap.appStage==="setup"||snap.appStage==="intro"){
      head+=`<p class="s">${esc(L.jwWait)}</p>`;
    }

    let main="";
    if(snap.appStage==="intro"){
      main+=`<div style="text-align:start"><h2 style="margin-top:0">${esc(L.introTitle)}</h2><p class="hint">${esc(L.introAbout)}</p><h3 style="margin-bottom:8px">${esc(L.introRulesTitle)}</h3><ol>${L.introRules.map(r=>`<li>${r}</li>`).join("")}</ol><h3 style="margin-bottom:8px">${esc(L.introWinTitle)}</h3><p class="hint">${esc(L.introWin)}</p></div>`;
    }
    if(snap.appStage==="play"&&active){
      main+=`<div class="yourturn" style="background:${active.color};font-size:16px">${esc(L.yourTurnBanner(active.name))}</div>`;
      if(turn.phase==="idle"){
        if(mine){
          const sent=wasSent(turn,"roll");
          main+=`<div style="text-align:center"><button class="btn warn big" id="playerRollBtn" ${sent?"disabled":""}>${sent?L.choiceSent:L.rollBtn}</button></div>`;
        }
      }else if(turn.phase==="rolling"){
        main+=`<div style="text-align:center"><div class="dice rolling">${DICE_SVG}</div></div>`;
      }else if(turn.phase==="walking"){
        main+=`<div style="text-align:center"><div class="dice">${turn.dice||DICE_SVG}</div><p class="hint">${L.walking}</p></div>`;
      }else if(turn.phase==="landed"){
        if(mine){
          const sent=wasSent(turn,"drawCard");
          main+=`<div style="text-align:center">${spBadgeHtml(turn.cardType,L)}<br><br><button class="btn warn big" id="playerDrawBtn" ${sent?"disabled":""}>${sent?L.choiceSent:L.drawCardBtn}</button></div>`;
        }else{
          main+=`<div style="text-align:center">${spBadgeHtml(turn.cardType,L)}<p class="hint" style="margin-top:10px">${L.waitForYourTeam}</p></div>`;
        }
      }else if(turn.phase==="card"&&turn.card){
        const isKD=turn.cardType==="kennisduel";
        const isChance=turn.cardType==="chance";
        const cat=CAT[turn.card.id];
        let pcardImg="";
        if(isKD)pcardImg=`<div class="illo kdimg" style="background-image:url('assets/${imgFor(turn.card.id,"kennisduel")}.jpg')"></div>`;
        else if(isChance)pcardImg=`<div class="illo" style="background-image:url('assets/${imgFor(turn.card.id,turn.card.good===false?"kans-slecht":"kans-goed")}.jpg')"></div>`;
        else if(turn.card.img)pcardImg=`<div class="illo" style="background-image:url('assets/${turn.card.img}.jpg')"></div>`;
        else if(cat)pcardImg=`<div class="illo" style="background-image:url('assets/${imgFor(turn.card.id,cat)}.jpg')"></div>`;
        main+=`<div class="cardface${isKD?" kd":""}" style="margin-top:10px">${pcardImg}<div class="badge${isKD?" kdbadge":""}">${isKD?L.drawKennisduel:(turn.cardType==="shock"?L.drawShock:(isChance?L.drawChance:L.drawTask))}</div>${turn.card.duel?`<div class="badge" style="background:#EAF0FF;color:#1F5AFF;margin-inline-start:6px">${L.duelBadge}</div>`:""}<h3>${esc(turn.card.t)}</h3><p>${esc(turn.card.x)}</p>${isKD&&turn.kdRival?`<p class="hint" style="color:#5b3aa8">${L.kdVersus(esc(turn.kdRival.name))}</p>`:""}`;
        if(turn.cardType==="chance"){
          main+=`<p class="hint">${turn.card.coins>0?"+":""}${turn.card.coins} ${L.coinsLbl.toLowerCase()}</p>`;
          if(turn.duelTarget){
            main+=`<p class="hint" style="color:#a4321f">${L.duelAffects(esc(turn.duelTarget.name))} (${turn.duelTarget.coins>0?"+":""}${turn.duelTarget.coins} ${L.coinsLbl.toLowerCase()})</p>`;
          }
          if(mine){
            const sent=wasSent(turn,"ackChance");
            main+=`<button class="btn warn" id="playerAckBtn" ${sent?"disabled":""}>${sent?L.choiceSent:L.confirmChoice}</button>`;
          }
        }else if(turn.card.o){
          if(mine){
            const sent=wasSent(turn,"choice");
            main+=`<p class="hint" style="margin-bottom:6px">${sent?L.choiceSent:L.chooseOpt}</p><div class="opts">`+
              turn.card.o.map((o,idx)=>`<button class="btn soft optbtn playerOpt${isKD?" kdopt":""}" data-idx="${idx}"${sent?" disabled":""}>${esc(o.l)}${isKD?"":`<br><span class="hint">${esc(o.e)}</span>`}</button>`).join("")+
              `</div>`;
          }else if(!isKD&&!isChance&&me){
            const already=(turn.guesses&&turn.guesses[me.id]!=null)||wasSent(turn,"guess");
            if(already){
              main+=`<p class="hint" style="margin-bottom:6px">${L.guessSent}</p><div class="opts">`+turn.card.o.map(o=>`<div class="btn soft optbtn" style="opacity:.7">${esc(o.l)}<br><span class="hint">${esc(o.e)}</span></div>`).join("")+`</div>`;
            }else{
              main+=`<p class="hint" style="margin-bottom:6px">${L.guessPrompt}</p><div class="opts">`+
                turn.card.o.map((o,idx)=>`<button class="btn soft optbtn guessOpt" data-idx="${idx}">${esc(o.l)}<br><span class="hint">${esc(o.e)}</span></button>`).join("")+
                `</div>`;
            }
          }else{
            main+=`<p class="hint" style="margin-bottom:6px">${L.waitForYourTeam}</p><div class="opts">`+turn.card.o.map(o=>`<div class="btn soft optbtn" style="opacity:.7">${esc(o.l)}${isKD?"":`<br><span class="hint">${esc(o.e)}</span>`}</div>`).join("")+`</div>`;
          }
        }
        main+=`</div>`;
      }else if(turn.phase==="resolved"){
        let detail="";
        if(turn.card&&turn.card.o&&turn.chosenIdx!=null){
          const o=turn.card.o[turn.chosenIdx];
          const chips=effectChipsHtml(playerLang,o.coins,o.fx,o.mx);
          if(turn.cardType==="kennisduel"){
            const correct=o.correct===true;
            detail=`<div class="cardface" style="margin-top:10px"><div class="kdverdict ${correct?'good':'bad'}">${correct?L.kdCorrect:L.kdWrong}</div>${o.e?`<div class="whybox"><b>${L.whyLbl}</b><p>${esc(o.e)}</p></div>`:""}<p class="hint" style="margin-top:8px"><b>${L.effectLbl}</b></p>${chips}</div>`;
          }else{
            detail=`<div class="cardface" style="margin-top:10px"><p class="hint"><b>${esc(o.l)}</b></p>${o.e?`<div class="whybox"><b>${L.whyLbl}</b><p>${esc(o.e)}</p></div>`:""}<p class="hint" style="margin-top:8px"><b>${L.effectLbl}</b></p>${chips}${turn.card.sp?`<div class="spbox"><b>${L.spTitle}</b><p>${esc(turn.card.sp)}</p></div>`:""}</div>`;
          }
        }else if(turn.cardType==="chance"&&turn.card){
          detail=`<div class="cardface" style="margin-top:10px"><p class="hint"><b>${esc(turn.card.t)}</b> — ${turn.card.coins>0?"+":""}${turn.card.coins} ${L.coinsLbl.toLowerCase()}</p>${turn.duelTarget?`<p class="hint" style="color:#a4321f">${L.duelAffects(esc(turn.duelTarget.name))} (${turn.duelTarget.coins>0?"+":""}${turn.duelTarget.coins} ${L.coinsLbl.toLowerCase()})</p>`:""}</div>`;
        }else if(turn.cardType==="start"||turn.lapGain){
          detail=`<p class="hint" style="text-align:center;margin-top:10px">${L.passedStart}</p>`;
        }
        main+=detail;
        if(turn.guessResults&&turn.guessResults.length){
          main+=`<div class="guessbox">`+turn.guessResults.map(g=>`<span class="guesschip ${g.correct?'good':'bad'}" style="border-color:${g.color}">${esc(g.name)} ${g.correct?L.guessHit:L.guessMiss}</span>`).join("")+`</div>`;
          if(me&&!mine){
            const myGuess=turn.guessResults.find(g=>String(g.id)===String(me.id));
            if(myGuess)main+=`<p class="hint" style="text-align:center;margin-top:6px">${myGuess.correct?L.guessCorrectMsg:L.guessWrongMsg}</p>`;
          }
        }
        if(mine){
          const sent=wasSent(turn,"nextTurn");
          main+=`<div style="text-align:center;margin-top:8px"><button class="btn soft" id="playerNextBtn" ${sent?"disabled":""}>${sent?L.choiceSent:L.continueBtn}</button></div>`;
        }
      }
    }
    if(snap.appStage==="scores"){
      const sorted=snap.teams.slice().sort((a,b)=>finalScore(b)-finalScore(a));
      main+=`<div class="podiumhero"><div class="podiumimg" style="background-image:url('assets/podium-winnaar.jpg')"></div><div class="podiumcaption">${L.winnerHeadline(esc(sorted[0].name),finalScore(sorted[0]))}</div></div>`;
      main+="<div>"+sorted.map((t,i)=>`<div class="rank${i===0?" first":""}"><span class="pos">${i+1}</span><div class="rn" style="flex:1">${esc(t.name)}</div><span class="rs">${finalScore(t)}</span></div>`).join("")+"</div>";
    }

    let side="";
    if(snap.appStage==="play"){
      const sorted=snap.teams.slice().sort((a,b)=>b.coins-a.coins);
      side=`<h3>${L.standH}</h3><div class="stand2">`+sorted.map(t=>{
        const metsHtml=Object.keys(MET[playerLang]).map(k=>`<span${t.met[k]<0?' class="low"':''} title="${MET[playerLang][k]}"><img class="meticon" src="assets/${MET_ICON[k]}.png">${t.met[k]>0?"+":""}${t.met[k]}</span>`).join(" ");
        return `<div class="srow2${active&&t.id===active.id?" up":""}">
          <div class="sr-top"><span class="dot2" style="background:${t.color}"></span><span class="nm">${esc(t.name)}</span><span class="sc">${t.coins}</span></div>
          <div class="sr-bot"><span class="mets">${metsHtml}</span><span class="cn">${t.turnsTaken}/${snap.turnsPerTeam}</span></div>
        </div>`;
      }).join("")+`</div>`;
    }

    $("joinWaiting").innerHTML=`<div class="pdash-head">${head}</div><div class="pdash-grid"><div class="pdash-main">${main}</div>${side?`<div class="pdash-side">${side}</div>`:""}</div>`;

    if(!mine&&turn.phase==="card"&&me){
      $("joinWaiting").querySelectorAll(".guessOpt").forEach(btn=>{
        btn.onclick=()=>{
          const idx=parseInt(btn.dataset.idx,10);
          markSent(turn,"guess");
          NET.submitAction(joinedRoom,{type:"guess",team:me.id,token:turn.token,optIdx:idx});
          renderPlayerDashboard(snap,team);
        };
      });
    }
    if(!mine)return;
    const rollBtn=$("playerRollBtn");
    if(rollBtn)rollBtn.onclick=()=>{markSent(turn,"roll");NET.submitAction(joinedRoom,{type:"roll",team,token:turn.token});renderPlayerDashboard(snap,team);};
    const drawBtn=$("playerDrawBtn");
    if(drawBtn)drawBtn.onclick=()=>{markSent(turn,"drawCard");NET.submitAction(joinedRoom,{type:"drawCard",team,token:turn.token});renderPlayerDashboard(snap,team);};
    const ackBtn=$("playerAckBtn");
    if(ackBtn)ackBtn.onclick=()=>{markSent(turn,"ackChance");NET.submitAction(joinedRoom,{type:"ackChance",team,token:turn.token});renderPlayerDashboard(snap,team);};
    const nextBtn=$("playerNextBtn");
    if(nextBtn)nextBtn.onclick=()=>{markSent(turn,"nextTurn");NET.submitAction(joinedRoom,{type:"nextTurn",team,token:turn.token});renderPlayerDashboard(snap,team);};
    if(turn.phase==="card"&&turn.cardType!=="chance"&&turn.card&&turn.card.o){
      $("joinWaiting").querySelectorAll(".playerOpt").forEach(btn=>{
        btn.onclick=()=>{
          const idx=parseInt(btn.dataset.idx,10);
          markSent(turn,"choice");
          NET.submitAction(joinedRoom,{type:"choice",team,token:turn.token,optIdx:idx});
          renderPlayerDashboard(snap,team);
        };
      });
    }
    function findFirst(sel){
      const list=$("joinWaiting").querySelectorAll(sel);
      return list&&list.length?list[0]:null;
    }
  }
}

/* ============ boot ============ */
/* Voorkomt het "even leeg wit vakje" gevoel: haalt op de achtergrond alvast de
   meest gebruikte beelden op (alle vakje-varianten, pionnen, en één variant per
   kaart-illustratiecategorie) zodra de app opstart, ruim voordat ze echt nodig zijn. */
function preloadAssets(){
  const files=[];
  Object.values(VAKJE_VARIANTS).forEach(arr=>arr.forEach(f=>files.push(f+".jpg")));
  Object.values(PAWN_IMG_BY_COLOR).forEach(f=>files.push(f+".png"));
  Object.values(IMG_VARIANTS).forEach(arr=>{if(arr[0])files.push(arr[0]+".jpg");});
  files.push("podium-winnaar.jpg");
  files.forEach(f=>{const img=new Image();img.src="assets/"+f;});
}
function boot(){
  preloadAssets();
  const params=new URLSearchParams(location.search);
  const isPlayer=params.get("player")==="1";
  if(isPlayer){
    $("facilitator").classList.add("hide");
    $("player").classList.remove("hide");
    initPlayerView();
    return;
  }
  const saved=loadLocal();
  state=(saved&&saved.teams&&saved.turnsPerTeam)?saved:freshState();
  NET.init();
  NET.bindRoom();
  NET.onAction(handleIncomingAction);
  wireFacilitator();
  renderLegendAndHelp();
  render();
  saveLocal();
  NET.publish();
}
document.addEventListener("DOMContentLoaded",boot);
</script>
</body>
</html>
