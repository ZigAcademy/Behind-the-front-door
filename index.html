<!DOCTYPE html>
<html lang="nl" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Behind the Front Door — Spelbord · Zig Grow</title>
<style>
  :root{--blue:#1F5AFF;--orange:#FF9000;--navy:#152330;--ink:#152330;--muted:#5B6472;--line:#E4E3DC;--bg:#FBF7EE;
    --card:#FFFFFF;--warn:#E4572E;--soft:#EAF0FF;--softwarm:#FFF1E0;--shadow:0 10px 30px rgba(21,35,48,.10);--shadow-sm:0 4px 14px rgba(21,35,48,.07);}
  @media (prefers-color-scheme:dark){:root{--ink:#EDF1F7;--muted:#9AA7BD;--line:#26324A;--bg:#0D1626;--card:#131E31;--soft:#16233D;--softwarm:#2A2010;--shadow:0 10px 30px rgba(0,0,0,.45);--shadow-sm:0 4px 14px rgba(0,0,0,.35);}}
  @font-face{font-family:'Safiro';src:url('assets/Safiro-SemiBold.otf') format('opentype');font-weight:600 900;font-display:swap}
  .brandline h1,.rpill,.announce,.yourturn,.gc .ct,#setupH,#scoresH,#standH,.result .rh{font-family:'Safiro','Arial',sans-serif}
  *{box-sizing:border-box}html,body{margin:0}
  body{font-family:Arial,Helvetica,"Segoe UI",sans-serif;color:var(--ink);min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased;
    background:linear-gradient(rgba(13,21,36,.34),rgba(11,19,34,.55)) fixed, url('assets/bg-board.jpg') center center/cover fixed, #0d1524}
  .wrap{max-width:1200px;margin:0 auto;padding:0 18px 70px}
  button{font-family:inherit}.logo{height:30px;width:auto;display:block}
  header.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line)}
  .top-in{max-width:1200px;margin:0 auto;padding:11px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brandline{display:flex;align-items:center;gap:13px;min-width:0}.brandline h1{font-size:17px;margin:0;font-weight:800;letter-spacing:-.2px;white-space:nowrap}.brandline .sub{color:var(--muted);font-size:12px;white-space:nowrap}
  .spacer{flex:1 1 auto}
  .join-chip{display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px}.join-chip b{font-family:Consolas,monospace;letter-spacing:2px;color:var(--blue)}
  .netchip{font-size:12px;font-weight:800;padding:6px 10px;border-radius:9px;white-space:nowrap}.netchip.live{background:#e5f7ee;color:#137a44}.netchip.off{background:#fff1e0;color:#b3391b}
  .btn{border:0;border-radius:11px;padding:9px 15px;font-size:14px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.06);transition:transform .05s,filter .15s}
  .btn:hover{filter:brightness(1.06)}.btn:active{transform:translateY(1px)}
  .btn.ghost{background:transparent;color:var(--blue);border:1.5px solid var(--blue);box-shadow:none}
  .btn.soft{background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none}.btn.warn{background:var(--orange)}
  .btn.sm{padding:6px 11px;font-size:12.5px;border-radius:9px}.btn.big{padding:13px 22px;font-size:16px;border-radius:13px}.btn:disabled{opacity:.45;cursor:default;filter:none}
  .roundbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0 6px}
  .roundbar .rpill{background:var(--navy);color:#fff;border-radius:999px;padding:7px 15px;font-weight:800;font-size:14px}
  .roundbar .rpill .n{color:var(--orange);margin-inline-end:6px}
  .hint{color:var(--muted);font-size:13.5px;margin:2px 2px 16px}
  #roundHint{color:#c6d1e6}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px}
  .panel h2{margin:0 0 12px;font-size:14px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted)}
  .coins{font-weight:800;font-size:12.5px;color:#7a4100;border:1px solid #e7b768;border-radius:20px;padding:2px 9px;white-space:nowrap;background:linear-gradient(180deg,#ffe392,#f3b73f);box-shadow:inset 0 1px 0 rgba(255,255,255,.65)}
  .mrow{display:flex;gap:5px;align-items:center;font-size:11px;margin:3px 0}
  .mrow .ml{flex:0 0 96px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar{position:relative;flex:1;height:9px;border-radius:6px;border:1px solid #d7cfbd;background:repeating-linear-gradient(90deg,#ece5d6 0,#ece5d6 calc(5% - 1px),#d1c9b6 calc(5% - 1px),#d1c9b6 5%);overflow:hidden}
  @media (prefers-color-scheme:dark){.bar{border-color:#2c3852;background:repeating-linear-gradient(90deg,#1b2740 0,#1b2740 calc(5% - 1px),#2c3852 calc(5% - 1px),#2c3852 5%)}}
  .bar>span{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--blue),#4d7bff);transition:width .4s cubic-bezier(.4,1.3,.5,1)}
  .bar.red>span{background:linear-gradient(90deg,var(--warn),#ff7a54)}
  .mv{flex:0 0 20px;text-align:right;font-weight:800;font-size:11px}
  .miniflag{font-size:9.5px;font-weight:800;color:#fff;background:var(--warn);border-radius:5px;padding:1px 5px}
  .minichance{margin-top:7px;border-radius:9px;padding:6px 8px;font-size:11.5px;border:1px solid}
  .minichance.good{background:#e9f9f0;border-color:#8fddb4;color:#137a44}.minichance.bad{background:#fdeee9;border-color:#f2b3a1;color:#b3391b}
  @media (prefers-color-scheme:dark){.minichance.good{background:#12301f;border-color:#1f5a3a}.minichance.bad{background:#331912;border-color:#5a2a1c}}
  .stage{min-height:380px;display:flex;flex-direction:column;justify-content:center}
  .announce{text-align:center;padding:16px 14px;border-radius:16px;color:#fff;font-weight:900;font-size:22px;letter-spacing:.3px;margin-bottom:12px;box-shadow:var(--shadow);animation:announce .75s cubic-bezier(.2,.9,.3,1.2) both}
  .announce .sub{font-size:13px;font-weight:700;opacity:.92;margin-top:3px}
  @keyframes announce{0%{opacity:0;transform:scale(.6) translateY(18px)}45%{opacity:1;transform:scale(1.05)}72%{transform:scale(.98)}100%{transform:scale(1)}}
  .gc{border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:0 16px 34px rgba(0,0,0,.24),0 3px 0 rgba(0,0,0,.10);transform-origin:center;max-width:100%;margin:0 auto}
  .gc.deal{animation:deal .7s cubic-bezier(.2,.9,.3,1.1) both}
  @keyframes deal{0%{opacity:0;transform:translateY(30px) rotateY(70deg) scale(.92)}55%{opacity:1;transform:translateY(0) rotateY(-5deg) scale(1.01)}100%{transform:none}}
  .gc .illo{width:min(220px,70%);aspect-ratio:1/1;margin:14px auto 2px;border-radius:12px;background-size:cover;background-position:center;box-shadow:0 6px 16px rgba(0,0,0,.2);position:relative;overflow:hidden}
  .gc .illo .kind{position:absolute;left:0;bottom:0;padding:5px 12px;font-size:10px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:#fff;border-top-right-radius:10px}
  .gc.task .illo .kind{background:var(--blue)}.gc.shock .illo .kind{background:var(--warn)}
  .gc .body{padding:14px}.gc .ct{font-size:18px;font-weight:800;margin:0 0 7px;letter-spacing:-.2px}.gc .cx{font-size:14px;margin:0 0 9px}
  .gc .meta{font-size:12.5px;color:var(--muted);margin:8px 0 0}.gc .meta b{color:var(--ink)}
  .tag{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:2px 7px;margin:3px 4px 0 0}
  .tag.pay{background:var(--softwarm);color:#8a4b00}.tag.gain{background:#e5f7ee;color:#137a44}.tag.up{background:#e5f0ff;color:#0a44c9}.tag.down{background:#fdece9;color:#b3391b}
  .pickbtns{display:flex;flex-direction:column;gap:8px;margin-top:10px}
  .pickbtns .btn{text-align:start;padding:11px 14px;font-size:14px;line-height:1.35}
  .pickbtns .oesub{display:block;font-weight:400;opacity:.85;font-size:12px;margin-top:2px}
  .banner{background:var(--soft);border:1px solid var(--line);border-inline-start:5px solid var(--orange);border-radius:12px;padding:11px 13px;font-size:13.5px;margin-top:10px}.banner b{color:var(--ink)}
  .result{border-radius:14px;padding:13px 15px;margin-top:10px;border:1px solid;animation:deal .5s ease both}
  .result.good{background:#e9f9f0;border-color:#8fddb4}.result.bad{background:#fdeee9;border-color:#f2b3a1}.result.neu{background:var(--soft);border-color:var(--line)}
  .result .rh{font-weight:800;font-size:14px;margin-bottom:4px}
  .result .delta{font-weight:900;font-size:14px;margin-top:5px}
  @media (prefers-color-scheme:dark){.result.good{background:#12301f;border-color:#1f5a3a}.result.bad{background:#331912;border-color:#5a2a1c}}
  .ctrls{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px;justify-content:center}
  .waitline{color:var(--muted);font-size:14px;text-align:center;padding:14px}
  .deckmini{width:64px;height:88px;border-radius:11px;background:radial-gradient(60px 60px at 30% 20%,rgba(255,144,0,.25),transparent 60%),linear-gradient(150deg,#1b3fb0,var(--blue) 40%,var(--navy));box-shadow:var(--shadow);border:2px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;color:var(--orange);font-size:34px;font-weight:900}
  select,input[type=text],input[type=number]{font-family:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
  label.fld{display:block;font-size:12.5px;color:var(--muted);font-weight:700;margin:0 0 4px}
  .setup-row{display:grid;grid-template-columns:1.4fr .6fr auto;gap:10px;align-items:end;margin-bottom:10px}
  .cover{aspect-ratio:2.4/1;width:100%;max-width:640px;margin:0 auto 14px;border-radius:16px;background:#fbfaf6 center/cover no-repeat;box-shadow:var(--shadow),0 0 0 1px rgba(255,255,255,.5) inset}
  .legend{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
  .legend .lg{display:flex;align-items:center;gap:6px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:6px 11px;font-size:12.5px;font-weight:700;white-space:nowrap}
  .legswatch{display:inline-block;width:12px;height:12px;border-radius:4px;margin-inline-end:6px;vertical-align:-1px}
  .legswatch.start{background:var(--navy)}
  .legswatch.task{background:#1F5AFF}
  .legswatch.chance{background:#FF9000}
  .legswatch.shock{background:#E4572E}
  .legswatch.kennisduel{background:#8B5CF6}
  .spbadge{display:inline-block;font-size:15px;font-weight:900;letter-spacing:.4px;text-transform:uppercase;color:#fff;border-radius:10px;padding:8px 16px}
  .spbadge.task{background:#1F5AFF}
  .spbadge.chance{background:#FF9000}
  .spbadge.shock{background:#E4572E}
  .spbadge.kennisduel{background:#8B5CF6}
  .steplist{list-style:none;margin:8px 0 2px;padding:0}
  .steplist li{font-size:13.5px;margin:6px 0;display:flex;gap:8px;align-items:flex-start}
  .tips{list-style:none;margin:0 0 18px;padding:0;text-align:start}
  .tips li{font-size:13px;color:var(--muted);margin:6px 0;display:flex;gap:7px;align-items:flex-start}
  .ringwrap{position:relative}
  .ringgrid{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);gap:5px;width:100%}
  .tile{position:relative;aspect-ratio:1/1;border-radius:9px;border:2.5px solid var(--line);background:var(--soft) center/cover;display:flex;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.04)}
  .tile.start{color:#fff;font-weight:900;border-color:var(--navy)}
  .tile.start .tt{color:#c6d1e6}
  .tile.shock{border-color:#E4572E}
  .tile.chance{border-color:#FF9000}
  .tile.task{border-color:#1F5AFF}
  .tile.here{outline:3px solid var(--orange);outline-offset:-2px}
  .ringcenter{position:absolute;left:12.5%;top:12.5%;width:75%;height:75%;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px;overflow:auto;z-index:2;display:flex;flex-direction:column;justify-content:center}
  .pawnlayer{position:absolute;inset:0;pointer-events:none;z-index:6;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);gap:5px}
  .pawncell{display:flex;align-items:flex-end;justify-content:center;flex-wrap:nowrap;padding:2px;overflow:visible}
  .pw2{width:52px;height:68px;background-size:contain;background-repeat:no-repeat;background-position:center bottom;filter:drop-shadow(0 4px 6px rgba(0,0,0,.45));position:relative;flex:0 0 auto;transform-origin:center bottom}
  .pw2.hop{animation:pawnhop .42s cubic-bezier(.4,0,.3,1)}
  @keyframes pawnhop{
    0%{transform:translate(var(--fx,0),var(--fy,0)) rotate(0deg) scale(1)}
    22%{transform:translate(calc(var(--fx,0) * .72),calc(var(--fy,0) * .72 - 16px)) rotate(-9deg) scale(1.05)}
    50%{transform:translate(calc(var(--fx,0) * .4),calc(var(--fy,0) * .4 - 22px)) rotate(8deg) scale(1.08)}
    78%{transform:translate(calc(var(--fx,0) * .12),calc(var(--fy,0) * .12 - 10px)) rotate(-4deg) scale(1.03)}
    100%{transform:translate(0,0) rotate(0deg) scale(1)}
  }
  .dice{width:88px;height:88px;border-radius:20px;background:var(--card);border:3px solid var(--line);box-shadow:0 10px 22px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;font-size:48px;margin:0 auto 8px}
  .dice.rolling{animation:diceroll .7s cubic-bezier(.34,1.4,.4,1)}
  @keyframes diceroll{0%{transform:rotate(0) scale(1)}12%{transform:rotate(-28deg) scale(1.18)}26%{transform:rotate(24deg) scale(1.24)}40%{transform:rotate(-20deg) scale(1.16)}55%{transform:rotate(14deg) scale(1.1)}70%{transform:rotate(-9deg) scale(1.05)}85%{transform:rotate(4deg) scale(1.02)}100%{transform:rotate(0) scale(1)}}
  @media (max-width:860px){.pw2{width:32px;height:42px}.dice{width:62px;height:62px;font-size:32px}}
  .playgrid{display:grid;grid-template-columns:1fr;gap:18px;align-items:start}
  #standCompact{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;max-height:none;overflow:visible}
  #standCompact .srow2{padding:16px 18px;border-radius:16px}
  #standCompact .srow2 .pos{font-size:20px;width:26px}
  #standCompact .srow2 .dot2{width:16px;height:16px}
  #standCompact .srow2 .nm{font-size:17px}
  #standCompact .srow2 .sc{font-size:26px}
  #standCompact .srow2 .sr-bot{font-size:14px;margin-top:9px}
  #standCompact .srow2 .mets{gap:9px}
  #standCompact .meticon{width:28px;height:28px;margin-inline-end:6px;vertical-align:-7px}
  .stand-legend{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .stand-legend .lgi{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-weight:700}
  .stand-legend .lgi img{width:20px;height:20px;object-fit:contain}
  .metdelta{display:inline-flex;align-items:center;gap:5px;font-weight:700}
  .metdelta img{width:18px;height:18px;object-fit:contain;vertical-align:-4px}
  .whybox{max-width:460px;margin:8px auto 0;text-align:start;background:var(--soft);border-radius:12px;padding:10px 14px}

  .effectrow{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:12px 0}

  .effectchip img{width:28px;height:28px;object-fit:contain}
  .effectchip .ereason{font-size:13.5px;font-weight:600;line-height:1.35;opacity:.9}
  .effectchip.coin{background:linear-gradient(180deg,#ffe392,#f3b73f);color:#7a4100;border:1px solid #e7b768}
  .effectchip.pos{background:#e5f7ee;color:#137a44;border:1px solid #8fddb4}
  .effectchip.neg{background:#fdeee9;color:#a4321f;border:1px solid #f2b3a1}
  @media (prefers-color-scheme:dark){.effectchip.pos{background:#12301f;border-color:#1f5a3a}.effectchip.neg{background:#331912;border-color:#5a2a1c}}
  .stand2{display:flex;flex-direction:column;gap:7px;max-height:78vh;overflow:auto}
  .srow2{border:1px solid var(--line);border-radius:11px;padding:8px 10px;background:var(--card);box-shadow:var(--shadow-sm)}
  .srow2.up{outline:2px solid var(--orange);outline-offset:-1px}
  .srow2 .sr-top{display:flex;align-items:center;gap:7px}

  .srow2 .dot2{width:11px;height:11px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 1px 2px rgba(0,0,0,.25);flex:0 0 auto}

  .srow2 .sc{font-weight:900;font-size:15px;flex:0 0 auto}

  .srow2 .mets .low{color:var(--warn);font-weight:800}
  .srow2 .cn{font-weight:800;color:#7a4100;white-space:nowrap}
  .durrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
  @media (max-width:520px){.durrow{grid-template-columns:1fr}}

  .podiumcaption{font-size:19px}
  .rank{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:13px;margin-bottom:10px;background:var(--card);box-shadow:var(--shadow-sm)}

  .rank .rn{font-weight:800;font-size:16px}.rank .rs{margin-inline-start:auto;font-size:22px;font-weight:900}.rank .rd{font-size:12px;color:var(--muted)}

  .dbrow{padding:8px 12px;border-top:1px solid var(--line)}
  .dbttl{font-weight:700;font-size:13.5px}.dbttl .dbr{display:inline-block;font-size:11px;font-weight:800;color:#fff;background:var(--blue);border-radius:6px;padding:1px 6px;margin-inline-end:5px}

  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--orange);margin:0 3px;animation:pulse 1.2s infinite}.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
  @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
  .cardface{border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:0 16px 34px rgba(0,0,0,.2);padding:16px 18px;animation:deal .6s cubic-bezier(.2,.9,.3,1.1) both;max-width:520px;margin:0 auto}

  .tile.kennisduel{border-color:#8B5CF6}
  .cardface.kd{border-color:#c9b3f5;box-shadow:0 18px 40px rgba(91,58,168,.3)}

  .sectorimg{width:56px;height:56px;border-radius:10px;background-size:cover;background-position:center;float:left;margin-inline-end:10px;box-shadow:0 4px 10px rgba(0,0,0,.15)}

  #fxCanvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999}

  .tile.here{animation:tilepop .5s ease}
  @keyframes tilepop{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
  .yourturn,.announce{position:relative;overflow:hidden}

  .cardface h3{margin:0 0 8px;font-size:19px;letter-spacing:-.2px;text-align:center}

  .opts{display:flex;flex-direction:column;gap:8px;margin-top:6px}
  .optbtn{text-align:start;padding:11px 14px;line-height:1.35;width:100%}

/* Balansbonus: elke metric die 0 of hoger staat levert +1 muntpunt op, elke
   metric die negatief staat kost 1 muntpunt. Zo tellen tevredenheid, financieel,
   compliance en duurzaamheid ook echt mee voor de einduitslag, niet alleen munten. */
function metricsBonus(team){
  const met=team.met||{};
  return ["sat","fin","comp","dur"].reduce((sum,k)=>sum+((met[k]||0)>=0?1:-1),0);
}
function finalScore(team){return team.coins+metricsBonus(team);}

 {id:"A",t:"De schimmelmelding",x:"Een huurder meldt via het portaal schimmel in de slaapkamer. In het gezin woont een baby van vier maanden. Er zit een foto bij, met de boodschap: dit duurt nu al drie weken. De huurder is ongerust en voelt zich niet gehoord.",o:[{l:"A · Direct herstellen, gezin ontzien",e:"Snel en grondig, ook al is het duur.",coins:-3,fx:{sat:2,comp:1},mx:{sat:"Het gezin voelt zich eindelijk gehoord en geholpen.",comp:"Zorgplicht bij een gezondheidsrisico is direct en aantoonbaar nagekomen."}},{l:"B · Regulier inplannen",e:"Via de vaste aannemer, geen voorrang.",coins:-1,fx:{sat:1},mx:{sat:"Er gebeurt tenminste iets, al voelt het traag."}},{l:"C · Laten ventileren, zelf oplossen",e:"Kosten drukken, bal bij de huurder.",coins:0,fx:{sat:-2,comp:-1},mx:{sat:"De huurder voelt zich afgescheept met een gezondheidsklacht.",comp:"Bij een baby in huis is 'zelf oplossen' geen zorgvuldige aanpak."}}],sp:"Klanttevredenheid versus kostenbeheersing. Bij een baby komen reputatie en zorgplicht erbij — één bericht op sociale media en het is een mediakwestie."},
 {id:"B",t:"De zzp'er",x:"Een zelfstandige met sterk wisselend inkomen reageert op een sociale huurwoning. Vorig jaar verdiende hij te veel voor de inkomensgrens, dit jaar zit hij er ruim onder. Hij staat al zeven jaar ingeschreven en hoopt eindelijk aan de beurt te zijn.",o:[{l:"A · Toewijzen op actueel inkomen",e:"Menselijke maat, met een stevig dossier.",coins:-1,fx:{sat:2,comp:-1},mx:{sat:"Zeven jaar wachten wordt eindelijk beloond.",comp:"Toewijzen op actueel in plaats van vorig jaar inkomen wijkt af van de standaardtoets."}},{l:"B · Extra toetsen, dan beslissen",e:"Zorgvuldig, kost tijd.",coins:-1,fx:{comp:2,sat:-1},mx:{comp:"Extra toetsing onderbouwt het besluit waterdicht.",sat:"Wachten op nog een toets voelt als weer uitstel."}},{l:"C · Afwijzen op de regels",e:"Veilig, maar teleurstellend.",coins:0,fx:{comp:1,sat:-2},mx:{comp:"De regels zijn strikt en zonder uitzondering toegepast.",sat:"Zeven jaar wachten eindigt toch in een afwijzing."}}],sp:"Snelheid versus compliance, en wettelijke kaders versus de menselijke maat. Zeven jaar wachten voelt onrechtvaardig, maar de accountant toetst op de regels, niet op het gevoel."},
 {id:"C",t:"De stille achterstand",x:"Een huurder heeft twee maanden huurachterstand en reageert niet op brieven, mails of telefoontjes. De buren zeggen dat ze hem al weken niet hebben gezien. Er hangt iets onrustigs om de woning.",o:[{l:"A · Huisbezoek en hulp aanhaken",e:"Vroegsignalering met de gemeente.",coins:-1,fx:{sat:2,comp:1},mx:{sat:"De huurder krijgt hulp in plaats van alleen een dreigement.",comp:"Vroegsignalering met de gemeente is precies het beleid dat hoort te gebeuren."}},{l:"B · Incassotraject starten",e:"Zakelijk, volgens de termijnen.",coins:0,fx:{fin:1,sat:-2},mx:{fin:"Het incassotraject haalt de achterstand alsnog binnen.",sat:"Een incassobrief voelt kil voor iemand die mogelijk in de problemen zit."}},{l:"C · Aanmanen en afwachten",e:"Goedkoop, maar risico.",coins:0,fx:{sat:-1,comp:-2},mx:{sat:"Alleen aanmanen lost niets structureel op voor de huurder.",comp:"Afwachten terwijl er signalen van nood zijn, is geen zorgvuldig handelen."}}],sp:"Financiële continuïteit versus maatschappelijke verantwoordelijkheid. Ontruimen is het duurste én het slechtste scenario, voor iedereen."},
 {id:"D",t:"De weigeraar",x:"Jullie willen een portiekflat van 24 woningen isoleren en van zonnepanelen voorzien. Voor het project is instemming van 70 procent van de bewoners nodig. Zes huurders weigeren: ze vrezen huurverhoging en gedoe, en vertrouwen de plannen niet.",o:[{l:"A · Doorzetten met compensatie",e:"Bewoners tegemoetkomen, duur.",coins:-3,fx:{dur:2,sat:1},mx:{dur:"Het hele complex wordt alsnog verduurzaamd.",sat:"Compensatie haalt de scherpe kantjes van de weerstand."}},{l:"B · Faseren en opnieuw in gesprek",e:"Rustiger, later resultaat.",coins:-1,fx:{dur:1,fin:-1},mx:{dur:"Een deel van het complex wordt alvast verduurzaamd.",fin:"Vertraging en een tweede gespreksronde kosten extra tijd en geld."}},{l:"C · Project schrappen",e:"Geld sparen, labels blijven laag.",coins:0,fx:{dur:-2,sat:1},mx:{dur:"Zonder isolatie en zonnepanelen blijven de energielabels laag.",sat:"De zes weigerende huurders krijgen hun zin."}}],sp:"Betaalbaarheid versus klimaatdoelen. De labels moeten naar A, maar de huurder van nu betaalt de rekening en voelt vooral het gedoe."},
 {id:"E",t:"De verbouwde woning",x:"Een vertrekkende huurder zegt de huur op. Bij de voorinspectie blijkt dat hij zonder toestemming een muur heeft doorgebroken en de badkamer heeft verbouwd. Het ziet er strak uit, maar niets is gedocumenteerd of gemeld.",o:[{l:"A · Overnemen, snel opnieuw verhuren",e:"Leegstand beperken, pragmatisch.",coins:1,fx:{fin:1,comp:-1},mx:{fin:"Geen leegstand, meteen weer huurinkomsten.",comp:"De ongemelde verbouwing wordt zonder controle geaccepteerd."}},{l:"B · Herstel in oude staat eisen",e:"Netjes, maar weken leegstand.",coins:-2,fx:{comp:1,fin:-1},mx:{comp:"De woning wordt weer volgens het goedgekeurde plan opgeleverd.",fin:"Weken leegstand tijdens het herstel kosten huurinkomsten."}},{l:"C · Coulant afhandelen",e:"Goede sfeer, minder streng.",coins:0,fx:{sat:1,comp:-1},mx:{sat:"De vertrekkende huurder wordt niet op kosten gejaagd.",comp:"De regel dat verbouwingen gemeld moeten worden, wordt losgelaten."}}],sp:"Leegstandsverlies versus kwaliteit. Elke week discussie kost huurinkomsten, terwijl er tien jaar wachtlijst voor de deur staat."},
 {id:"J1",t:"Ketels in de kou",x:"Half januari vallen de cv-ketels van twaalf woningen definitief uit. De bewoners zitten in de kou en bellen het klantcontactcentrum plat — er moet vandaag nog een besluit komen.",o:[{l:"A · Warmtepompen",e:"Toekomstvast, fors investeren.",coins:-4,fx:{dur:2,sat:1},mx:{dur:"Warmtepompen zijn de duurzame oplossing voor de lange termijn.",sat:"Bewoners krijgen een toekomstbestendige, comfortabele oplossing."}},{l:"B · Nieuwe cv-ketels",e:"Snel en vertrouwd.",coins:-2,fx:{sat:1,dur:-1},mx:{sat:"Snel weer warm water en verwarming, vertrouwd en simpel.",dur:"Nieuwe cv-ketels houden de organisatie afhankelijk van gas."}},{l:"C · Tijdelijke kachels",e:"Goedkoop nu, gedoe later.",coins:-1,fx:{sat:-1,dur:-1},mx:{sat:"Kachels zijn een noodoplossing, geen echte verwarming.",dur:"Een tijdelijke lap in plaats van een duurzame keuze."}}],sp:"Investeren in de toekomst versus vandaag warmte leveren. Het is midden in de winter en er is geen tijd voor een zorgvuldige afweging."},
 {id:"J2",t:"Het datalek",x:"Een medewerker mailt per ongeluk een lijst met huurdersgegevens — inclusief betalingsachterstanden — naar een extern adres. Binnen een uur is het bekend op kantoor en de klok begint te tikken.",o:[{l:"A · Melden bij de AP",e:"Transparant, kost imago even.",coins:-1,fx:{comp:2,sat:-1},mx:{comp:"Melden bij de toezichthouder is precies wat de AVG vereist.",sat:"Het datalek wordt nu ook extern zichtbaar, wat imago kost."}},{l:"B · Intern onderzoeken",e:"Voorzichtig, tijd kopen.",coins:0,fx:{comp:-1},mx:{comp:"Niet meteen melden is een overtreding van de meldplicht."}},{l:"C · Stilhouden",e:"Riskant; dit kan groot worden.",coins:0,fx:{comp:-3,sat:-1},mx:{comp:"Een datalek verzwijgen is een ernstige overtreding van de AVG.",sat:"Als het uitkomt, voelt het voor huurders als bedrog."}}],sp:"Transparantie versus reputatieschade. Melden is wettelijk het veiligst, maar voelt als jezelf aangeven voordat je het hele verhaal kent."},
 {id:"J3",t:"De speeltuin",x:"De bewonerscommissie van een verloederd complex eist al twee jaar een opgeknapte binnentuin met speeltuin. Ze zijn het wachten zat en dreigen naar de lokale krant te stappen.",o:[{l:"A · Investeren, samen ontwerpen",e:"Bewoners betrekken.",coins:-2,fx:{sat:2},mx:{sat:"Bewoners zien hun wensen terug in het ontwerp."}},{l:"B · Sober opknappen",e:"Iets doen, budget sparen.",coins:-1,fx:{sat:1},mx:{sat:"Er verandert eindelijk iets, ook al is het minimaal."}},{l:"C · Doorschuiven",e:"Niets nu, gemor later.",coins:0,fx:{sat:-1},mx:{sat:"Twee jaar wachten wordt weer verlengd, zonder duidelijk perspectief."}}],sp:"Tevredenheid versus budgetdiscipline. Een speeltuin is geen wettelijke plicht, maar twee jaar wachten tast het vertrouwen in jullie aan."},
 {id:"J4",t:"De schrijnende afwijzing",x:"Een alleenstaande moeder reageert op een woning; haar inkomen ligt 800 euro boven de grens. Haar situatie is schrijnend en goed gedocumenteerd, maar de regels zijn glashelder.",o:[{l:"A · Toewijzen via vrije ruimte",e:"Menselijke maat, dossier op orde.",coins:-1,fx:{sat:2,comp:-1},mx:{sat:"Een schrijnend geval krijgt alsnog een woning.",comp:"De vrije-ruimteregeling wordt gebruikt om van de norm af te wijken."}},{l:"B · Afwijzen, warm doorverwijzen",e:"Regels volgen, netjes.",coins:0,fx:{comp:1,sat:-1},mx:{comp:"De inkomensgrens wordt gewoon toegepast, zoals het hoort.",sat:"Een afwijzing blijft een afwijzing, ook met een warme verwijzing."}},{l:"C · Afwijzen zonder omhaal",e:"Snel, maar koud.",coins:0,fx:{comp:1,sat:-2},mx:{comp:"De regels worden strikt gevolgd.",sat:"Een kille afwijzing zonder verdere toelichting doet extra pijn."}}],sp:"Menselijke maat versus consequente regels. Één uitzondering voelt rechtvaardig, maar opent de deur voor de volgende twintig grensgevallen."},
 {id:"J5",t:"Het onderhoudscontract",x:"Een aannemer biedt 15% korting bij een driejarig onderhoudscontract, maar wil deze week tekenen. Er is geen tijd voor een zorgvuldige vergelijking met andere partijen.",o:[{l:"A · Tekenen voor de korting",e:"Direct voordeel, minder controle.",coins:2,fx:{comp:-1},mx:{comp:"Zonder vergelijk tekenen omzeilt het inkoopbeleid."}},{l:"B · Meervoudige uitvraag",e:"Zorgvuldig, kost tijd.",coins:0,fx:{comp:1},mx:{comp:"Een zorgvuldige vergelijking van aanbieders hoort bij goed inkoopbeleid."}},{l:"C · Kort onderhandelen",e:"Iets van beide.",coins:1,fx:{}}],sp:"Snel voordeel versus zorgvuldige inkoop. De korting is aantrekkelijk, maar tekenen zonder vergelijk kan later duurder blijken."},
 {id:"J6",t:"De statushouders",x:"De gemeente vraagt jullie dit kwartaal extra statushouders te huisvesten. De wachtlijst voor reguliere woningzoekenden is al lang en de druk komt van twee kanten.",o:[{l:"A · Volledig toezeggen",e:"Afspraken nakomen.",coins:0,fx:{comp:2,sat:-1},mx:{comp:"De afspraak met de gemeente wordt volledig nagekomen.",sat:"Reguliere woningzoekenden zien de wachtlijst niet opschieten."}},{l:"B · Helft toezeggen, faseren",e:"Balans zoeken.",coins:0,fx:{comp:1},mx:{comp:"Een deel van de afspraak wordt nagekomen, gefaseerd en behapbaar."}},{l:"C · Uitstellen dit kwartaal",e:"Reguliere lijst eerst.",coins:0,fx:{comp:-1,sat:1},mx:{comp:"De afspraak met de gemeente wordt niet nagekomen.",sat:"Reguliere woningzoekenden krijgen voorrang op de lijst."}}],sp:"Verplichtingen aan de gemeente versus je eigen wachtlijst. Elke toezegging aan de ene groep voelt als een belofte gebroken aan de andere."},
 {id:"J7",t:"De huurverhoging",x:"Het is 1 juli: de inflatie is hoog en jullie investeringsagenda ook. De jaarlijkse huurverhoging moet worden vastgesteld, ergens tussen betaalbaarheid en begroting.",o:[{l:"A · Maximaal verhogen",e:"Begroting op orde, huurders morren.",coins:2,fx:{sat:-2},mx:{sat:"De maximale verhoging raakt huurders direct in de portemonnee."}},{l:"B · Gematigd verhogen",e:"Redelijk midden.",coins:1,fx:{}},{l:"C · Bevriezen dit jaar",e:"Huurders blij, minder inkomsten.",coins:-1,fx:{sat:2},mx:{sat:"Huurders merken dit jaar geen lastenverzwaring."}}],sp:"Begrotingsdiscipline versus betaalbaarheid. Wat de organisatie financieel gezond houdt, doet huurders in hun portemonnee pijn."},
 {id:"J8",t:"De hennepgeur",x:"De wijkbeheerder meldt een sterke hennepgeur en afgeplakte ramen bij een woning. De buren klagen over warmte-overlast en voelen zich onveilig.",o:[{l:"A · Politie + ontbinding",e:"Daadkrachtig, kost tijd en geld.",coins:-1,fx:{comp:1,sat:1},mx:{comp:"Overlast en een vermoeden van hennepteelt worden serieus en volgens het boekje aangepakt.",sat:"Buren voelen zich eindelijk gehoord en veiliger."}},{l:"B · Waarschuwen en monitoren",e:"Kans geven, risico blijft.",coins:0,fx:{comp:-1},mx:{comp:"Een vermoeden van hennepteelt wordt niet direct doorgezet naar de politie."}},{l:"C · Zelf aankijken",e:"Wegkijken kan zich wreken.",coins:0,fx:{comp:-2,sat:-1},mx:{comp:"Een duidelijk overlastsignaal wordt genegeerd.",sat:"Buren blijven met het onveilige gevoel zitten."}}],sp:"Daadkracht versus zorgvuldigheid. Ingrijpen op een vermoeden voelt hard als het onterecht blijkt, maar wachten kan gevaarlijk zijn."},
 {id:"J9",t:"Zonnepanelen met subsidie",x:"Een subsidieregeling dekt de helft van een zonnepanelenproject op 100 woningen, maar de aanvraagdeadline is over drie weken. De organisatie zit al bomvol.",o:[{l:"A · Vol inzetten",e:"Alle hens aan dek.",coins:-3,fx:{dur:2,sat:1},mx:{dur:"Honderd woningen krijgen in één keer zonnepanelen.",sat:"Bewoners profiteren snel van lagere energielasten."}},{l:"B · Kleine pilot",e:"Voorzichtig starten.",coins:-1,fx:{dur:1},mx:{dur:"Een beperkt aantal woningen krijgt alvast zonnepanelen."}},{l:"C · Overslaan",e:"Focus elders, kans gemist.",coins:0,fx:{dur:-1},mx:{dur:"De subsidiekans voor verduurzaming gaat voorbij."}}],sp:"Een unieke kans versus de beperkte capaciteit van de organisatie. Alles laten vallen voor de subsidie kan ten koste gaan van lopend werk."},
 {id:"J10",t:"Het legacy-systeem",x:"De leverancier van jullie verouderde reparatiesysteem verhoogt de licentiekosten met 40%. Migreren naar het geïntegreerde platform kan, maar kost nu geld en aandacht.",o:[{l:"A · Migreren",e:"Investeren in de toekomst.",coins:-3,fx:{comp:1,fin:1},mx:{comp:"Een modern, ondersteund systeem is makkelijker aantoonbaar in orde.",fin:"Op termijn zijn de licentiekosten van het geïntegreerde platform lager."}},{l:"B · Betalen en doorschuiven",e:"Rust nu, kosten blijven.",coins:-2,fx:{}},{l:"C · Zelf lapmiddel bouwen",e:"Goedkoop, fragiel.",coins:0,fx:{comp:-1,fin:-1},mx:{comp:"Een zelfgebouwde workaround is niet officieel ondersteund of gecontroleerd.",fin:"Een fragiele oplossing leidt later tot extra reparatiekosten."}}],sp:"Structurele investering versus kortetermijnrust. Migreren kost nu geld en aandacht, maar uitstellen stapelt het probleem alleen maar op."},
 {id:"J11",t:"De verwarde huurder",x:"Een huurder met verward gedrag veroorzaakt ernstige overlast in een portiek en de buren dreigen zelf te vertrekken. Zorg lijkt niet in beeld en de situatie loopt op.",o:[{l:"A · Zorgpartners + gemeente",e:"Duurzame oplossing, kost tijd.",coins:-1,fx:{comp:1,sat:1},mx:{comp:"De juiste zorgpartijen worden erbij betrokken, zoals het hoort.",sat:"Buren zien dat er daadwerkelijk iets aan de overlast gedaan wordt."}},{l:"B · Juridisch traject",e:"Snel rust, hard voor de huurder.",coins:-2,fx:{sat:1},mx:{sat:"De overlast stopt snel voor de buren."}},{l:"C · Buren geruststellen, afwachten",e:"Uitstel, overlast blijft.",coins:0,fx:{sat:-1,comp:-1},mx:{sat:"De overlast blijft gewoon doorgaan.",comp:"Een signaal dat professionele hulp nodig heeft, wordt genegeerd."}}],sp:"Zorg voor de huurder versus rust voor de buren. Een juridisch traject werkt sneller, maar lost het onderliggende probleem niet op."},
 {id:"J12",t:"De woningruil",x:"Twee huurders willen woningen ruilen: een oudere dame in een eengezinswoning en een jong gezin in een appartement. Het vergt dubbele toetsing en de nodige administratie.",o:[{l:"A · Meewerken, volledig toetsen",e:"Blije huurders, extra werk.",coins:-1,fx:{sat:1,comp:1},mx:{sat:"Beide huurders krijgen de woning die beter bij hen past.",comp:"Een volledige toetsing houdt de ruil aantoonbaar netjes."}},{l:"B · Meewerken, licht toetsen",e:"Sneller, meer risico.",coins:0,fx:{sat:1,comp:-1},mx:{sat:"Beide huurders zijn blij en snel geholpen.",comp:"Een lichte toetsing laat ruimte voor fouten in het dossier."}},{l:"C · Afwijzen",e:"Team ontlasten, teleurstelling.",coins:0,fx:{sat:-1},mx:{sat:"Beide huurders blijven zitten waar ze niet willen wonen."}}],sp:"Klanttevredenheid versus teamcapaciteit. Twee blije huurders is mooi, maar volledige dubbele toetsing kost tijd die je ergens anders niet hebt."},
 {id:"C1",t:"Energieprijzen verdubbelen",x:"De energieprijzen exploderen. Huurders in slecht geïsoleerde woningen komen in de knel en de media staan er bovenop — de druk om iets te doen is groot.",o:[{l:"A · Noodfonds openen",e:"Huurders steunen, kost geld.",coins:-2,fx:{sat:2},mx:{sat:"Huurders krijgen direct financiële verlichting."}},{l:"B · Isolatie versnellen",e:"Structureel, forse investering.",coins:-3,fx:{dur:2,sat:1},mx:{dur:"Slecht geïsoleerde woningen worden structureel verbeterd.",sat:"Lagere energierekeningen op de lange termijn."}},{l:"C · Verwijzen naar regelingen",e:"Zelf niets, huurders in de kou.",coins:0,fx:{sat:-2},mx:{sat:"Huurders voelen zich aan hun lot overgelaten in de energiecrisis."}}],sp:"Snelle verlichting versus een structurele oplossing. Een noodfonds helpt nu, maar isolatie lost het probleem voor altijd op — als je het kunt betalen."},
 {id:"C2",t:"Cyberaanval",x:"Ransomware legt het incassosysteem twee weken plat. Huurders kunnen niet betalen en de administratie loopt vast; de vraag is: melden of stilhouden?",o:[{l:"A · Forensisch + melden",e:"Transparant en grondig.",coins:-2,fx:{comp:1},mx:{comp:"Een grondig onderzoek en melding volgen de meldplicht bij incidenten."}},{l:"B · Eigen ICT herstelt",e:"Sneller, minder volledig.",coins:-1,fx:{comp:-1},mx:{comp:"Zonder extern forensisch onderzoek blijft de oorzaak onduidelijk."}},{l:"C · Stilhouden",e:"Riskant.",coins:0,fx:{comp:-2},mx:{comp:"Een cyberincident verzwijgen is in strijd met de meldplicht."}}],sp:"Transparantie versus snelheid onder crisisdruk. Melden is zorgvuldig, maar zolang het incident loopt weet niemand nog hoe groot het probleem is."},
 {id:"C3",t:"ESG-rapportage per direct",x:"Nieuwe Europese regelgeving verplicht per direct een duurzaamheidsrapportage. Jullie data over labels en verbruik ligt verspreid over vijf systemen en talloze Excel-bestanden.",o:[{l:"A · Dataproject opzetten",e:"Alles centraal, herbruikbaar.",coins:-2,fx:{comp:1,dur:1},mx:{comp:"Gecentraliseerde data maakt rapportage aantoonbaar en herhaalbaar.",dur:"Overzicht van labels en verbruik legt de basis voor gerichter verduurzamen."}},{l:"B · Extern laten rapporteren",e:"Snel klaar, kost geld.",coins:-2,fx:{comp:1},mx:{comp:"De rapportageverplichting wordt op tijd nagekomen."}},{l:"C · Minimaal rapporteren",e:"Voldoen op papier, risico.",coins:0,fx:{comp:-2},mx:{comp:"Minimale rapportage voldoet niet echt aan de nieuwe regelgeving."}}],sp:"Structureel oplossen versus snel voldoen aan de deadline. Een dataproject helpt blijvend, maar de wet wacht niet op jullie tempo."},
 {id:"C4",t:"Aannemer failliet",x:"Midden in de renovatie van 60 woningen gaat de hoofdaannemer failliet. De steigers staan er verlaten bij en de bewoners zitten tussen het stof.",o:[{l:"A · Duurdere partij, doorbouwen",e:"Bewoners ontzien, duur.",coins:-3,fx:{sat:1,dur:1},mx:{sat:"Bewoners hoeven niet langer in de bouwput te wonen.",dur:"De renovatie, inclusief verduurzaming, wordt gewoon afgemaakt."}},{l:"B · Pauzeren, opnieuw aanbesteden",e:"Goedkoper, bewoners de dupe.",coins:-1,fx:{sat:-2,dur:-1},mx:{sat:"Bewoners blijven langer met stilgevallen bouwwerk zitten.",dur:"De verduurzaming van de woningen loopt vertraging op."}},{l:"C · Zelf tijdelijk afronden",e:"Improviseren, wisselvallig.",coins:-2,fx:{sat:-1},mx:{sat:"Een geïmproviseerde afronding levert een wisselvallig resultaat op voor bewoners."}}],sp:"Bewoners ontzien versus kosten beheersen. Zij zitten nu tussen het stof, maar elke keuze kost meer dan begroot."},
 {id:"C5",t:"Mediastorm om toewijzing",x:"Een landelijk dagblad kopt dat jullie toewijzingsalgoritme bepaalde groepen benadeelt. De wethouder stelt vragen en huurdersorganisaties eisen opheldering.",o:[{l:"A · Onafhankelijk onderzoek",e:"Vertrouwen herstellen.",coins:-1,fx:{comp:2},mx:{comp:"Een onafhankelijk onderzoek toont aantoonbaar aan of het algoritme eerlijk is."}},{l:"B · Eigen analyse delen",e:"Sneller, minder onafhankelijk.",coins:0,fx:{comp:-1},mx:{comp:"Een eigen analyse is minder overtuigend dan onafhankelijk onderzoek."}},{l:"C · Verweren met persbericht",e:"Stelling nemen, riskant.",coins:0,fx:{sat:-2,comp:-1},mx:{sat:"Verdedigend reageren voelt voor huurders als ontkennen in plaats van luisteren.",comp:"Een persbericht toont niet aan dat het algoritme daadwerkelijk eerlijk is."}}],sp:"Vertrouwen herstellen versus snel reageren. Een onafhankelijk onderzoek overtuigt het meest, maar duurt te lang voor de actualiteit van vandaag."},
 {id:"C6",t:"Verhuurderheffing 2.0",x:"Het rijk kondigt onverwacht een nieuwe heffing aan op sociale huurwoningen. Het gat in de begroting is fors — er zal iets moeten sneuvelen.",o:[{l:"A · Bezuinigen op de organisatie",e:"Pijn intern, koers behouden.",coins:-3,fx:{comp:1},mx:{comp:"De begroting blijft op orde zonder de huurder te raken."}},{l:"B · Investeringen temporiseren",e:"Duurzaamheid levert in.",coins:-1,fx:{dur:-2},mx:{dur:"Verduurzamingsprojecten worden vertraagd of geschrapt om de heffing op te vangen."}},{l:"C · Huren verhogen",e:"Huurders betalen mee.",coins:0,fx:{sat:-2,fin:1},mx:{sat:"Huurders betalen mee aan een heffing die zij niet veroorzaakt hebben.",fin:"Extra huurinkomsten dekken het gat in de begroting."}}],sp:"Wie betaalt de onverwachte rekening: de organisatie zelf, de duurzaamheidsagenda, of de huurder? Er is geen optie zonder pijn."}
,
 {id:"N1",t:"De verborgen legionella",x:"Een routinematige watermonster in een complex met veel oudere bewoners toont een verhoogde legionellawaarde. Ontruimen is ingrijpend; niets doen is levensgevaarlijk.",o:[{l:"A · Volledige sanering + tijdelijke evacuatie",e:"Grondig en veilig, zwaar voor bewoners.",coins:-5,fx:{sat:-1,comp:2},mx:{sat:"Een gedwongen evacuatie is ingrijpend, ook al is het voor de veiligheid.",comp:"Volledige sanering pakt het gevaar aantoonbaar en grondig aan."}},{l:"B · Doorspoelen en chloreren, bewoners blijven",e:"Sneller, risico blijft deels.",coins:-2,fx:{comp:-1},mx:{comp:"Bewoners blijven binnen terwijl het risico nog niet volledig weg is."}},{l:"C · Waarschuwingsbrief, zelf laten doorspoelen",e:"Goedkoop, gevaarlijk onverantwoord.",coins:0,fx:{comp:-3,sat:-1},mx:{comp:"Een levensgevaarlijk risico overlaten aan bewoners zelf is onverantwoord.",sat:"Bewoners voelen zich niet beschermd tegen een reëel gezondheidsrisico."}}],sp:"Veiligheid versus impact op kwetsbare bewoners. Legionella is levensgevaarlijk, maar een evacuatie is zwaar voor juist de mensen die het minst kunnen hebben."},
 {id:"N2",t:"Voorrang voor de mantelzorger",x:"Een dochter wil met voorrang een woning naast haar dementerende moeder om mantelzorg te bieden. De urgente wachtlijst staat al vol met medische spoedgevallen.",o:[{l:"A · Mantelzorg-urgentie toekennen",e:"Menselijk, precedent voor de lijst.",coins:-1,fx:{sat:2,comp:-1},mx:{sat:"De dochter kan haar moeder voortaan dagelijks bijstaan.",comp:"Voorrang toekennen buiten de reguliere urgentieregeling wijkt af van het beleid."}},{l:"B · Verwijzen naar reguliere urgentieregeling",e:"Consistent, voelt kil.",coins:0,fx:{sat:-2,comp:1},mx:{sat:"De dochter krijgt geen voorrang en moet gewoon wachten.",comp:"Iedereen wordt volgens dezelfde regeling behandeld."}},{l:"C · Informeel bemiddelen met de buurvrouw",e:"Creatief, buiten de regels om.",coins:-1,fx:{sat:1,comp:-2},mx:{sat:"Een praktische oplossing zonder officiële wachttijd.",comp:"Bemiddelen buiten de officiële regels om is niet transparant of toetsbaar."}}],sp:"Menselijkheid versus consistentie. Voorrang geven voelt goed voor deze dochter, maar ondermijnt het systeem voor iedereen die netjes op zijn beurt wacht."},
 {id:"N3",t:"De burenruzie escaleert",x:"Twee buren liggen al maanden overhoop om geluidsoverlast; de politie is al drie keer langs geweest. Een van beiden dreigt te vertrekken.",o:[{l:"A · Professionele mediation inzetten",e:"Duurder, structurele kans op rust.",coins:-2,fx:{sat:1,comp:1},mx:{sat:"Een neutrale bemiddelaar geeft beide buren evenveel gehoor.",comp:"Een formeel mediationtraject is een zorgvuldige, aantoonbare aanpak."}},{l:"B · Formele waarschuwing aan veroorzaker",e:"Kiest partij, risico op willekeur.",coins:-1,fx:{sat:-1,comp:1},mx:{sat:"Er wordt partij gekozen, wat voor één buur onterecht kan voelen.",comp:"Er wordt tenminste formeel opgetreden tegen de overlast."}},{l:"C · Niet ingrijpen, buren laten oplossen",e:"Gratis, escalatiegevaar.",coins:0,fx:{sat:-2,comp:-1},mx:{sat:"Beide buren voelen zich in de steek gelaten.",comp:"Herhaalde politiebezoeken zonder actie van de corporatie is geen zorgvuldig optreden."}}],sp:"Onpartijdigheid versus snel resultaat. Een waarschuwing kiest partij en kan onterecht voelen; mediation is eerlijker maar kost tijd en geld."},
 {id:"N4",t:"Het gasvrije experiment",x:"Een pilotwijk van 40 woningen kan als eerste in de regio volledig van het gas af, met een unieke subsidie. De techniek is nieuw; bewoners vrezen hoge stookkosten.",o:[{l:"A · Vol inzetten op de pilot",e:"Voorloper, risico bij bewoners.",coins:-4,fx:{dur:3,sat:-1},mx:{dur:"Veertig woningen gaan als koploper volledig van het gas af.",sat:"Bewoners dragen het risico van nieuwe, onbewezen techniek."}},{l:"B · Kleinschalig experiment, 10 woningen",e:"Voorzichtig leren.",coins:-2,fx:{dur:1},mx:{dur:"Een beperkt aantal woningen test de gasvrije techniek alvast."}},{l:"C · Wachten op bewezen techniek elders",e:"Veilig, kans gemist.",coins:0,fx:{dur:-1,sat:1},mx:{dur:"De verduurzamingskans van dit moment wordt niet gepakt.",sat:"Bewoners lopen geen risico met onbewezen techniek."}}],sp:"Voorop lopen versus het risico bij bewoners leggen. Nieuwe techniek kan fantastisch uitpakken, of juist hoge rekeningen opleveren voor mensen die niet kozen om proefkonijn te zijn."},
 {id:"N5",t:"De AI-toewijzingstool",x:"Een leverancier biedt een AI-tool die woningtoewijzing sneller en 'objectiever' zou maken. De werking is niet volledig transparant, maar bespaart veel tijd.",o:[{l:"A · Volledig invoeren",e:"Snel, uitlegbaarheid onzeker.",coins:1,fx:{comp:-1,fin:1},mx:{comp:"Een niet-transparante AI-tool is moeilijk uit te leggen aan een afgewezen woningzoekende.",fin:"De tool bespaart direct veel tijd en dus geld."}},{l:"B · Pilot met menselijke tweede toets",e:"Zorgvuldig, kost tijd.",coins:-2,fx:{comp:1},mx:{comp:"Een menselijke controle op elke AI-beslissing maakt toewijzingen uitlegbaar."}},{l:"C · Afzien, alles handmatig",e:"Veilig, trager en duurder.",coins:0,fx:{comp:1,fin:-1},mx:{comp:"Handmatige toewijzing blijft volledig uitlegbaar en toetsbaar.",fin:"Handmatig werken kost meer tijd en dus geld dan een tool."}}],sp:"Efficiëntie versus uitlegbaarheid. Een AI-tool bespaart tijd, maar wie legt uit waarom een computer iemand een woning weigerde?"},
 {id:"N6",t:"Renteswap onder water",x:"Een jaren geleden afgesloten renteswap staat fors 'onder water' door dalende rente. Vroegtijdig afkopen kost nu veel geld; laten lopen drukt jarenlang op de kasstroom.",o:[{l:"A · Nu afkopen, pijn in één keer",e:"Duur nu, rust later.",coins:-4,fx:{fin:2},mx:{fin:"De jarenlange financiële last verdwijnt in één keer."}},{l:"B · Laten lopen, jaarlijks bijbetalen",e:"Uitstel van de pijn.",coins:-1,fx:{fin:-1},mx:{fin:"De renteswap blijft jaarlijks geld kosten."}},{l:"C · Herstructureren met de bank",e:"Compromis, extra voorwaarden.",coins:-2,fx:{fin:1,comp:-1},mx:{fin:"Herstructureren verlicht de druk op de kasstroom.",comp:"De nieuwe voorwaarden van de bank beperken toekomstige vrijheid."}}],sp:"Pijn nu versus de rekening vooruitschuiven. Afkopen doet in één klap zeer, maar laten lopen betekent jarenlang op de kasstroom drukken."},
 {id:"N7",t:"De asbestdaken",x:"Op tweehonderd schuurtjes en garages ligt verweerd asbesthoudend dakleer. Er is geen wettelijke saneringsplicht meer, maar de risico's nemen toe.",o:[{l:"A · Landelijk saneren, alles ineens",e:"Veilig, forse investering.",coins:-4,fx:{comp:2,dur:1},mx:{comp:"Alle daken worden in één keer veilig en aantoonbaar gesaneerd.",dur:"Verweerd asbest verdwijnt structureel uit het bezit."}},{l:"B · Alleen zichtbaar beschadigde daken",e:"Pragmatisch, restrisico blijft.",coins:-2,fx:{comp:0}},{l:"C · Niets doen, wettelijk geen plicht",e:"Gratis, risico schuift door.",coins:0,fx:{comp:-2,sat:-1},mx:{comp:"Een toenemend risico laten liggen is geen zorgvuldig beheer.",sat:"Bewoners lopen risico zonder dat er iets aan gedaan wordt."}}],sp:"Geen wettelijke plicht versus een moreel risico. Niets doen mag, maar het risico neemt toe en ooit moet iemand het uitleggen."},
 {id:"N8",t:"De onderverhuurder",x:"Een controle wijst uit dat een huurder zijn sociale huurwoning al een jaar onderverhuurt aan toeristen via een platform, tegen een fors hogere prijs.",o:[{l:"A · Direct huurcontract ontbinden",e:"Streng en duidelijk, hard middel.",coins:-1,fx:{comp:2,sat:-1},mx:{comp:"Onderverhuur zonder toestemming wordt hard en duidelijk aangepakt.",sat:"Ontbinding is een harde maatregel die weinig ruimte voor uitleg laat."}},{l:"B · Waarschuwen, kans op herstel geven",e:"Coulant, precedent voor anderen.",coins:0,fx:{comp:-1,sat:1},mx:{comp:"Een overtreding krijgt geen directe consequentie.",sat:"De huurder krijgt een kans om het recht te zetten."}},{l:"C · Boete opleggen, contract laten doorlopen",e:"Snel geld, zwak signaal.",coins:1,fx:{comp:-1},mx:{comp:"Een boete is een zwak signaal tegen winstgevende onderverhuur."}}],sp:"Een streng signaal versus coulance. Ontbinden voorkomt herhaling door anderen, maar een boete int direct geld zonder de huurder op straat te zetten."},
 {id:"N9",t:"Het rouwende gezin",x:"Een huurder overlijdt; de inwonende, net-meerderjarige zoon woont er zijn hele leven maar heeft zelf geen inkomen. De familie wil dat hij mag blijven.",o:[{l:"A · Contract overzetten op de zoon",e:"Menselijk, wijkt af van beleid.",coins:-1,fx:{sat:2,comp:-1},mx:{sat:"De zoon kan in het enige huis blijven wonen dat hij kent.",comp:"Overzetten zonder eigen inkomen wijkt af van het toewijzingsbeleid."}},{l:"B · Tijdelijke overgangsperiode van 6 maanden",e:"Compromis, biedt ademruimte.",coins:-1,fx:{sat:1},mx:{sat:"Het gezin krijgt ademruimte in een moeilijke periode."}},{l:"C · Contract beëindigen volgens de regels",e:"Consequent, hard voor de zoon.",coins:0,fx:{sat:-2,comp:1},mx:{sat:"De zoon verliest vlak na het overlijden ook nog zijn huis.",comp:"Het toewijzingsbeleid wordt consequent toegepast."}}],sp:"Menselijkheid in verdriet versus consequent beleid. Deze zoon zijn hele leven laten blijven voelt logisch, maar het beleid is er niet voor niets."},
 {id:"N10",t:"Het verwilderde groene dak",x:"Twintig complexen kregen vijf jaar geleden groene daken voor de biodiversiteit, maar zonder onderhoudscontract zijn ze nu overwoekerd en lekken enkele daken.",o:[{l:"A · Volledig onderhoudscontract afsluiten",e:"Structureel, kost jaarlijks.",coins:-3,fx:{dur:1,fin:-1},mx:{dur:"De groene daken blijven structureel bijdragen aan de biodiversiteit.",fin:"Een jaarlijks onderhoudscontract kost blijvend geld."}},{l:"B · Alleen de lekkende daken herstellen",e:"Symptoombestrijding.",coins:-1,fx:{dur:-1},mx:{dur:"De overwoekering en het onderliggende probleem blijven bestaan."}},{l:"C · Groene daken verwijderen",e:"Simpel maar een stap terug.",coins:-2,fx:{dur:-2,fin:1},mx:{dur:"De investering in biodiversiteit van vijf jaar geleden gaat verloren.",fin:"Geen onderhoudskosten meer voor de groene daken."}}],sp:"Het duurzaamheidsdoel eren versus onvoorziene structurele kosten. De groene daken waren een mooi idee, maar niemand begrootte het onderhoud."},
 {id:"N11",t:"De chatbot met verkeerd advies",x:"Jullie nieuwe klantenservice-chatbot blijkt huurders al weken verkeerd te informeren over betalingsregelingen, wat tot onterechte aanmaningen leidde.",o:[{l:"A · Uitzetten, alles handmatig herstellen",e:"Grondig, arbeidsintensief.",coins:-2,fx:{sat:1,comp:1},mx:{sat:"Elke gedupeerde huurder krijgt het probleem persoonlijk rechtgezet.",comp:"Onterechte aanmaningen worden volledig en aantoonbaar hersteld."}},{l:"B · Bijstellen, alleen actieve klachten oplossen",e:"Sneller, minder volledig.",coins:-1,fx:{sat:-1},mx:{sat:"Huurders die niet klagen, blijven met een fout dossier zitten."}},{l:"C · Stilzwijgend herstellen, geen ruchtbaarheid",e:"Risicovol als het uitkomt.",coins:0,fx:{comp:-2,sat:-1},mx:{comp:"Een bekende fout niet melden aan getroffen huurders is niet transparant.",sat:"Als het uitkomt, voelt het voor huurders als verzwijgen."}}],sp:"Grondig herstel versus stil de schade beperken. Alles uitzetten en handmatig herstellen is eerlijk naar huurders, maar kost veel capaciteit."},
 {id:"N12",t:"De lege plint",x:"Twintig commerciële ruimtes in de plint van een groot complex staan al twee jaar leeg. Een investeerder biedt een lage maar gegarandeerde huur voor twintig jaar.",o:[{l:"A · Direct tekenen, lage maar zekere huur",e:"Zekerheid, lage opbrengst.",coins:3,fx:{fin:-1},mx:{fin:"De lage huur levert op termijn minder op dan een betere huurder."}},{l:"B · Wachten op een betere huurder",e:"Kans op beter, langer leegstandsverlies.",coins:-2,fx:{fin:1},mx:{fin:"Een betere huurder kan op termijn meer huur opleveren."}},{l:"C · Ombouwen tot sociale voorzieningen",e:"Maatschappelijke winst, geen huur.",coins:-3,fx:{sat:2,fin:-1},mx:{sat:"Bewoners krijgen een voorziening waar ze echt iets aan hebben.",fin:"Sociale voorzieningen leveren geen huurinkomsten op."}}],sp:"Financieel rendement versus maatschappelijke waarde. Een lage huur is zeker geld, maar een sociale voorziening levert iets op dat niet in euro's uit te drukken is."},
 {id:"N13",t:"De keukenbrand",x:"Een keukenbrand door een defecte wasdroger richt grote schade aan in een portiek van acht woningen. De verzekering dekt niet alles; bewoners zitten voorlopig in hotels.",o:[{l:"A · Volledig voorschieten, later verhalen",e:"Bewoners ontzien, onzeker verhaal.",coins:-3,fx:{sat:2},mx:{sat:"Bewoners hoeven niet te wachten op de verzekering om weer thuis te wonen."}},{l:"B · Wachten op de verzekeringsuitkering",e:"Veilig financieel, lange hotelperiode.",coins:-1,fx:{sat:-2},mx:{sat:"Bewoners zitten onnodig lang in een hotel."}},{l:"C · Versneld noodherstel, kort verblijf",e:"Snel, duurder per saldo.",coins:-2,fx:{sat:1,fin:-1},mx:{sat:"Bewoners zijn sneller weer thuis dan bij de verzekeringsroute.",fin:"Versneld herstel is duurder dan de reguliere aanpak."}}],sp:"Bewoners snel weer thuis versus financiële onzekerheid. Voorschieten helpt nu, maar niemand weet zeker wat de verzekering straks alsnog vergoedt."},
 {id:"N14",t:"De discriminatieklacht",x:"Een mysteryonderzoek van een lokale krant suggereert dat woningzoekenden met een niet-Nederlandse achternaam vaker worden afgewezen. Het onderzoek is niet waterdicht, maar de suggestie is er.",o:[{l:"A · Extern vervolgonderzoek + trainingstraject",e:"Grondig, kost tijd en geld.",coins:-2,fx:{comp:2},mx:{comp:"Onafhankelijk onderzoek en training tonen aantoonbaar de wil om het uit te sluiten."}},{l:"B · Eigen interne check, geen extern onderzoek",e:"Sneller, minder geloofwaardig.",coins:0,fx:{comp:0}},{l:"C · De methodologie publiekelijk betwisten",e:"Verdedigend, riskant.",coins:0,fx:{comp:-2,sat:-1},mx:{comp:"Het onderzoek weerleggen zonder eigen onderzoek overtuigt niet.",sat:"Verdedigend reageren op een ernstige suggestie voelt voor huurders ongepast."}}],sp:"Geloofwaardig zelfonderzoek versus je verdedigen. Het onderzoek is niet waterdicht, maar publiekelijk verweer kan defensief overkomen, ook als je gelijk hebt."},
 {id:"N15",t:"De verzamelaar",x:"Bij een noodzakelijke keuring blijkt een huurder de woning volledig te hebben volgestouwd met spullen. Brandgevaar is reëel, maar de huurder heeft duidelijk hulp nodig, geen straf.",o:[{l:"A · Zorgtraject + gefaseerd opruimen",e:"Zorgvuldig, traag proces.",coins:-2,fx:{sat:1,comp:1},mx:{sat:"De huurder krijgt hulp in plaats van alleen een sanctie.",comp:"Het brandgevaar wordt alsnog stap voor stap weggenomen."}},{l:"B · Ontruiming wegens brandgevaar",e:"Snel veilig, hard middel.",coins:-1,fx:{comp:1,sat:-2},mx:{comp:"Het directe brandgevaar wordt onmiddellijk weggenomen.",sat:"Ontruiming voelt als een straf voor iemand die eigenlijk hulp nodig heeft."}},{l:"C · Waarschuwen, zelf laten opruimen",e:"Goedkoop, risico blijft.",coins:0,fx:{comp:-1},mx:{comp:"Een reëel brandgevaar wordt niet actief weggenomen."}}],sp:"Veiligheid nu versus zorg en tijd. Brandgevaar vraagt om snel handelen, maar deze huurder heeft duidelijk hulp nodig, geen straf."},
 {id:"N16",t:"Het windpark naast de wijk",x:"Een energiecoöperatie vraagt of jullie meedoen in een windpark vlak bij een van jullie wijken. Bewoners zijn verdeeld: lagere energielasten tegenover horizonvervuiling.",o:[{l:"A · Volledig instappen als investeerder",e:"Grote impact, hoog risico.",coins:-4,fx:{dur:2},mx:{dur:"Grootschalige investering levert een fors duurzaam energie-aandeel op."}},{l:"B · Alleen meedoen als afnemer",e:"Kleiner voordeel, veiliger.",coins:-1,fx:{dur:1},mx:{dur:"Afname van windenergie draagt beperkt bij aan verduurzaming."}},{l:"C · Niet meedoen",e:"Bewoners tevreden, kans gemist.",coins:0,fx:{dur:-1,sat:1},mx:{dur:"Een kans om bij te dragen aan duurzame energie gaat voorbij.",sat:"Bewoners die tegen het windpark waren, zijn tevreden."}}],sp:"Duurzaamheidsambitie versus draagvlak bij bewoners. Lagere energielasten klinken goed, maar niet iedereen wil een ander uitzicht ervoor terug."},
 {id:"N17",t:"Het vergeten systeem",x:"Een verouderd, allang 'tijdelijk' extern systeem voor de klantenservice blijkt al maanden onbeveiligd toegankelijk vanaf het internet. Niemand weet hoeveel data al is bekeken.",o:[{l:"A · Direct offline halen, groot onderzoek",e:"Grondig, ontwricht de dienstverlening.",coins:-3,fx:{comp:2},mx:{comp:"Een onbeveiligd, maandenlang open systeem wordt grondig en aantoonbaar afgesloten."}},{l:"B · Snel patchen, geen verder onderzoek",e:"Praktisch, onzekerheid blijft.",coins:-1,fx:{comp:-1},mx:{comp:"Zonder onderzoek blijft onduidelijk hoeveel data al is ingezien."}},{l:"C · Laten draaien tot vervanging klaar is",e:"Gemakzuchtig, groot risico.",coins:0,fx:{comp:-3,sat:-1},mx:{comp:"Een bekend beveiligingslek laten voortbestaan is een ernstige nalatigheid.",sat:"Huurdersdata blijft onnodig lang onveilig toegankelijk."}}],sp:"Grondigheid versus dienstverlening laten doorlopen. Het systeem staat al maanden open; offline halen is veilig, maar ontwricht de klantenservice per direct."},
 {id:"N18",t:"De erfpachtclausule",x:"Bij honderd woningen blijkt de erfpachtcanon dit jaar fors te worden herzien, met terugwerkende kracht tot vijf jaar. De gemeente wijst niet mee.",o:[{l:"A · Bezwaar aantekenen en procederen",e:"Kan lonen, kost tijd en onzekerheid.",coins:-2,fx:{comp:1},mx:{comp:"Een juridisch bezwaar toetst zorgvuldig of de herziening wel klopt."}},{l:"B · Betalen en doorberekenen in de huur",e:"Snel opgelost, huurders boos.",coins:1,fx:{sat:-2},mx:{sat:"Huurders draaien direct op voor een canonverhoging die zij niet veroorzaakt hebben."}},{l:"C · Betalen uit eigen reserves",e:"Huurders ontzien, forse aderlating.",coins:-4,fx:{sat:1},mx:{sat:"Huurders merken niets van de hogere erfpachtcanon."}}],sp:"Juridisch gelijk halen versus de rekening neerleggen. Procederen kost tijd en onzekerheid; ondertussen moet iemand de canon toch echt betalen."},
 {id:"N19",t:"De onbereikbare lift",x:"De enige lift in een seniorencomplex van twaalf verdiepingen is defect en onderdelen zijn zes weken leverbaar. Bewoners boven de vierde verdieping zitten praktisch vast.",o:[{l:"A · Spoedimport van onderdelen",e:"Snel opgelost, hoge kosten.",coins:-4,fx:{sat:2},mx:{sat:"Bewoners boven de vierde verdieping zijn snel weer mobiel."}},{l:"B · Tijdelijke hulpdienst regelen",e:"Redelijke overbrugging.",coins:-2,fx:{sat:1},mx:{sat:"Bewoners krijgen een redelijke overbrugging tot de lift het weer doet."}},{l:"C · Wachten op reguliere levering",e:"Goedkoop, zware impact op bewoners.",coins:0,fx:{sat:-3},mx:{sat:"Bewoners boven de vierde verdieping zitten wekenlang vast."}}],sp:"Snel en duur versus goedkoop en zwaar voor bewoners. Senioren op de hoge verdiepingen zitten letterlijk vast zolang de lift stilstaat."},
 {id:"N20",t:"Inkomensverlies na scheiding",x:"Een huurder is net gescheiden en kan de eengezinswoning niet meer op eigen inkomen betalen, maar wil er voor de kinderen kunnen blijven wonen.",o:[{l:"A · Tijdelijke huurkorting toekennen",e:"Steun nu, precedentwerking.",coins:-2,fx:{sat:2},mx:{sat:"Het gezin kan in de vertrouwde woning blijven wonen."}},{l:"B · Actief bemiddelen naar kleinere woning",e:"Lost het structureel op, kost begeleiding.",coins:-1,fx:{comp:1},mx:{comp:"De woning wordt weer passend bij het nieuwe inkomen."}},{l:"C · Reguliere regels toepassen",e:"Consequent, hard voor het gezin.",coins:0,fx:{sat:-2,comp:1},mx:{sat:"Het gezin moet verhuizen boven op een toch al zware periode.",comp:"De regels worden voor iedereen gelijk toegepast."}}],sp:"Steun in een moeilijke periode versus precedentwerking. Een korting helpt dit gezin nu, maar opent de vraag: wie krijgt straks ook korting?"},
 {id:"N21",t:"De klokkenluider",x:"Een medewerker meldt intern dat een leidinggevende structureel onderhoudsbudget verkeerd labelt om targets te halen. Onderzoek kan het teamvertrouwen schaden; negeren kan groter escaleren.",o:[{l:"A · Onafhankelijk onderzoek starten",e:"Zuiver, spanning in het team.",coins:-2,fx:{comp:2,sat:-1},mx:{comp:"Een onafhankelijk onderzoek toont aantoonbaar aan wat er precies gebeurd is.",sat:"Onderzoek naar een leidinggevende zorgt voor spanning in het team."}},{l:"B · Intern, informeel gesprek",e:"Snel, minder grondig.",coins:-1,fx:{comp:0}},{l:"C · Melding wegwuiven",e:"Rust nu, risico later.",coins:0,fx:{comp:-2},mx:{comp:"Een concrete melding van fraude wordt genegeerd."}}],sp:"Integriteit versus teamvertrouwen. Een onderzoek is zuiver, maar kan het vertrouwen binnen het team juist onder druk zetten."},
 {id:"N22",t:"Het voorspellende algoritme",x:"De gemeente vraagt jullie woningdata te delen voor een algoritme dat 'kwetsbare wijken' moet voorspellen. Het doel is goed, maar het risico op stigmatisering van bewoners is reëel.",o:[{l:"A · Volledig meewerken, data delen",e:"Behulpzaam, privacyrisico.",coins:-1,fx:{comp:1,sat:-1},mx:{comp:"Meewerken aan de gemeente-vraag toont goede samenwerking.",sat:"Bewoners lopen risico op stigmatisering door het delen van hun data."}},{l:"B · Alleen geanonimiseerde, samengevoegde data",e:"Balans tussen meewerken en privacy.",coins:-1,fx:{comp:1},mx:{comp:"Meewerken zonder herleidbare data beschermt de privacy van bewoners."}},{l:"C · Niet meewerken",e:"Privacy voorop, gemeente teleurgesteld.",coins:0,fx:{comp:-1,sat:1},mx:{comp:"De gemeente krijgt niet de gevraagde medewerking.",sat:"Bewoners lopen geen risico op stigmatisering door hun data."}}],sp:"Een goed doel dienen versus het risico van stigmatisering. De gemeente wil helpen, maar data over 'kwetsbare wijken' kan tegen bewoners gebruikt worden."}];
const TASK_EN=[
 {id:"A",t:"The mould report",x:"A tenant reports mould in the bedroom via the portal. A four-month-old baby lives with the family. A photo is attached, with the message: this has been going on for three weeks now. The tenant is worried and feels unheard.",o:[{l:"A · Repair now, spare the family",e:"Fast and thorough, even if pricey.",coins:-3,fx:{sat:2,comp:1},mx:{sat:"The family finally feels heard and helped.",comp:"Duty of care for a health risk is met immediately and demonstrably."}},{l:"B · Schedule a regular repair",e:"Via the usual contractor, no priority.",coins:-1,fx:{sat:1},mx:{sat:"Something is at least happening, even if it feels slow."}},{l:"C · Let them ventilate, DIY",e:"Cut costs, ball with the tenant.",coins:0,fx:{sat:-2,comp:-1},mx:{sat:"The tenant feels brushed off with a health complaint.",comp:"'Sort it yourself' isn't a careful approach with a baby in the home."}}],sp:"Customer satisfaction versus cost control. With a baby, reputation and duty of care come on top — one social-media post and it's a media issue."},
 {id:"B",t:"The freelancer",x:"A self-employed person with strongly fluctuating income applies for a social rental home. Last year he earned too much for the income limit; this year he is well below it. He has been registered for seven years and hopes it is finally his turn.",o:[{l:"A · Allocate on current income",e:"The human measure, with a solid file.",coins:-1,fx:{sat:2,comp:-1},mx:{sat:"Seven years of waiting is finally rewarded.",comp:"Allocating on current instead of last year's income departs from the standard test."}},{l:"B · Check further, then decide",e:"Careful, costs time.",coins:-1,fx:{comp:2,sat:-1},mx:{comp:"Extra vetting makes the decision watertight.",sat:"Waiting for another check feels like more delay."}},{l:"C · Reject on the rules",e:"Safe, but disappointing.",coins:0,fx:{comp:1,sat:-2},mx:{comp:"The rules are applied strictly, without exception.",sat:"Seven years of waiting still ends in a rejection."}}],sp:"Speed versus compliance, and legal frameworks versus the human dimension. Seven years of waiting feels unfair, but the accountant tests against the rules, not the feeling."},
 {id:"C",t:"The silent arrears",x:"A tenant is two months in arrears and responds to nothing — no letters, emails or calls. The neighbours say they haven't seen him for weeks. Something uneasy hangs around the home.",o:[{l:"A · Home visit, bring in help",e:"Early signalling with the municipality.",coins:-1,fx:{sat:2,comp:1},mx:{sat:"The tenant gets help instead of just a threat.",comp:"Early signalling with the municipality is exactly the right policy response."}},{l:"B · Start the collections process",e:"Businesslike, by the deadlines.",coins:0,fx:{fin:1,sat:-2},mx:{fin:"The collections process still recovers the arrears.",sat:"A collections letter feels cold for someone who may be in real trouble."}},{l:"C · Send a reminder and wait",e:"Cheap, but risky.",coins:0,fx:{sat:-1,comp:-2},mx:{sat:"A reminder alone doesn't structurally solve anything for the tenant.",comp:"Waiting while there are signs of distress isn't careful practice."}}],sp:"Financial continuity versus social responsibility. Eviction is the most expensive and the worst outcome, for everyone."},
 {id:"D",t:"The refuser",x:"You want to insulate a block of 24 homes and add solar panels. The project needs consent from 70 percent of residents. Six tenants refuse: they fear a rent increase and hassle, and don't trust the plans.",o:[{l:"A · Push on with compensation",e:"Meet residents halfway, costly.",coins:-3,fx:{dur:2,sat:1},mx:{dur:"The whole complex still gets sustainably upgraded.",sat:"Compensation takes the edge off the resistance."}},{l:"B · Phase it and talk again",e:"Calmer, results later.",coins:-1,fx:{dur:1,fin:-1},mx:{dur:"Part of the complex is upgraded already.",fin:"Delay and a second round of talks cost extra time and money."}},{l:"C · Cancel the project",e:"Save money, labels stay low.",coins:0,fx:{dur:-2,sat:1},mx:{dur:"Without insulation and solar panels, energy labels stay low.",sat:"The six refusing tenants get their way."}}],sp:"Affordability versus climate goals. The labels must reach A, but today's tenant pays the bill and mostly feels the hassle."},
 {id:"E",t:"The renovated home",x:"A departing tenant gives notice. During the inspection it turns out he knocked through a wall and rebuilt the bathroom without permission. It looks slick, but nothing is documented or reported.",o:[{l:"A · Take it over, re-let fast",e:"Limit vacancy, pragmatic.",coins:1,fx:{fin:1,comp:-1},mx:{fin:"No vacancy, rent income resumes immediately.",comp:"The unreported renovation is accepted without any check."}},{l:"B · Demand full restoration",e:"Correct, but weeks of vacancy.",coins:-2,fx:{comp:1,fin:-1},mx:{comp:"The home is delivered again per the approved plan.",fin:"Weeks of vacancy during the restoration cost rent income."}},{l:"C · Handle it leniently",e:"Good vibe, less strict.",coins:0,fx:{sat:1,comp:-1},mx:{sat:"The departing tenant isn't hit with extra costs.",comp:"The rule that renovations must be reported is let go."}}],sp:"Vacancy loss versus quality. Every week of discussion costs rent income, while there's a ten-year waiting list at the door."},
 {id:"J1",t:"Boilers in the cold",x:"In mid-January the boilers of twelve homes fail for good. Residents are left in the cold and flood the customer-contact centre with calls — a decision is needed today.",o:[{l:"A · Heat pumps",e:"Future-proof, big investment.",coins:-4,fx:{dur:2,sat:1},mx:{dur:"Heat pumps are the long-term sustainable solution.",sat:"Residents get a future-proof, comfortable solution."}},{l:"B · New gas boilers",e:"Fast and familiar.",coins:-2,fx:{sat:1,dur:-1},mx:{sat:"Hot water and heating are back fast, familiar and simple.",dur:"New gas boilers keep the organisation dependent on gas."}},{l:"C · Temporary heaters",e:"Cheap now, hassle later.",coins:-1,fx:{sat:-1,dur:-1},mx:{sat:"Heaters are a stopgap, not real heating.",dur:"A temporary patch instead of a sustainable choice."}}],sp:"Investing in the future versus delivering heat today. It's the dead of winter, with no time for a careful trade-off."},
 {id:"J2",t:"The data breach",x:"An employee accidentally emails a list of tenant data — including payment arrears — to an external address. Within an hour it's known at the office and the clock starts ticking.",o:[{l:"A · Report to the DPA",e:"Transparent, a small image hit.",coins:-1,fx:{comp:2,sat:-1},mx:{comp:"Reporting to the regulator is exactly what the GDPR requires.",sat:"The breach also becomes visible externally now, which costs some image."}},{l:"B · Investigate internally",e:"Cautious, buy time.",coins:0,fx:{comp:-1},mx:{comp:"Not reporting right away breaches the notification duty."}},{l:"C · Keep it quiet",e:"Risky; this could blow up.",coins:0,fx:{comp:-3,sat:-1},mx:{comp:"Covering up a data breach is a serious GDPR violation.",sat:"If it comes out, it feels like betrayal to tenants."}}],sp:"Transparency versus reputational damage. Reporting is the legally safest route, but feels like confessing before you know the full story."},
 {id:"J3",t:"The playground",x:"The residents' committee of a run-down complex has demanded a renovated courtyard with a playground for two years. They're tired of waiting and threaten to go to the local paper.",o:[{l:"A · Invest, co-design",e:"Involve residents.",coins:-2,fx:{sat:2},mx:{sat:"Residents see their wishes reflected in the design."}},{l:"B · A modest refresh",e:"Do something, save budget.",coins:-1,fx:{sat:1},mx:{sat:"Something finally changes, even if minimal."}},{l:"C · Postpone",e:"Nothing now, grumbling later.",coins:0,fx:{sat:-1},mx:{sat:"Two years of waiting gets extended again, with no clear outlook."}}],sp:"Satisfaction versus budget discipline. A playground isn't a legal duty, but two years of waiting erodes trust in you."},
 {id:"J4",t:"The hard rejection",x:"A single mother applies for a home; her income is 800 euros over the limit. Her situation is distressing and well documented, but the rules are crystal clear.",o:[{l:"A · Allocate via free margin",e:"Human measure, file in order.",coins:-1,fx:{sat:2,comp:-1},mx:{sat:"A distressing case still gets a home.",comp:"The free-margin rule is used to deviate from the norm."}},{l:"B · Reject, refer warmly",e:"Follow the rules, kindly.",coins:0,fx:{comp:1,sat:-1},mx:{comp:"The income limit is simply applied, as it should be.",sat:"A rejection is still a rejection, even with a warm referral."}},{l:"C · Reject flatly",e:"Fast, but cold.",coins:0,fx:{comp:1,sat:-2},mx:{comp:"The rules are followed strictly.",sat:"A cold rejection with no further explanation hurts extra."}}],sp:"The human dimension versus consistent rules. One exception feels fair, but opens the door to the next twenty borderline cases."},
 {id:"J5",t:"The maintenance contract",x:"A contractor offers 15% off for a three-year maintenance contract, but wants to sign this week. There's no time for a careful comparison with other parties.",o:[{l:"A · Sign for the discount",e:"Immediate gain, less control.",coins:2,fx:{comp:-1},mx:{comp:"Signing without comparison bypasses procurement policy."}},{l:"B · Get three quotes",e:"Careful, costs time.",coins:0,fx:{comp:1},mx:{comp:"A careful comparison of suppliers is good procurement practice."}},{l:"C · Negotiate quickly",e:"A bit of both.",coins:1,fx:{}}],sp:"Quick gain versus careful procurement. The discount is tempting, but signing without comparison can prove costlier later."},
 {id:"J6",t:"The status holders",x:"The municipality asks you to house extra status holders this quarter. The waiting list for regular applicants is already long and the pressure comes from both sides.",o:[{l:"A · Commit fully",e:"Meet the agreements.",coins:0,fx:{comp:2,sat:-1},mx:{comp:"The agreement with the municipality is fully honoured.",sat:"Regular applicants see no progress on the waiting list."}},{l:"B · Commit half, phase",e:"Seek balance.",coins:0,fx:{comp:1},mx:{comp:"Part of the agreement is honoured, phased and manageable."}},{l:"C · Postpone this quarter",e:"Regular list first.",coins:0,fx:{comp:-1,sat:1},mx:{comp:"The agreement with the municipality isn't honoured.",sat:"Regular applicants get priority on the list."}}],sp:"Obligations to the municipality versus your own waiting list. Every commitment to one group can feel like a broken promise to the other."},
 {id:"J7",t:"The rent increase",x:"It's 1 July: inflation is high and so is your investment agenda. The annual rent increase must be set, somewhere between affordability and the budget.",o:[{l:"A · Maximum increase",e:"Budget on track, tenants grumble.",coins:2,fx:{sat:-2},mx:{sat:"The maximum increase hits tenants directly in the wallet."}},{l:"B · Moderate increase",e:"A fair middle.",coins:1,fx:{}},{l:"C · Freeze this year",e:"Tenants happy, less income.",coins:-1,fx:{sat:2},mx:{sat:"Tenants feel no extra cost burden this year."}}],sp:"Budget discipline versus affordability. What keeps the organisation financially healthy hurts tenants in the wallet."},
 {id:"J8",t:"The cannabis smell",x:"The neighbourhood manager reports a strong cannabis smell and blocked-out windows at a home. The neighbours complain of heat nuisance and feel unsafe.",o:[{l:"A · Police + termination",e:"Decisive, costs time and money.",coins:-1,fx:{comp:1,sat:1},mx:{comp:"A nuisance complaint and a cannabis suspicion are handled seriously and by the book.",sat:"Neighbours finally feel heard and safer."}},{l:"B · Warn and monitor",e:"Give a chance, risk remains.",coins:0,fx:{comp:-1},mx:{comp:"A suspicion isn't escalated straight to the police."}},{l:"C · Just watch",e:"Looking away can backfire.",coins:0,fx:{comp:-2,sat:-1},mx:{comp:"A clear nuisance signal is ignored.",sat:"Neighbours are left with the unsafe feeling."}}],sp:"Decisiveness versus due care. Acting on a suspicion feels harsh if it turns out unfounded, but waiting can be dangerous."},
 {id:"J9",t:"Solar panels with subsidy",x:"A subsidy scheme covers half of a solar-panel project on 100 homes, but the application deadline is in three weeks. The organisation is already swamped.",o:[{l:"A · Go all in",e:"All hands on deck.",coins:-3,fx:{dur:2,sat:1},mx:{dur:"A hundred homes get solar panels in one go.",sat:"Residents quickly benefit from lower energy bills."}},{l:"B · Small pilot",e:"Start cautiously.",coins:-1,fx:{dur:1},mx:{dur:"A limited number of homes get solar panels already."}},{l:"C · Skip it",e:"Focus elsewhere, chance missed.",coins:0,fx:{dur:-1},mx:{dur:"The subsidy chance for sustainability upgrades passes by."}}],sp:"A unique opportunity versus the organisation's limited capacity. Dropping everything for the subsidy can come at the cost of ongoing work."},
 {id:"J10",t:"The legacy system",x:"The vendor of your outdated repair system raises the licence fee by 40%. Migrating to the integrated platform is possible, but costs money and attention now.",o:[{l:"A · Migrate",e:"Invest in the future.",coins:-3,fx:{comp:1,fin:1},mx:{comp:"A modern, supported system is easier to demonstrably keep in order.",fin:"The integrated platform's licence costs are lower in the long run."}},{l:"B · Pay and postpone",e:"Calm now, costs remain.",coins:-2,fx:{}},{l:"C · Build a workaround",e:"Cheap, fragile.",coins:0,fx:{comp:-1,fin:-1},mx:{comp:"A homemade workaround isn't officially supported or checked.",fin:"A fragile fix leads to extra repair costs later."}}],sp:"A structural investment versus short-term calm. Migrating costs money and attention now, but delaying only piles up the problem."},
 {id:"J11",t:"The confused tenant",x:"A tenant with confused behaviour causes serious nuisance in a stairwell and the neighbours threaten to leave. Care seems out of the picture and the situation is escalating.",o:[{l:"A · Care partners + municipality",e:"Lasting fix, costs time.",coins:-1,fx:{comp:1,sat:1},mx:{comp:"The right care partners are brought in, as it should be.",sat:"Neighbours see something actually being done about the nuisance."}},{l:"B · Legal route",e:"Quick calm, hard on the tenant.",coins:-2,fx:{sat:1},mx:{sat:"The nuisance stops quickly for the neighbours."}},{l:"C · Reassure neighbours, wait",e:"Delay, nuisance remains.",coins:0,fx:{sat:-1,comp:-1},mx:{sat:"The nuisance simply continues.",comp:"A signal that professional care is needed gets ignored."}}],sp:"Care for the tenant versus peace for the neighbours. The legal route works faster, but doesn't solve the underlying problem."},
 {id:"J12",t:"The home swap",x:"Two tenants want to swap homes: an older lady in a family house and a young family in an apartment. It requires double checking and a fair bit of admin.",o:[{l:"A · Cooperate, check fully",e:"Happy tenants, extra work.",coins:-1,fx:{sat:1,comp:1},mx:{sat:"Both tenants get the home that suits them better.",comp:"A full check keeps the swap demonstrably in order."}},{l:"B · Cooperate, light checks",e:"Faster, more risk.",coins:0,fx:{sat:1,comp:-1},mx:{sat:"Both tenants are happy and helped quickly.",comp:"Light vetting leaves room for errors in the file."}},{l:"C · Reject",e:"Relieve the team, disappoint.",coins:0,fx:{sat:-1},mx:{sat:"Both tenants stay stuck where they don't want to live."}}],sp:"Customer satisfaction versus team capacity. Two happy tenants is great, but full double vetting costs time you don't have elsewhere."},
 {id:"C1",t:"Energy prices double",x:"Energy prices explode. Tenants in poorly insulated homes get into trouble and the media are all over it — the pressure to act is high.",o:[{l:"A · Open a fund",e:"Support tenants, costs money.",coins:-2,fx:{sat:2},mx:{sat:"Tenants get immediate financial relief."}},{l:"B · Speed up insulation",e:"Structural, big investment.",coins:-3,fx:{dur:2,sat:1},mx:{dur:"Poorly insulated homes get structurally improved.",sat:"Lower energy bills in the long run."}},{l:"C · Refer to state schemes",e:"Nothing yourself, tenants suffer.",coins:0,fx:{sat:-2},mx:{sat:"Tenants feel left to fend for themselves in the energy crisis."}}],sp:"Quick relief versus a structural fix. An emergency fund helps now, but insulation solves the problem for good — if you can afford it."},
 {id:"C2",t:"Cyberattack",x:"Ransomware takes the collections system down for two weeks. Tenants can't pay and the administration jams; the question is: report it or keep it quiet?",o:[{l:"A · Forensics + report",e:"Transparent and thorough.",coins:-2,fx:{comp:1},mx:{comp:"A thorough investigation and report follow the incident notification duty."}},{l:"B · Own IT fixes it",e:"Faster, less complete.",coins:-1,fx:{comp:-1},mx:{comp:"Without external forensics, the cause stays unclear."}},{l:"C · Keep it quiet",e:"Risky.",coins:0,fx:{comp:-2},mx:{comp:"Covering up a cyber incident conflicts with the notification duty."}}],sp:"Transparency versus speed under crisis pressure. Reporting is thorough, but while the incident is ongoing nobody yet knows how big the problem is."},
 {id:"C3",t:"ESG reporting now",x:"New EU regulation requires a sustainability report immediately. Your data on labels and consumption is scattered across five systems and countless spreadsheets.",o:[{l:"A · Set up a data project",e:"All central, reusable.",coins:-2,fx:{comp:1,dur:1},mx:{comp:"Centralised data makes reporting demonstrable and repeatable.",dur:"An overview of labels and usage lays the groundwork for targeted sustainability work."}},{l:"B · Outsource the report",e:"Quick, costs money.",coins:-2,fx:{comp:1},mx:{comp:"The reporting obligation is met on time."}},{l:"C · Report minimally",e:"Comply on paper, risk.",coins:0,fx:{comp:-2},mx:{comp:"Minimal reporting doesn't really meet the new regulation."}}],sp:"A structural fix versus quickly meeting the deadline. A data project helps for good, but the law won't wait for your pace."},
