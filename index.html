<!DOCTYPE html>
<html lang="nl" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Behind the Front Door — Spelbord · Zig Grow</title>
<style>
  :root{--blue:#1F5AFF;--orange:#FF9000;--navy:#152330;--ink:#152330;--muted:#5B6472;--line:#E4E3DC;--bg:#FBF7EE;
    --card:#FFFFFF;--warn:#E4572E;--soft:#EAF0FF;--softwarm:#FFF1E0;--shadow:0 10px 30px rgba(21,35,48,.10);--shadow-sm:0 4px 14px rgba(21,35,48,.07);}
  @media (prefers-color-scheme:dark){:root{--ink:#EDF1F7;--muted:#9AA7BD;--line:#26324A;--bg:#0D1626;--card:#131E31;--soft:#16233D;--softwarm:#2A2010;--shadow:0 10px 30px rgba(0,0,0,.45);--shadow-sm:0 4px 14px rgba(0,0,0,.35);}}
  *{box-sizing:border-box}html,body{margin:0}
  body{font-family:Arial,Helvetica,"Segoe UI",sans-serif;color:var(--ink);min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased;
    background:radial-gradient(900px 520px at 12% -12%,#FFF4DF 0%,transparent 55%),radial-gradient(1100px 700px at 100% 0%,#F4E8CF 0%,transparent 52%),radial-gradient(1500px 950px at 50% 125%,#E4D3AE 0%,transparent 55%),linear-gradient(162deg,#F4EAD7,#EADCC0);background-attachment:fixed}
  @media (prefers-color-scheme:dark){body{background:radial-gradient(1200px 700px at 50% -10%,#17253f 0%,transparent 55%),linear-gradient(162deg,#101b31,#0b1322);background-attachment:fixed}}
  .wrap{max-width:1200px;margin:0 auto;padding:0 18px 70px}
  button{font-family:inherit}.logo{height:30px;width:auto;display:block}
  header.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line)}
  .top-in{max-width:1200px;margin:0 auto;padding:11px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brandline{display:flex;align-items:center;gap:13px;min-width:0}.brandline h1{font-size:17px;margin:0;font-weight:800;letter-spacing:-.2px;white-space:nowrap}.brandline .sub{color:var(--muted);font-size:12px;white-space:nowrap}
  .spacer{flex:1 1 auto}
  .join-chip{display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px}.join-chip b{font-family:Consolas,monospace;letter-spacing:2px;color:var(--blue)}
  .netchip{font-size:12px;font-weight:800;padding:6px 10px;border-radius:9px;white-space:nowrap}.netchip.live{background:#e5f7ee;color:#137a44}.netchip.off{background:#fff1e0;color:#b3391b}
  .btn{border:0;border-radius:11px;padding:9px 15px;font-size:14px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.06);transition:transform .05s,filter .15s}
  .btn:hover{filter:brightness(1.06)}.btn:active{transform:translateY(1px)}
  .btn.ghost{background:transparent;color:var(--blue);border:1.5px solid var(--blue);box-shadow:none}
  .btn.soft{background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none}.btn.warn{background:var(--orange)}
  .btn.sm{padding:6px 11px;font-size:12.5px;border-radius:9px}.btn.big{padding:13px 22px;font-size:16px;border-radius:13px}.btn:disabled{opacity:.45;cursor:default;filter:none}
  .roundbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0 6px}
  .roundbar .rpill{background:var(--navy);color:#fff;border-radius:999px;padding:7px 15px;font-weight:800;font-size:14px}
  .roundbar .rpill .n{color:var(--orange);margin-inline-end:6px}
  .hint{color:var(--muted);font-size:13.5px;margin:2px 2px 16px}
  .grid{display:grid;grid-template-columns:.82fr 1.18fr;gap:20px;align-items:start}
  @media (max-width:940px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px}
  .panel h2{margin:0 0 12px;font-size:14px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted)}
  /* standings */
  .lane{display:flex;align-items:center;gap:9px;margin:8px 0}
  .lane .rankn{flex:0 0 24px;text-align:center;font-weight:900;font-size:15px;color:var(--muted)}
  .lane .lname{flex:0 0 84px;font-weight:800;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lane .track{position:relative;flex:1;height:24px;border-radius:13px;border:1px solid #dcd3bf;background:repeating-linear-gradient(90deg,#efe8d8 0 7px,#e6ddc8 7px 14px)}
  @media (prefers-color-scheme:dark){.lane .track{border-color:#2c3852;background:repeating-linear-gradient(90deg,#1b2740 0 7px,#223052 7px 14px)}}
  .lane .track .finish{position:absolute;right:5px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.75}
  .lane .pawn{position:absolute;top:50%;transform:translate(-50%,-50%);width:23px;height:23px;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 5px rgba(21,35,48,.4);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:12px;z-index:2;transition:left .6s cubic-bezier(.4,1.2,.5,1)}
  .lane.up .pawn{outline:3px solid var(--orange);outline-offset:1px}
  .lane .lscore{flex:0 0 30px;text-align:right;font-weight:800;font-size:14px}
  /* team dashboards mini */
  .twrap{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:520px){.twrap{grid-template-columns:1fr}}
  .tmini{border:1px solid var(--line);border-radius:12px;padding:10px 11px;background:var(--card);box-shadow:var(--shadow-sm)}
  .tmini.up{outline:2px solid var(--orange)}
  .tmini .th{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:5px}
  .tmini .tn{font-weight:800;font-size:13.5px;display:flex;align-items:center;gap:6px}
  .tmini .dot{width:12px;height:12px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 1px 2px rgba(0,0,0,.25)}
  .coins{font-weight:800;font-size:12.5px;color:#7a4100;border:1px solid #e7b768;border-radius:20px;padding:2px 9px;white-space:nowrap;background:linear-gradient(180deg,#ffe392,#f3b73f);box-shadow:inset 0 1px 0 rgba(255,255,255,.65)}
  .mrow{display:flex;gap:5px;align-items:center;font-size:11px;margin:3px 0}
  .mrow .ml{flex:0 0 78px;color:var(--muted)}
  .bar{position:relative;flex:1;height:9px;border-radius:6px;border:1px solid #d7cfbd;background:repeating-linear-gradient(90deg,#ece5d6 0,#ece5d6 calc(5% - 1px),#d1c9b6 calc(5% - 1px),#d1c9b6 5%);overflow:hidden}
  @media (prefers-color-scheme:dark){.bar{border-color:#2c3852;background:repeating-linear-gradient(90deg,#1b2740 0,#1b2740 calc(5% - 1px),#2c3852 calc(5% - 1px),#2c3852 5%)}}
  .bar>span{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--blue),#4d7bff);transition:width .4s cubic-bezier(.4,1.3,.5,1)}
  .bar.red>span{background:linear-gradient(90deg,var(--warn),#ff7a54)}
  .mv{flex:0 0 20px;text-align:right;font-weight:800;font-size:11px}
  .tmini .st{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);display:flex;justify-content:space-between;font-size:12px}.tmini .st b{font-size:15px}
  .miniflag{font-size:9.5px;font-weight:800;color:#fff;background:var(--warn);border-radius:5px;padding:1px 5px}
  .minichance{margin-top:7px;border-radius:9px;padding:6px 8px;font-size:11.5px;border:1px solid}
  .minichance.good{background:#e9f9f0;border-color:#8fddb4;color:#137a44}.minichance.bad{background:#fdeee9;border-color:#f2b3a1;color:#b3391b}
  @media (prefers-color-scheme:dark){.minichance.good{background:#12301f;border-color:#1f5a3a}.minichance.bad{background:#331912;border-color:#5a2a1c}}
  /* stage */
  .stage{min-height:430px;display:flex;flex-direction:column}
  .announce{text-align:center;padding:20px 14px;border-radius:16px;color:#fff;font-weight:900;font-size:26px;letter-spacing:.3px;margin-bottom:14px;box-shadow:var(--shadow);animation:announce .75s cubic-bezier(.2,.9,.3,1.2) both}
  .announce .sub{font-size:14px;font-weight:700;opacity:.92;margin-top:3px}
  @keyframes announce{0%{opacity:0;transform:scale(.6) translateY(18px)}45%{opacity:1;transform:scale(1.05)}72%{transform:scale(.98)}100%{transform:scale(1)}}
  .gc{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card);box-shadow:0 18px 38px rgba(21,35,48,.18),0 3px 0 rgba(21,35,48,.05);transform-origin:center}
  .gc.deal{animation:deal .7s cubic-bezier(.2,.9,.3,1.1) both}
  @keyframes deal{0%{opacity:0;transform:translateY(30px) rotateY(70deg) scale(.92)}55%{opacity:1;transform:translateY(0) rotateY(-5deg) scale(1.01)}100%{transform:none}}
  .gc .illo{height:170px;background-size:cover;background-position:center;position:relative}
  .gc .illo .kind{position:absolute;left:0;bottom:0;padding:6px 14px;font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:#fff;border-top-right-radius:12px}
  .gc.scenario .illo .kind,.gc.journey .illo .kind{background:var(--blue)}.gc.crisis .illo .kind{background:var(--warn)}.gc.shock .illo .kind{background:var(--orange)}
  .gc .body{padding:16px}.gc .ct{font-size:20px;font-weight:800;margin:0 0 8px;letter-spacing:-.2px}.gc .cx{font-size:15px;margin:0 0 10px}
  .gc .meta{font-size:13px;color:var(--muted);margin:8px 0 0}.gc .meta b{color:var(--ink)}
  .opt{border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-top:9px}.opt .ol{font-weight:800;font-size:14px;margin-bottom:2px}.opt .oe{font-size:12.5px;color:var(--muted)}
  .tag{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:2px 7px;margin:3px 4px 0 0}
  .tag.pay{background:var(--softwarm);color:#8a4b00}.tag.gain{background:#e5f7ee;color:#137a44}.tag.up{background:#e5f0ff;color:#0a44c9}.tag.down{background:#fdece9;color:#b3391b}
  .pickbtns{display:flex;flex-direction:column;gap:9px;margin-top:12px}
  .pickbtns .btn{text-align:start;padding:13px 15px;font-size:15px}
  .quiz{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
  @media (max-width:540px){.quiz{grid-template-columns:1fr}}
  .qopt{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer;font-size:13.5px;font-weight:700;background:var(--card)}
  .qopt input{width:17px;height:17px;accent-color:var(--blue)}
  .banner{background:var(--soft);border:1px solid var(--line);border-inline-start:5px solid var(--orange);border-radius:12px;padding:12px 14px;font-size:14px;margin-top:12px}.banner b{color:var(--ink)}
  .result{border-radius:14px;padding:14px 16px;margin-top:12px;border:1px solid;animation:deal .5s ease both}
  .result.good{background:#e9f9f0;border-color:#8fddb4}.result.bad{background:#fdeee9;border-color:#f2b3a1}.result.neu{background:var(--soft);border-color:var(--line)}
  .result .rh{font-weight:800;font-size:15px;margin-bottom:4px}
  .result .delta{font-weight:900;font-size:15px;margin-top:6px}
  @media (prefers-color-scheme:dark){.result.good{background:#12301f;border-color:#1f5a3a}.result.bad{background:#331912;border-color:#5a2a1c}}
  .ctrls{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px;justify-content:flex-end}
  .waitline{color:var(--muted);font-size:14px;text-align:center;padding:14px}
  /* deck back for chance */
  .deckmini{width:64px;height:88px;border-radius:11px;background:radial-gradient(60px 60px at 30% 20%,rgba(255,144,0,.25),transparent 60%),linear-gradient(150deg,#1b3fb0,var(--blue) 40%,var(--navy));box-shadow:var(--shadow);border:2px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;color:var(--orange);font-size:34px;font-weight:900}
  select,input[type=text],input[type=number]{font-family:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
  label.fld{display:block;font-size:12.5px;color:var(--muted);font-weight:700;margin:0 0 4px}
  .setup-row{display:grid;grid-template-columns:1.4fr .6fr auto;gap:10px;align-items:end;margin-bottom:10px}
  .cover{height:220px;border-radius:14px;background:#FBF3E4 center/contain no-repeat;margin-bottom:14px;box-shadow:var(--shadow-sm)}
  .rank{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:13px;margin-bottom:10px;background:var(--card);box-shadow:var(--shadow-sm)}
  .rank .pos{font-size:22px;font-weight:900;color:var(--blue);width:34px;text-align:center}.rank.first{border-color:var(--orange);background:var(--softwarm)}
  .rank .rn{font-weight:800;font-size:16px}.rank .rs{margin-inline-start:auto;font-size:22px;font-weight:900}.rank .rd{font-size:12px;color:var(--muted)}
  footer{color:var(--muted);font-size:12.5px;text-align:center;margin-top:34px;padding-top:16px;border-top:1px solid var(--line)}
  .hide{display:none!important}
  /* player */
  .player-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .join-card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:30px;max-width:430px;width:100%;text-align:center}
  .join-card .logo{height:34px;margin:0 auto 8px}.join-card .jc-cover{height:150px;border-radius:14px;background:#FBF3E4 center/contain no-repeat;margin:6px 0 18px}
  .join-card h1{font-size:22px;margin:0 0 4px}.join-card p.s{color:var(--muted);font-size:14px;margin:0 0 18px}
  .join-card .fldwrap{text-align:start;margin-bottom:14px}.join-card input,.join-card select{width:100%}
  .pnet{font-size:13px;font-weight:700;border-radius:10px;padding:10px 12px;margin:0 0 16px;text-align:start;line-height:1.4}.pnet.live{background:#e5f7ee;color:#137a44}.pnet.off{background:#fff1e0;color:#b3391b}
  .yourturn{text-align:center;padding:16px;border-radius:16px;color:#fff;font-weight:900;font-size:22px;margin-bottom:14px;box-shadow:var(--shadow);animation:announce .7s cubic-bezier(.2,.9,.3,1.2) both}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--orange);margin:0 3px;animation:pulse 1.2s infinite}.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
  @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
</style>
</head>
<body>

<div id="facilitator">
  <header class="top"><div class="top-in">
    <div class="brandline" id="brand"></div><div class="spacer"></div>
    <div class="join-chip"><span id="roomLbl">Kamer</span>&nbsp;<b id="roomCode">----</b></div>
    <span id="netStatus" class="netchip off"></span>
    <button class="btn ghost sm" id="soundToggle" title="Geluid">🔊</button>
    <button class="btn ghost sm" id="fxToggle" title="Effecten">👁</button>
    <button class="btn ghost sm" id="langToggle">EN</button>
    <button class="btn ghost sm" id="copyJoin">Join-link</button>
    <button class="btn soft sm" id="resetGame">Nieuw spel</button>
  </div></header>
  <div class="wrap">
    <div class="roundbar" id="roundBar"></div>
    <div class="hint" id="roundHint"></div>

    <section id="view-setup" class="panel hide">
      <div class="cover" style="background-image:url('assets/buurt.jpg')"></div>
      <h2 id="setupH">Teams instellen</h2>
      <p class="hint" id="setupP" style="margin-top:0"></p>
      <div id="setupRows"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">
        <button class="btn soft sm" id="addTeam">+ Team toevoegen</button>
        <button class="btn warn" id="startGame">Spel starten →</button>
      </div>
    </section>

    <section id="view-play" class="grid hide">
      <div><div class="panel">
        <h2 id="standH">Stand</h2>
        <div id="standBoard"></div>
        <div style="height:12px"></div>
        <div class="twrap" id="teamMini"></div>
      </div></div>
      <div><div class="panel"><div class="stage" id="stage"></div></div></div>
    </section>

    <section id="view-scores" class="panel hide">
      <h2 id="scoresH">Eindstand</h2>
      <p class="hint" id="scoresP" style="margin-top:0"></p>
      <div id="scoreWrap"></div>
      <div style="margin-top:12px"><button class="btn soft sm" id="againBtn">Nieuw spel</button></div>
    </section>

    <footer id="footNL"></footer>
  </div>
</div>

<div id="player" class="player-shell hide">
  <div class="join-card">
    <div id="pLogo"></div>
    <div class="jc-cover" style="background-image:url('assets/buurt.jpg')"></div>
    <div id="pNet" class="pnet"></div>
    <div id="joinForm">
      <h1 id="jfH">Doe mee</h1><p class="s" id="jfSub"></p>
      <div class="fldwrap"><label class="fld" id="jfRoomL" for="pRoom">Kamercode</label><input type="text" id="pRoom" maxlength="6" placeholder="AB3K" autocomplete="off"></div>
      <div class="fldwrap"><label class="fld" id="jfNameL" for="pName">Jouw naam</label><input type="text" id="pName" autocomplete="off"></div>
      <div class="fldwrap"><label class="fld" id="jfTeamL" for="pTeam">Team</label><select id="pTeam"><option value="1">Team 1</option><option value="2">Team 2</option><option value="3">Team 3</option><option value="4">Team 4</option><option value="5">Team 5</option><option value="6">Team 6</option></select></div>
      <button class="btn warn big" id="joinBtn" style="width:100%">Meedoen →</button>
    </div>
    <div id="joinWaiting" style="display:none"><h1 id="jwH">Je bent binnen! 🎉</h1><p class="s"><b id="joinWho"></b> — <span id="jwRoomL">kamer</span> <b id="joinRoomEcho"></b></p><p style="font-size:14px" id="jwWait"></p><div class="pnet off" id="jwBanner" style="text-align:start"></div></div>
  </div>
</div>

function randCode(){const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";for(let i=0;i<4;i++)s+=a[Math.floor(Math.random()*a.length)];return s;}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function load(){try{const r=localStorage.getItem(LS);if(r)return JSON.parse(r);}catch(e){}return null;}
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function teamById(id){return state.teams.find(t=>t.id===id);}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function logoSVG(){return document.getElementById("logoTpl").innerHTML;}
function tcolor(id){return TEAM_COLORS[(id-1)%TEAM_COLORS.length];}
function score(t){const base=t.sat+t.fin+t.comp+t.dur+Math.floor(t.coins/2);const flags=["sat","fin","comp","dur"].filter(k=>t[k]<5).length;return {total:base-flags*5,penalty:flags*5,flags};}
function sfx(kind){if(!SOUND)return;try{_actx=_actx||new (window.AudioContext||window.webkitAudioContext)();const c=_actx,t=c.currentTime;
 if(kind==="draw"){const o=c.createOscillator(),g=c.createGain();o.type="triangle";o.frequency.setValueAtTime(200,t);o.frequency.exponentialRampToValueAtTime(680,t+.18);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.11,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+.3);o.connect(g).connect(c.destination);o.start(t);o.stop(t+.32);}
 else if(kind==="click"){const o=c.createOscillator(),g=c.createGain();o.type="square";o.frequency.setValueAtTime(520,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.07,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+.12);o.connect(g).connect(c.destination);o.start(t);o.stop(t+.13);}
 else if(kind==="coin"){[880,1320].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain(),tt=t+i*.07;o.type="sine";o.frequency.setValueAtTime(f,tt);g.gain.setValueAtTime(.0001,tt);g.gain.exponentialRampToValueAtTime(.09,tt+.01);g.gain.exponentialRampToValueAtTime(.0001,tt+.2);o.connect(g).connect(c.destination);o.start(tt);o.stop(tt+.22);});}
}catch(e){}}

/* ============ deck / turn engine ============ */
function popPool(name){if(!state.pool[name]||!state.pool[name].length)state.pool[name]=shuffle(POOL_SRC[name].slice());return state.pool[name].shift();}
function dealCard(round,ti){
  const key=round+"-"+ti;if(state.dealt[key])return state.dealt[key];
  const type=ROUNDS[round].type;let card;
  if(type==="scenario"){const id=popPool("scenario");const sc=CONTENT.nl.scenario[id];const correct=sc.dep.slice();const distract=shuffle(DEPTS.map((d,i)=>i).filter(i=>!correct.includes(i))).slice(0,Math.max(0,8-correct.length));card={type,id,opts:shuffle(correct.concat(distract)),correct};}
  else if(type==="shock")card={type,id:"S"};
  else card={type,id:popPool("action")};
  state.dealt[key]=card;return card;
}
function cardData(card){const c=curContent();if(card.type==="scenario")return c.scenario[card.id];if(card.type==="shock")return c.shock.S;return card.id[0]==="J"?c.journey[card.id]:c.crisis[card.id];}
function curCard(){return state.dealt[state.round+"-"+state.turnIdx];}
function curTeam(){return state.order.length?teamById(state.order[state.turnIdx]):null;}
function startGame(){
  state.teams=state.setup.map((s,i)=>({id:i+1,name:s.name||("Team "+(i+1)),sat:10,fin:10,comp:10,dur:10,coins:12+(parseInt(s.bonus)||0)}));
  state.order=state.teams.map(t=>t.id);state.phase="playing";state.dealt={};state.pool={};state.incomeDone={};
  enterRound(0);
}
function enterRound(r){
  state.round=r;state.stage="roundintro";state.turnIdx=0;state.resolved=false;state.turnResult=null;state.choiceRec=null;state.chance={};
  const inc=ROUNDS[r].income||0;if(inc>0&&!state.incomeDone[r]){state.order.forEach(id=>{teamById(id).coins+=inc;});state.incomeDone[r]=true;}
  render();
}
function beginRound(){state.stage="turn";state.turnIdx=0;state.resolved=false;state.turnResult=null;state.choiceRec=null;dealCard(state.round,0);sfx("draw");render();}
function resolveChoice(teamId,opt){
  if(state.resolved)return;const card=curCard();if(!card||card.type==="scenario")return;const d=cardData(card),o=d.o[opt],t=teamById(teamId);if(!o)return;
  t.coins=Math.max(0,t.coins+o.coins);Object.keys(o.fx||{}).forEach(k=>{t[k]=clamp(t[k]+o.fx[k],0,20);});
  state.choiceRec={opt};state.turnResult={kind:"choice",coins:o.coins,fx:o.fx,label:o.l};state.resolved=true;sfx("click");render();
}
function resolveQuiz(teamId,sel){
  if(state.resolved)return;const card=curCard();if(!card||card.type!=="scenario")return;const t=teamById(teamId);
  const correct=card.correct,cs=sel.filter(i=>correct.includes(i)).length,ws=sel.filter(i=>!correct.includes(i)).length;
  let munt=0;if(cs>=3)munt+=1;if(cs>=3&&ws===0)munt+=1;t.coins+=munt;
  state.turnResult={kind:"quiz",munt,cs,ws,correct};state.resolved=true;sfx(munt>0?"coin":"click");render();
}
function nextTurn(){
  state.turnResult=null;state.choiceRec=null;
  if(state.turnIdx<state.order.length-1){state.turnIdx++;state.resolved=false;dealCard(state.round,state.turnIdx);sfx("draw");render();}
  else{if(ROUNDS[state.round].chance){state.stage="chance";render();}else nextRound();}
}
function drawChance(teamId){
  if(state.stage!=="chance"||state.chance[teamId]!=null)return;const t=teamById(teamId);if(!t)return;
  const card=CHANCE_NL[Math.floor(Math.random()*CHANCE_NL.length)];
  t.coins=Math.max(0,t.coins+card.coins);Object.keys(card.fx||{}).forEach(k=>{t[k]=clamp(t[k]+card.fx[k],0,20);});
  state.chance[teamId]=card.id;sfx(card.good?"coin":"click");render();
}
function allChanceDone(){return state.order.every(id=>state.chance[id]!=null);}
function nextRound(){if(state.round>=ROUNDS.length-1){state.phase="scores";render();}else enterRound(state.round+1);}

function renderSetup(){const h=$("#setupRows");h.innerHTML="";state.setup.forEach((s,i)=>{const r=document.createElement("div");r.className="setup-row";r.innerHTML='<div><label class="fld">'+TT("tname")+'</label><input type="text" data-setup="name" data-i="'+i+'" value="'+esc(s.name)+'" style="width:100%"></div><div><label class="fld">'+TT("qbonus")+'</label><input type="number" min="0" max="4" data-setup="bonus" data-i="'+i+'" value="'+s.bonus+'" style="width:100%"></div><div><button class="btn soft sm" data-delteam="'+i+'" '+(state.setup.length<=1?"disabled":"")+'>'+TT("remove")+'</button></div>';h.appendChild(r);});}

      '<div class="st"><span style="color:var(--muted)">'+TT("stand")+(scv.flags?' <span class="miniflag">Aw −'+scv.penalty+'</span>':'')+'</span><b>'+scv.total+'</b></div>'+

    wrap.insertAdjacentHTML("beforeend",el);});

function tagFx(o){let s="";if(o.coins<0)s+='<span class="tag pay">🪙 −'+Math.abs(o.coins)+'</span>';if(o.coins>0)s+='<span class="tag gain">🪙 +'+o.coins+'</span>';Object.keys(o.fx||{}).forEach(k=>{const v=o.fx[k];s+='<span class="tag '+(v>0?"up":"down")+'">'+met()[k]+' '+(v>0?"+":"")+v+'</span>';});if(o.coins===0&&!Object.keys(o.fx||{}).length)s+='<span class="tag">'+TT("noEff")+'</span>';return s;}

      return '<div style="width:200px;text-align:center"><div class="deckmini" style="margin:0 auto 8px">🎲</div><div style="font-weight:800;margin-bottom:6px;color:'+col+'">'+esc(t.name)+'</div><button class="btn warn sm" data-hchance="'+t.id+'">'+TT("drawChance")+'</button></div>';}).join("")+'</div>';
    h+='<div class="ctrls" style="justify-content:center;margin-top:18px"><button class="btn warn" id="nextRoundBtn" '+(allChanceDone()?"":"disabled")+'>'+(state.round>=ROUNDS.length-1?TT("toScores"):TT("nextRound"))+'</button></div>';
    if(!allChanceDone())h+='<p class="waitline">'+esc(TT("waitChance"))+'</p>';
    h+='</div>';
  }
  stage.innerHTML=h;
}
function renderScores(){const w=$("#scoreWrap");const Mn=met();const ranked=state.teams.map(t=>({t,s:score(t)})).sort((a,b)=>b.s.total-a.s.total);
  w.innerHTML=ranked.map((r,i)=>'<div class="rank'+(i===0?" first":"")+'"><div class="pos">'+(i===0?"🏆":(i+1))+'</div><div><div class="rn">'+esc(r.t.name)+'</div><div class="rd">'+Mn.sat+' '+r.t.sat+' · '+Mn.fin+' '+r.t.fin+' · '+Mn.comp+' '+r.t.comp+' · '+Mn.dur+' '+r.t.dur+' · 🪙/2 '+Math.floor(r.t.coins/2)+(r.s.penalty?' · Aw −'+r.s.penalty:'')+'</div></div><div class="rs">'+r.s.total+'</div></div>').join("");
}

/* ============ events (host) ============ */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-setup],[data-delteam],[data-hact],[data-hchance],#addTeam,#startGame,#beginRoundBtn,#nextTurnBtn,#nextRoundBtn,#resetGame,#againBtn,#copyJoin,#langToggle,#soundToggle,#fxToggle");
  if(!el)return;
  if(el.id==="copyJoin"){copyJoin(el);return;}
  if(el.id==="soundToggle"){SOUND=!SOUND;if(state)state.sound=SOUND;save();$("#soundToggle").textContent=SOUND?"🔊":"🔇";return;}
  if(el.id==="fxToggle"){state.showEffects=!state.showEffects;render();return;}
  if(el.id==="langToggle"){state.lang=(L()==="nl"?"en":"nl");render();return;}
  if(el.dataset.delteam!=null){state.setup.splice(parseInt(el.dataset.delteam),1);renderSetup();return;}
  if(el.id==="addTeam"){if(state.setup.length<6){state.setup.push({name:"Team "+(state.setup.length+1),bonus:0});renderSetup();}return;}
  if(el.id==="startGame"){startGame();return;}
  if(el.id==="beginRoundBtn"){beginRound();return;}
  if(el.id==="nextTurnBtn"){nextTurn();return;}
  if(el.id==="nextRoundBtn"){nextRound();return;}
  if(el.dataset.hchance!=null){drawChance(parseInt(el.dataset.hchance));return;}
  if(el.dataset.hact==="choice"){resolveChoice(curTeam().id,parseInt(el.dataset.opt));return;}
  if(el.dataset.hact==="quiz"){const sel=$$('#stage [data-dep]:checked').map(x=>parseInt(x.dataset.dep));resolveQuiz(curTeam().id,sel);return;}
  if(el.id==="resetGame"||el.id==="againBtn"){if(confirm(TT("confirm"))){const rm=state.room,lg=state.lang;state=freshState();state.room=rm;state.lang=lg;SOUND=state.sound!==false;render();}return;}
});
document.addEventListener("input",e=>{const el=e.target;if(el.dataset&&el.dataset.setup){state.setup[parseInt(el.dataset.i)][el.dataset.setup]=el.dataset.setup==="bonus"?clamp(parseInt(el.value)||0,0,4):el.value;}});

function copyJoin(btn){const base=location.href.split("?")[0].split("#")[0];const link=base+"?role=player&room="+state.room+"&lang="+L();const done=()=>{const o=btn.textContent;btn.textContent=TT("copied");setTimeout(()=>btn.textContent=o,1400);};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(link).then(done,()=>prompt("Join-link:",link));else prompt("Join-link:",link);}

/* ============ realtime ============ */
let PLAYER=null;
const FB=(window.FIREBASE_CONFIG&&window.FIREBASE_CONFIG.databaseURL)?window.FIREBASE_CONFIG:null;
function fbReady(){return !!(FB&&window.firebase&&firebase.database);}
function pubSnapshot(){
  const team=curTeam(),card=(state.phase==="playing"&&state.stage==="turn")?curCard():null;
  let cp=null;
  if(card){const d=cardData(card);
    if(card.type==="scenario")cp={type:"scenario",cat:"assets/"+(CAT[card.id]||"buurt")+".jpg",title:d.t,text:d.x,tension:d.sp,opts:card.opts.map(i=>({i,label:dep(i)})),correct:card.correct};
    else cp={type:card.type,cat:"assets/"+(CAT[card.id]||"buurt")+".jpg",title:d.t,text:d.x,options:d.o.map(o=>({l:o.l,tags:tagFx(o)}))};
  }
  return {lang:L(),phase:state.phase,stage:state.stage,showEffects:!!state.showEffects,
    roundLabel:state.phase==="playing"?TT("rounds")[ROUNDS[state.round].id]:"",curTeamId:team?team.id:null,curTeamName:team?team.name:"",resolved:!!state.resolved,
    card:cp,turnResult:state.resolved?state.turnResult:null,
    teams:state.teams.map(t=>{const sc=score(t);const ch=state.chance[t.id]?curContent().chance[state.chance[t.id]]:null;return {id:t.id,name:t.name,color:tcolor(t.id),sat:t.sat,fin:t.fin,comp:t.comp,dur:t.dur,coins:t.coins,score:sc.total,flags:sc.flags,chance:ch?{t:ch.t,fx:chFx(ch),good:ch.good}:null};})};
}
const NET={db:null,role:null,room:null,seen:{},
  initHost(){if(!fbReady())return;try{firebase.initializeApp(FB);}catch(e){}this.db=firebase.database();this.role="host";this.room=state.room;
    this.db.ref("rooms/"+this.room+"/act").on("value",s=>this.processActs(s.val()||{}));this.publish();},
  processActs(v){let changed=false;Object.keys(v).forEach(kk=>{const a=v[kk];if(!a||!a.ts)return;if(this.seen[kk]===a.ts)return;this.seen[kk]=a.ts;
    if(a.type==="choice"&&state.stage==="turn"&&curTeam()&&curTeam().id===a.teamId&&!state.resolved){resolveChoice(a.teamId,a.opt);changed=true;}
    else if(a.type==="quiz"&&state.stage==="turn"&&curTeam()&&curTeam().id===a.teamId&&!state.resolved){resolveQuiz(a.teamId,a.sel||[]);changed=true;}
    else if(a.type==="chance"&&state.stage==="chance"&&state.chance[a.teamId]==null){drawChance(a.teamId);changed=true;}});
  },
  publishIfHost(){if(this.role==="host"&&this.db)this.publish();},
  publish(){if(this.db)this.db.ref("rooms/"+this.room+"/pub").set(pubSnapshot());},
  initPlayer(room,cb){if(!fbReady())return false;try{firebase.initializeApp(FB);}catch(e){}this.db=firebase.database();this.role="player";this.room=room;this.db.ref("rooms/"+room+"/pub").on("value",s=>cb(s.val()));return true;},
  presence(room,pid,info){if(this.db)this.db.ref("rooms/"+room+"/players/"+pid).set(info);},
  send(room,teamId,obj){if(this.db)this.db.ref("rooms/"+room+"/act/"+teamId+"_"+obj.type).set(Object.assign({teamId,ts:Date.now()},obj));}
};

/* ============ render: player ============ */
function pt(l,k){return (T[l]||T.nl)[k];}
function pmeter(k,v,Mn){return '<div class="mrow"><span class="ml">'+Mn[k]+'</span><span class="bar'+(v<5?" red":"")+'"><span style="width:'+(v/20*100)+'%"></span></span><span class="mv">'+v+'</span></div>';}
function showPlayerBoard(){const p=document.getElementById("player");p.classList.remove("player-shell");p.innerHTML='<header class="top"><div class="top-in"><div class="brandline">'+logoSVG()+'<div><h1>Behind the Front Door</h1><div class="sub">'+esc(PLAYER.name)+' · '+esc(PLAYER.teamLabel)+'</div></div></div></div></header><div class="wrap"><div id="pBoard" style="padding-top:18px"></div><footer>'+pt(PLAYER.lang,"footS")+'</footer></div>';renderPlayer(null);}
function renderPlayer(pub){
  const host=document.getElementById("pBoard");if(!host)return;const l=(pub&&pub.lang)||PLAYER.lang;PLAYER.lang=l;const Mn=MET[l];
  if(!pub){host.innerHTML='<div class="panel"><h2>'+pt(l,"jwRoom")+' '+esc(PLAYER.room)+'</h2><p class="hint" style="margin:0">'+pt(l,"waitstart")+'<span class="dot"></span><span class="dot"></span><span class="dot"></span></p></div>';return;}
  const my=(pub.teams||[]).find(t=>t.id===PLAYER.teamId);
  const myTurn=pub.stage==="turn"&&pub.curTeamId===PLAYER.teamId&&!pub.resolved&&pub.card;
  const myChance=pub.stage==="chance"&&my&&!my.chance;
  let top="";
  if(pub.phase==="scores"){top='<div class="panel" style="text-align:center"><h2>'+pt(l,"done")+'</h2>'+(my?'<p>'+pt(l,"yourFinal")+' <b style="font-size:20px">'+my.score+'</b></p>':'')+'<p class="hint" style="margin:0">'+pt(l,"seeBoard")+'</p></div>';}
  else if(myTurn){top='<div class="yourturn" style="background:linear-gradient(135deg,'+(my?my.color:"#1F5AFF")+',#0002)">'+pt(l,"yourTurn")+'</div>';}
  else if(pub.stage==="turn"&&pub.curTeamName){top='<div class="panel" style="text-align:center"><b style="color:'+((pub.teams.find(t=>t.id===pub.curTeamId)||{}).color||"#1F5AFF")+'">'+esc(pub.curTeamName)+'</b> '+pt(l,"theirTurn")+' — '+pt(l,"waitTurn")+'<span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';}
  else if(pub.stage==="chance"&&!myChance){top='<div class="panel" style="text-align:center">🎲 '+pt(l,"chanceH")+'</div>';}
  else {top='<div class="panel" style="text-align:center">'+esc(pub.roundLabel||"")+'</div>';}
  let mid="";
  if(myTurn){const c=pub.card;mid='<div class="panel" style="margin-top:14px"><div class="gc '+c.type+' deal"><div class="illo" style="background-image:url(\''+esc(c.cat)+'\')"></div><div class="body"><p class="ct">'+esc(c.title)+'</p><p class="cx">'+esc(c.text)+'</p>';
    if(c.type==="scenario"){mid+='<p class="meta"><b>'+pt(l,"chooseDeps")+'</b></p><div class="quiz">'+c.opts.map(o=>'<label class="qopt"><input type="checkbox" data-dep="'+o.i+'"> '+esc(o.label)+'</label>').join("")+'</div><button class="btn warn big" data-pact="quiz" style="width:100%">'+pt(l,"confirm2")+'</button>';}
    else{mid+='<p class="meta"><b>'+pt(l,"chooseAB")+'</b></p><div class="pickbtns">'+c.options.map((o,i)=>'<button class="btn '+(i===0?"":"soft")+'" data-pact="choice" data-opt="'+i+'">'+esc(o.l)+(pub.showEffects?' <span style="font-weight:400;opacity:.8">· '+o.tags+'</span>':'')+'</button>').join("")+'</div>';}
    mid+='</div></div></div>';}
  else if(myChance){mid='<div class="panel" style="margin-top:14px;text-align:center"><div class="deckmini" style="margin:0 auto 12px">🎲</div><button class="btn warn big" data-pchance="1">'+pt(l,"drawChance")+'</button></div>';}
  let dash="";
  if(my){const ch=my.chance;dash='<div class="panel" style="margin-top:14px"><div class="th" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><b>'+esc(my.name)+'</b><span class="coins">🪙 '+my.coins+'</span></div>'+["sat","fin","comp","dur"].map(k=>pmeter(k,my[k],Mn)).join("")+'<div class="st" style="display:flex;justify-content:space-between;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)"><span style="color:var(--muted)">'+pt(l,"stand")+'</span><b>'+my.score+'</b></div>'+(ch?'<div class="minichance '+(ch.good?"good":"bad")+'" style="margin-top:8px">'+(ch.good?"🍀 ":"⚡ ")+esc(ch.t)+' — '+esc(ch.fx)+'</div>':'')+'</div>';}
  host.innerHTML=top+mid+dash;
}
function localizeJoin(l){$("#jfH").textContent=pt(l,"joinH");$("#jfSub").textContent=pt(l,"joinSub");$("#jfRoomL").textContent=pt(l,"roomcode");$("#jfNameL").textContent=pt(l,"yourname");$("#jfTeamL").textContent=pt(l,"teamw");$("#pName").placeholder=pt(l,"yourname");$("#joinBtn").textContent=pt(l,"joinbtn");$("#jwH").textContent=pt(l,"youin");$("#jwRoomL").textContent=pt(l,"jwRoom");$("#jwWait").innerHTML=pt(l,"waitstart")+'<span class="dot"></span><span class="dot"></span><span class="dot"></span>';$("#jwBanner").textContent=pt(l,"jwBanner");document.documentElement.lang=l;}
function initPlayer(room,plang){
  document.getElementById("pLogo").innerHTML=logoSVG();$("#facilitator").classList.add("hide");$("#player").classList.remove("hide");if(room)$("#pRoom").value=room;localizeJoin(plang);
  const live=fbReady();const pn=$("#pNet");pn.className="pnet "+(live?"live":"off");pn.textContent=live?pt(plang,"pNetLive"):pt(plang,"pNetOff");
  document.addEventListener("click",e=>{const b=e.target.closest("[data-pact],[data-pchance]");if(!b||!PLAYER)return;
    if(b.dataset.pchance){sfx("draw");NET.send(PLAYER.room,PLAYER.teamId,{type:"chance"});b.disabled=true;return;}
    if(b.dataset.pact==="choice"){sfx("click");NET.send(PLAYER.room,PLAYER.teamId,{type:"choice",opt:parseInt(b.dataset.opt)});$$('#pBoard [data-pact]').forEach(x=>x.disabled=true);return;}
    if(b.dataset.pact==="quiz"){sfx("click");const sel=$$('#pBoard [data-dep]:checked').map(x=>parseInt(x.dataset.dep));NET.send(PLAYER.room,PLAYER.teamId,{type:"quiz",sel});$$('#pBoard [data-pact]').forEach(x=>x.disabled=true);return;}
  });
  $("#joinBtn").addEventListener("click",()=>{const name=$("#pName").value.trim()||(plang==="en"?"Player":"Speler");const code=($("#pRoom").value.trim().toUpperCase())||"----";const teamId=parseInt($("#pTeam").value);const teamLabel=$("#pTeam").selectedOptions[0].textContent;
    PLAYER={pid:randCode()+randCode(),name,teamId,teamLabel,room:code,lang:plang};
    if(NET.initPlayer(code,renderPlayer)){NET.presence(code,PLAYER.pid,{name,team:teamId});showPlayerBoard();}
    else{$("#joinWho").textContent=name+" · "+teamLabel;$("#joinRoomEcho").textContent=code;$("#joinForm").style.display="none";$("#joinWaiting").style.display="block";}
  });
}

/* ============ boot ============ */
(function boot(){
  const p=new URLSearchParams(location.search);
  if(p.get("role")==="player"){initPlayer((p.get("room")||"").toUpperCase(),p.get("lang")==="en"?"en":"nl");return;}
  state=load()||freshState();if(!state.room)state.room=randCode();if(!state.lang)state.lang="nl";if(!state.dealt)state.dealt={};if(!state.pool)state.pool={};if(!state.chance)state.chance={};if(!state.incomeDone)state.incomeDone={};if(!state.order)state.order=[];SOUND=state.sound!==false;
  render();NET.initHost();
})();
</script>
